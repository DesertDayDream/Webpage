    player.burnTickTimer = BURN_TICK_INTERVAL;
    player.burnDps = msg.burn.dps;
    player.burnAttackerId = msg.from;
  }
  // A ranged weapon with Extinguish on (e.g. a water gun) douses our own
  // burn status on hit — same idea as applyDamageToEnemy()'s extinguish
  // handling, just on the player side since a remote player's hp/status is
  // only ever owned by their own client.
  if (msg.extinguish && player.burnTimer > 0) {
    player.burnTimer = 0; player.burnTickTimer = 0; player.burnDps = 0; player.burnAttackerId = null;
    spawnFlash('EXTINGUISHED', player.x, player.y - 20, '#7fd8ff');
  }
});
// Host-routed like 'hit'/'claim' — a just-eliminated victim reports who
// killed them so the host (sole owner of playerScores) can credit both sides.
Net.on('eliminated', msg => {
  if (isHost && mpMode === 'ffa') applyEliminationLocally(msg.killerId, msg.from);
});
// Target-routed like 'hitPlayer' — delivers a kill-streak reward to whichever
// non-host player earned it.
Net.on('killstreakReward', msg => applyPickupEffect(msg.kind, msg.amount));

Net.onClose = () => {
  if (STATE === 'mpBrowse' || STATE === 'mpLobby' || STATE === 'mpName' || STATE === 'mpConnect' || STATE === 'mpPlaying') {
    mpConnectError = 'Disconnected from multiplayer server.';
    STATE = 'mpConnect';
  }
};

function enterMultiplayer() {
  STATE = 'mpConnect';
  mpConnectError = '';
  if (Net.ws && Net.ws.readyState === WebSocket.OPEN && Net.playerId) {
    STATE = 'mpBrowse';
    Net.send('list');
    return;
  }
  Net.connect(() => {
    const savedName = localStorage.getItem('mercs_player_name');
    if (savedName) {
      Net.send('hello', { name: savedName });
    } else {
      TextEntry.start('', 16, name => {
        const finalName = (name || '').trim() || 'Player';
        localStorage.setItem('mercs_player_name', finalName);
        Net.send('hello', { name: finalName });
      }, () => { STATE = 'start'; Net.close(); });
      STATE = 'mpName';
    }
  }, () => { mpConnectError = 'Could not connect to the multiplayer server.'; });
}

function startMultiplayerMatch(msg) {
  mpMode = msg.mode === 'ffa' ? 'ffa' : 'coop';
  mySpawnIndex = msg.players.findIndex(p => p.id === Net.playerId);
  mpLoadoutOverlayOpen = false;
  mpScoreboardHeld = false;
  // FFA players pick a loadout before entering the arena; coop goes straight
  // into mpPlaying exactly as before. An empty loot pool can't populate the
  // loadout screen with anything selectable, so fall straight through to the
  // devtool-configured defaults instead of softlocking on an empty screen.
  STATE = (mpMode === 'ffa' && lootPoolEntries().length > 0) ? 'mpLoadout' : 'mpPlaying';
  isHost = Net.playerId === msg.hostId;
  nextEnemyId = 1; nextPickupId = 1;
  netBroadcastTimer = 0;
  mpDowned = false;
  mpRespawnTimer = 0;
  mpMatchId = null;
  myCharacter = loadMyCharacter();
  myCharacterSent = false;

  remotePlayers = new Map();
  playerScores = {};
  mpCombo = 0; mpComboTimer = 0; mpPeakCombo = 0;
  comboMilestone = ''; comboMilestoneTimer = 0;
  msg.players.forEach(p => {
    playerScores[p.id] = { name: p.name, score: 0, kills: 0, deaths: 0, streak: 0 };
    if (p.id !== Net.playerId) {
      remotePlayers.set(p.id, { name: p.name, x: undefined, y: undefined, facing: 'S', hp: 100, maxHp: 100, weaponName: 'WEAPON_PISTOL', character: null });
    }
  });

  resetPlayerForMatch();
}

// Finds the nearest connected player to a point — used by host-simulated
// enemy movement so enemies chase whoever's closest, not just the host.
function nearestPlayerTo(x, y) {
  let best = { x: player.x, y: player.y, dist: Math.hypot(player.x - x, player.y - y) };
  if (player.hp <= 0) best.dist = Infinity;
  remotePlayers.forEach(rp => {
    if (rp.hp <= 0 || rp.x === undefined) return;
    const d = Math.hypot(rp.x - x, rp.y - y);
    if (d < best.dist) best = { x: rp.x, y: rp.y, dist: d };
  });
  return best;
}

// This client's own player HP hit 0 mid-match — freeze locally, start a
// countdown to an automatic respawn (devtool's PLAYER > Respawn Time), and
// keep receiving network updates in the meantime. The match itself only
// ends when the timer runs out — being downed is now always temporary.
function goDowned() {
  mpDowned = true;
  mpRespawnTimer = CONFIG.PLAYER.respawnTime;
}

// Brings this client's own player back into the fight once the respawn
// countdown reaches zero — keeps whatever weapon/ammo they had, just
// restores HP/position and a brief window of contact-damage immunity.
function respawnPlayer() {
  mpDowned = false;
  mpRespawnTimer = 0;
  player.hp = CONFIG.PLAYER.hp; player.maxHp = CONFIG.PLAYER.hp;
  const spawn = (mpMode === 'ffa') ? ffaSpawnPoint(mySpawnIndex) : MAP_CONFIG.playerStart;
  player.x = spawn.x; player.y = spawn.y;
  camera.x = Math.max(0, Math.min(MAP_W - CW, player.x - CW/2));
  camera.y = Math.max(0, Math.min(MAP_H - CH, player.y - CH/2));
  player.invincible = 2;
  player.burnTimer = 0; player.burnTickTimer = 0; player.burnDps = 0; player.burnAttackerId = null;
  spawnFlash('RESPAWNED', player.x, player.y - 20, '#3ef83e');
}

// Host-only: tells the server (and thus every client, itself included, via
// the 'ended' broadcast) that the match is over.
function endMultiplayerMatch() {
  if (!isHost) return;
  Net.send('end', { scores: playerScores, peakCombo: mpPeakCombo, elapsed: Math.floor(elapsed) });
}

function updateRemotePlayers(dt) {
  const lerpRate = Math.min(1, 12 * dt);
  remotePlayers.forEach(rp => {
    if (rp.meleeSwingTimer > 0) rp.meleeSwingTimer -= dt * 1000;
    if (rp.targetX === undefined) return;
    rp.x += (rp.targetX - rp.x) * lerpRate;
    rp.y += (rp.targetY - rp.y) * lerpRate;
  });
}

function drawRemotePlayers(ctx) {
  remotePlayers.forEach(rp => {
    if (rp.x === undefined || rp.hp <= 0) return;
    if (rp.character) {
      drawCharacterAt(ctx, rp.character, rp.x, rp.y, PLAYER_SIZE, PLAYER_SIZE, rp.facing || 'S');
    } else {
      SPRITES.draw('PLAYER_' + (rp.facing || 'S'), ctx, rp.x, rp.y, PLAYER_SIZE, PLAYER_SIZE, 0);
    }
    ctx.fillStyle = '#8a88a0';
    ctx.font = '11px VT323, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(rp.name || '', rp.x, rp.y - PLAYER_SIZE/2 - 6);
    ctx.textAlign = 'left';

    // Melee arc indicator — mirrors the local player's version in drawPlayer().
    if (rp.meleeSwingTimer > 0) {
      const frac = rp.meleeSwingTimer / rp.meleeSwingDuration;
      ctx.save();
      ctx.globalAlpha = 0.25 * frac;
      ctx.strokeStyle = '#f0c840';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.meleeSwingRange, rp.meleeSwingAngle - MELEE_ARC/2, rp.meleeSwingAngle + MELEE_ARC/2);
      ctx.stroke();
      ctx.restore();
    }
  });
}

// Broadcasts this client's own state ~10/sec, plus the host's authoritative
// shared state (enemies/pickups/timer/scores) at the same rate — bundled
// into a single 'hostState' message instead of 4 separate sends, since each
// separate WebSocket send is its own frame with its own overhead, and the
// server fans every one of them out to every other player in the lobby.
function updateMultiplayerNet(dt) {
  netBroadcastTimer += dt;
  if (netBroadcastTimer < 0.1) return;
  netBroadcastTimer = 0;

  const playerData = {
    x: player.x, y: player.y, facing: player.facing,
    hp: mpDowned ? 0 : player.hp, maxHp: player.maxHp,
    weaponName: EQUIPPED_RANGED.name,
    burning: player.burnTimer > 0, // cosmetic-only for other clients, see updateBurningVisuals()
  };
  // Sent once, not every tick — it never changes mid-match and WebSocket
  // delivery is reliable, so there's nothing to gain from repeating it.
  if (!myCharacterSent) { playerData.character = myCharacter; myCharacterSent = true; }
  Net.send('state', { kind: 'player', data: playerData });

  if (isHost) {
    Net.send('state', { kind: 'hostState', data: {
      enemies: enemies.map(e => ({
        id: e.id, x: e.x, y: e.y, hp: e.hp, maxHp: e.maxHp, type: e.type,
        flashTimer: e.flashTimer, deathTimer: e.deathTimer, angle: e.angle,
        burning: e.burnTimer > 0, // cosmetic-only for non-host clients, see updateBurningVisuals()
      })),
      pickups: pickups.map(p => ({
        id: p.id, kind: p.kind, x: p.x, y: p.y, timer: p.timer,
        amount: p.amount, weaponName: p.weaponName, category: p.category,
      })),
      mainTimer, elapsed,
      scores: playerScores, combo: mpCombo, comboTimer: mpComboTimer,
      milestone: comboMilestone, milestoneTimer: comboMilestoneTimer,
    }});

    // Being downed is now temporary (goDowned/respawnPlayer) — a single
    // player going down never ends the match anymore. But if literally
    // everyone happens to be down at the same moment (a full wipe), that's
    // still a hard end rather than waiting on independent respawn timers.
    // Remote hp is broadcast as 0 while a player is downed (see the
    // 'player' state payload below), so rp.hp <= 0 doubles as "currently
    // downed" from the host's point of view. Doesn't apply to FFA — everyone
    // being simultaneously eliminated is normal there, not a wipe; the match
    // only ends on the timer.
    const allDowned = mpDowned && Array.from(remotePlayers.values()).every(rp => rp.hp <= 0);
    if (mpMode !== 'ffa' && allDowned) endMultiplayerMatch();
  }
}

function uiButton(ctx, x, y, w, h, label, action, opts) {
  opts = opts || {};
  const disabled = !!opts.disabled;
  ctx.fillStyle = disabled ? 'rgba(255,255,255,0.02)' : 'rgba(255,255,255,0.06)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = disabled ? '#3a384e' : '#3ef83e';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.fillStyle = disabled ? '#5a5870' : '#3ef83e';
  ctx.font = opts.font || '20px VT323, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w/2, y + h/2 + 7);
  ctx.textAlign = 'left';
  if (!disabled) uiButtons.push({ x, y, w, h, action });
}

// One volume row: a label, a [-]/[+] pair, and a filled bar showing the
// current 0-100 value. get()/set() are the getMusicVolume/setMusicVolume-
// style pair for whichever slider this row controls.
function drawVolumeRow(ctx, y, label, get, set) {
  const rowCenterX = CW/2, barW = 160, barH = 14, step = 10;
  const value = get();

  ctx.textAlign = 'right';
  ctx.fillStyle = '#8a88a0'; ctx.font = '16px VT323, monospace';
  ctx.fillText(label, rowCenterX - 90, y + 5);

  const minusX = rowCenterX - 78;
  uiButton(ctx, minusX, y - 13, 26, 26, '-', () => set(value - step), { font: '16px VT323, monospace' });

  const barX = minusX + 34;
  ctx.fillStyle = '#1a1a2a';
  ctx.fillRect(barX, y - 6, barW, barH);
  ctx.fillStyle = value > 0 ? '#3ef83e' : '#3a384e';
  ctx.fillRect(barX, y - 6, Math.round(barW * value / 100), barH);
  ctx.strokeStyle = '#3a384e'; ctx.lineWidth = 1;
  ctx.strokeRect(barX + 0.5, y - 5.5, barW - 1, barH - 1);

  const plusX = barX + barW + 10;
  uiButton(ctx, plusX, y - 13, 26, 26, '+', () => set(value + step), { font: '16px VT323, monospace' });

  ctx.textAlign = 'left';
  ctx.fillStyle = '#c8c6e0'; ctx.font = '14px VT323, monospace';
  ctx.fillText(value + '%', plusX + 34, y + 5);
}

// m:ss, for a leaderboard entry's total time played.
function formatDuration(sec) {
  const s = Math.max(0, Math.floor(sec));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

// Shared by both leaderboard screens — the per-entry rank/initials/score line
// plus a smaller subtext line underneath for combo/kills/time. `entry.combo`,
// `.kills`, `.duration` come straight from the server's leaderboard row.
function drawLeaderboardRow(ctx, entry, i, y, colRank, colInitials, colScore) {
  const isNew = i === justSavedIndex;
  ctx.font = (isNew ? 'bold ' : '') + '20px VT323, monospace';
  ctx.fillStyle = isNew ? '#3ef83e' : (i === 0 ? '#f0e040' : '#c8c6e0');
  ctx.textAlign = 'left';
  ctx.fillText((i+1) + '.', colRank, y);
  ctx.fillText(entry.initials, colInitials, y);
  ctx.textAlign = 'right';
  ctx.fillText(entry.score.toString().padStart(8,'0'), colScore, y);

  ctx.font = '12px VT323, monospace';
  ctx.fillStyle = '#5a5870';
  ctx.fillText(
    'COMBO x' + (entry.combo||0) + '   KILLS ' + (entry.kills||0) + '   TIME ' + formatDuration(entry.duration||0),
    colScore, y + 15
  );
}

  ctx.fillText('TEAM LEADERBOARD', CW/2, 76);

  const lb = mpLeaderboardEntries;
  const colRank = CW/2 - 170, colInitials = CW/2 - 100, colScore = CW/2 + 170;
  const startY = 112, rowH = 40;

  if (lb.length === 0) {
    ctx.fillStyle = '#5a5870';
    ctx.font = '18px VT323, monospace';
    ctx.fillText(mpLeaderboardLoading ? 'LOADING...' : 'NO TEAM RUNS YET', CW/2, startY + 20);
  }

  lb.forEach((entry, i) => drawLeaderboardRow(ctx, entry, i, startY + i * rowH, colRank, colInitials, colScore));
  ctx.textAlign = 'center';

  const bw = 220, bh = 44, bx = CW/2 - bw/2, by = startY + Math.max(lb.length, 1) * rowH + 20;
  uiButton(ctx, bx, by, bw, bh, '[ BACK TO LOBBIES ]', () => { STATE = 'mpBrowse'; Net.send('list'); });
  ctx.textAlign = 'left';
}

// === SCORING & TIMER ===

function updateTimers(dt) {
  if (STATE !== 'playing' && STATE !== 'mpPlaying') return;
  // Non-host MP clients don't run the authoritative timer/spawn logic at all —
  // they just receive mainTimer/elapsed via the host's periodic broadcast.
  if (STATE === 'mpPlaying' && !isHost) return;

  mainTimer -= dt;
  elapsed   += dt;
  if (mainTimer <= 0) {
    mainTimer = 0;
    if (STATE === 'mpPlaying') endMultiplayerMatch(); else endGame();
    return;
  }

  if (STATE === 'mpPlaying') {
    // Shared team combo timer — host-authoritative, decays the same way the
    // single-player combo does, just broadcast to everyone else instead of
    // being purely local.
    if (mpComboTimer > 0) {
      mpComboTimer -= dt * 1000;
      if (mpComboTimer <= 0) { mpCombo = 0; mpComboTimer = 0; }
    }
    if (comboMilestoneTimer > 0) comboMilestoneTimer -= dt * 1000;
  } else {
    comboTimer -= dt * 1000;
    if (comboTimer <= 0 && combo > 0) {
      combo = 0;
      comboTimer = 0;
    }
    if (comboMilestoneTimer > 0) comboMilestoneTimer -= dt * 1000;
  }

  // FFA is a pure PvP arena — no AI enemies at all, so nothing to spawn here
  // (and since ground pickups only ever come from killEnemy()'s drop table,
  // skipping this also means FFA never gets ground pickups — by design,
  // rewards come from kill streaks instead, see killstreakRewardFor()).
  if (mpMode !== 'ffa') {
    // Spawn rate ramps up
    spawnRate = Math.max(1.2, 3.0 - elapsed / 50);
    spawnTimer += dt;
    const waveSize = 1 + Math.floor(elapsed / 40);
    if (spawnTimer >= spawnRate) {
      spawnTimer = 0;
      for (let i = 0; i < waveSize; i++) spawnEnemy();
    }
  }
}

async function endGame() {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem(HS_KEY, highScore);
  }
  pendingScore = score;
  pendingCombo = peakCombo;
  pendingKills = kills;
  pendingDuration = Math.floor(elapsed);
  STATE = 'dead'; // safe default while the leaderboard check is in flight
  const qualifies = await qualifiesForLeaderboard(score, LB_BOARD_SP);
  // Only upgrade to the initials prompt if still on the dead screen — the
  // player may have already navigated away (e.g. back to start) by the time
  // this resolves.
  if (STATE === 'dead' && qualifies) {
    STATE = 'enterInitials';
    initials = ['A','A','A'];
    initialsCursor = 0;
  }
}

// Shared player/world reset used by both single-player and multiplayer match
// starts — loadout, position, camera snap, ammo, timers, and clearing the
// enemy/bullet/pickup/particle/flash arrays.
function resetPlayerForMatch() {
  // Reset to the devtool-configured loadout — undoes any weapon pickups from a previous run.
  Object.assign(EQUIPPED_RANGED, resolveEquippedWeapon('ranged'));
  Object.assign(EQUIPPED_MELEE, resolveEquippedWeapon('melee'));
  // Guarded by STATE (not just mpMode) since this function is shared with
  // single-player's startGame() — mpMode can be stale from a previous MP
  // match and must never affect an SP run.
  const inMpFfa = mpMode === 'ffa' && (STATE === 'mpLoadout' || STATE === 'mpPlaying');
  const spawn = inMpFfa ? ffaSpawnPoint(mySpawnIndex) : MAP_CONFIG.playerStart;
  player.x = spawn.x; player.y = spawn.y;
  // Snap the camera straight to the player instead of panning in from (0,0) —
  // matters once maps are bigger than one screen.
  camera.x = Math.max(0, Math.min(MAP_W - CW, player.x - CW/2));
  camera.y = Math.max(0, Math.min(MAP_H - CH, player.y - CH/2));
  player.hp = CONFIG.PLAYER.hp; player.maxHp = CONFIG.PLAYER.hp;
  player.mag = Math.min(EQUIPPED_RANGED.magSize, EQUIPPED_RANGED.ammo);
  player.reserve = EQUIPPED_RANGED.ammo - player.mag;
  player.reloading = false; player.reloadTimer = 0;
  player.rawAngle = 0; player.facing = 'S'; player.meleeCd = 0; player.fireCd = 0;
  player.flashTimer = 0; player.invincible = 0;
  player.armor = 0; player.speedBoostTimer = 0;
  player.burnTimer = 0; player.burnTickTimer = 0; player.burnDps = 0; player.burnAttackerId = null;
  enemies = []; bullets = []; remoteBullets = []; pickups = []; particles = []; flashes = []; shockwaves = []; beams = [];
  mainTimer = 150; elapsed = 0;
  spawnTimer = 0; spawnRate = 3.0;
  enemyLastDeathTime = {}; enemyNeverRespawn = new Set();
  resetSfxEngine();
}

function startGame() {
  STATE = 'playing';
  resetPlayerForMatch();
  score = 0; combo = 0; comboTimer = 0; comboMilestone = ''; comboMilestoneTimer = 0;
  peakCombo = 0;
  kills = 0;
  justSavedIndex = -1;
}

// === GAME LOOP ===

const ctx = canvas.getContext('2d');
let lastTime = 0;

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  uiButtons = []; // repopulated by whichever menu screen draws this frame

  SPRITES.updateAnims(dt);
  Music.update();

  const mpActive = STATE === 'mpPlaying';
  if (STATE === 'playing' || mpActive) {
    updateTimers(dt);
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updatePickups(dt);
    updateBurningVisuals();
    updateParticles(dt);
    updateFlashes(dt);
    updateShockwaves(dt);
    updateBeams(dt);
    if (mpActive) {
      updateRemotePlayers(dt);
      updateRemoteBullets(dt);
      updateMultiplayerNet(dt);
    }
  }

  // Render — world-space (camera transform)
  const frozenOverlay = STATE === 'dead' || STATE === 'enterInitials' || STATE === 'leaderboard' || STATE === 'mpEnded' || STATE === 'mpEnterInitials' || STATE === 'mpLeaderboard';
  ctx.save();
  ctx.translate(-Math.round(camera.x), -Math.round(camera.y));
  drawMap(ctx);
  if (STATE === 'playing' || mpActive || frozenOverlay) {
    drawPickups(ctx);
    drawBullets(ctx);
    drawEnemies(ctx);
    if (mpActive) drawRemotePlayers(ctx);
    drawPlayer(ctx);
    drawParticles(ctx);
    drawShockwaves(ctx);
    drawBeams(ctx);
    drawFlashes(ctx);
  }
  ctx.restore();

  // Screen-space (HUD + overlays)
  if (STATE === 'playing' || frozenOverlay) drawHUD(ctx);
  if (mpActive) drawMpHUD(ctx);
  if (mpActive && mpScoreboardHeld) drawMpScoreboard(ctx);
  if (mpActive && mpLoadoutOverlayOpen) drawMpLoadoutScreen(ctx, { closable: true });
  if (STATE === 'start')         drawStartScreen(ctx);
  if (STATE === 'dead')          drawDeadScreen(ctx);
  if (STATE === 'enterInitials' || STATE === 'mpEnterInitials') drawInitialsScreen(ctx);
  if (STATE === 'leaderboard')   drawLeaderboardScreen(ctx);
  if (STATE === 'settings')      drawSettingsScreen(ctx);
  if (STATE === 'controls')      drawControlsScreen(ctx);
  if (STATE === 'mpConnect')     drawMpConnectScreen(ctx);
  if (STATE === 'mpName')        drawMpNameScreen(ctx);
  if (STATE === 'mpBrowse')      drawMpBrowseScreen(ctx);
  if (STATE === 'mpLobby')       drawMpLobbyScreen(ctx);
  if (STATE === 'mpLoadout')     drawMpLoadoutScreen(ctx);
  if (STATE === 'mpEnded')       drawMpEndedScreen(ctx);
  if (STATE === 'mpLeaderboard') drawMpLeaderboardScreen(ctx);
}

// === INIT ===

SPRITES.load();
Music.load();

canvas.addEventListener('click', e => {
  Music.start(); // first user gesture on the page — browsers block audio autoplay before this
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX - r.left) * (CW / r.width);
  const cy = (e.clientY - r.top)  * (CH / r.height);
  const hit = uiButtons.find(b => cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h);
  if (hit) { hit.action(); return; }
  if (STATE === 'leaderboard') startGame();
});
window.addEventListener('keydown', e => {
  Music.start();
  if (TextEntry.active) { TextEntry.handleKey(e); return; }
  if (STATE === 'enterInitials' || STATE === 'mpEnterInitials') { handleInitialsKey(e); return; }
  if (STATE === 'leaderboard') {
    if (e.key === 'Enter') startGame();
    else if (e.key === 'Escape') STATE = 'start';
    return;
  }
  if (STATE === 'mpLeaderboard') {
    if (e.key === 'Escape') { STATE = 'mpBrowse'; Net.send('list'); }
    return;
  }
  if ((STATE === 'start' || STATE === 'dead') && e.key.toLowerCase() === 'l') {
    justSavedIndex = -1;
    STATE = 'leaderboard';
    leaderboardEntries = [];
    leaderboardLoading = true;
    loadLeaderboard(LB_BOARD_SP).then(entries => { leaderboardEntries = entries; leaderboardLoading = false; });
    return;
  }
  if (e.key === 'Enter' && (STATE === 'start' || STATE === 'dead')) startGame();
  if (e.key === 'Escape' && STATE === 'dead') STATE = 'start';
  if (e.key === 'Escape' && STATE === 'mpBrowse') { Net.close(); STATE = 'start'; }
  if (e.key === 'Escape' && STATE === 'mpLobby') {
    Net.send('leave');
    mpCurrentLobby = null;
    STATE = 'mpBrowse';
    Net.send('list');
  }
  if (e.key === 'Escape' && STATE === 'settings') STATE = 'start';
  if (e.key === 'Escape' && STATE === 'controls') STATE = 'start';
  if (e.key === 'Escape' && STATE === 'mpConnect' && mpConnectError) STATE = 'start';
});

requestAnimationFrame(loop);

})();
</script>
</body>
