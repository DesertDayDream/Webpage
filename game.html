  if (types.length === 0) return;
  const totalChance = types.reduce((sum, t) => sum + ENEMY_DEFS[t].spawnChance, 0);
  let roll = Math.random() * totalChance;
  let type = types[types.length - 1];
  for (const t of types) {
    if (roll < ENEMY_DEFS[t].spawnChance) { type = t; break; }
    roll -= ENEMY_DEFS[t].spawnChance;
  }
  const def = ENEMY_DEFS[type];

  // Spawn on viewport edges around whichever player this box is anchored to —
  // in MP that's a random connected player (not always the host's own camera),
  // so enemies don't only ever appear near the host. Clamp the anchor the same
  // way the camera itself is clamped (camera.x/y at lines ~1357-1358) — a raw
  // player position can be as close as PLAYER_SIZE/2 to the map edge, which
  // would otherwise push the viewport-sized spawn box past MAP_W/MAP_H and
  // spawn an enemy outside the border wall, where it gets stuck forever since
  // enemies have no pathfinding to walk back around a solid wall.
  const rawAnchor = STATE === 'mpPlaying' ? mpSpawnAnchor() : { x: camera.x + CW/2, y: camera.y + CH/2 };
  const anchor = {
    x: Math.max(CW/2, Math.min(MAP_W - CW/2, rawAnchor.x)),
    y: Math.max(CH/2, Math.min(MAP_H - CH/2, rawAnchor.y)),
  };
  const vL = anchor.x - CW/2 + 40, vR = anchor.x + CW/2 - 40;
  const vT = anchor.y - CH/2 + 40, vB = anchor.y + CH/2 - 40;
  let ex, ey;
  for (let attempt = 0; attempt < 20; attempt++) {
    const side = Math.floor(Math.random() * 4);
    if (side === 0)      { ex = vL + Math.random()*(vR-vL); ey = vT; }
    else if (side === 1) { ex = vL + Math.random()*(vR-vL); ey = vB; }
    else if (side === 2) { ex = vL; ey = vT + Math.random()*(vB-vT); }
    else                 { ex = vR; ey = vT + Math.random()*(vB-vT); }
    if (!pointInWall(ex, ey)) break;
  }

  enemies.push({
    id: nextEnemyId++,
    x:ex, y:ey,
    hp: def.hp, maxHp: def.hp,
    type, def,
    flashTimer: 0,
    deathTimer: -1,
    burnTimer: 0, burnTickTimer: 0, burnDps: 0, burnAttackerId: null, // Flame Cone burn status
  });
}

// Picks a random connected player (including the host itself) to spawn near.
function mpSpawnAnchor() {
  const alive = [{ x: player.x, y: player.y, hp: player.hp }];
  remotePlayers.forEach(rp => { if (rp.x !== undefined) alive.push(rp); });
  const candidates = alive.filter(p => p.hp > 0);
  const pool = candidates.length > 0 ? candidates : alive;
  return pool[Math.floor(Math.random() * pool.length)];
}

// Interpolates an angle toward a target by the shortest angular path (never
// the "long way" around the circle) — same ±π normalization idiom doMelee
// already uses for its aim-vs-enemy angle-diff check.
function lerpAngle(from, to, rate) {
  let diff = to - from;
  while (diff >  Math.PI) diff -= Math.PI*2;
  while (diff < -Math.PI) diff += Math.PI*2;
  return from + diff * rate;
}

// Applies damage to the local player, shared by contact damage (below) and
// self-inflicted splash damage (explodeSplash()) so an Armor pickup's charges
// behave consistently everywhere the player can be hurt. Each charge fully
// blocks one hit — regardless of its damage amount — before any hp is lost.
function damagePlayer(dmg) {
  player.flashTimer = 0.15;
  player.invincible = 0.5;
  if (player.armor > 0) {
    player.armor--;
    spawnFlash('ARMOR -1', player.x, player.y - 20, '#40c8f0');
    SOUNDS.play('PLAYER', 'damage');
    return;
  }
  player.hp -= dmg;
  SOUNDS.play('PLAYER', 'damage');
  if (player.hp <= 0) {
    player.hp = 0;
    SOUNDS.play('PLAYER', 'death');
    if (STATE === 'mpPlaying') goDowned(); else endGame();
  }
}

// FFA counterpart to damagePlayer() — same armor/flash/invincibility rules,
// but on death it credits the elimination (attackerId) instead of just
// freezing/respawning, since FFA tracks kills/deaths/streaks. Called both
// from the 'hitPlayer' network handler (an opponent's hit) and from splash
// self-damage (attackerId === Net.playerId, a self-elimination).
function damagePlayerFFA(dmg, attackerId) {
  player.flashTimer = 0.15;
  player.invincible = 0.5;
  if (player.armor > 0) {
    player.armor--;
    spawnFlash('ARMOR -1', player.x, player.y - 20, '#40c8f0');
    SOUNDS.play('PLAYER', 'damage');
    return;
  }
  player.hp -= dmg;
  SOUNDS.play('PLAYER', 'damage');
  if (player.hp <= 0) {
    player.hp = 0;
    SOUNDS.play('PLAYER', 'death');
    goDowned();
    if (isHost) applyEliminationLocally(attackerId, Net.playerId);
    else Net.send('eliminated', { killerId: attackerId });
  }
}

// A burn-status DoT tick (Flame Cone weapons) — same armor/death/elimination
// rules as damagePlayerFFA(), but deliberately doesn't set player.invincible
// (a burn tick shouldn't grant temporary immunity to other attacks) and only
// nudges flashTimer up to a floor instead of resetting it every tick, since
// this fires repeatedly (every BURN_TICK_INTERVAL) rather than once per hit.
function tickPlayerBurn(dmg, attackerId) {
  player.flashTimer = Math.max(player.flashTimer, 0.1);
  if (player.armor > 0) {
    player.armor--;
    spawnFlash('ARMOR -1', player.x, player.y - 20, '#40c8f0');
    SOUNDS.play('PLAYER', 'damage');
    return;
  }
  player.hp -= dmg;
  SOUNDS.play('PLAYER', 'damage');
  if (player.hp <= 0) {
    player.hp = 0;
    SOUNDS.play('PLAYER', 'death');
    goDowned();
    if (isHost) applyEliminationLocally(attackerId, Net.playerId);
    else Net.send('eliminated', { killerId: attackerId });
  }
}

function updateEnemies(dt) {
  // Host during MP, always in single-player — the only side that ever
  // simulates enemy movement/damage authoritatively.
  const isAuthoritative = STATE !== 'mpPlaying' || isHost;

  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    if (e.deathTimer >= 0) {
      e.deathTimer += dt;
      // Non-host MP clients mirror whatever the host sends rather than
      // pruning locally — removing early would desync array/id bookkeeping
      // from the host's authoritative view.
      if (e.deathTimer > 0.4 && isAuthoritative) enemies.splice(i, 1);
      continue;
    }

    // Flamethrower burn status — authoritative side only; non-host clients
    // merely mirror the `burning` flag through the hostState broadcast for
    // the fire visual (see updateBurningVisuals()).
    if (isAuthoritative && e.burnTimer > 0) {
      e.burnTimer -= dt;
      e.burnTickTimer -= dt;
      if (e.burnTickTimer <= 0) {
        e.burnTickTimer += BURN_TICK_INTERVAL;
        applyDamageToEnemy(e, e.burnDps * BURN_TICK_INTERVAL, false, e.burnAttackerId);
      }
      if (e.burnTimer <= 0) { e.burnTimer = 0; e.burnDps = 0; }
      if (e.deathTimer >= 0) continue; // the burn tick just killed it
    }

    if (isAuthoritative) {
      // Movement/AI is authoritative here — host during MP, always in single-player.
      // Chase whichever connected player is nearest, not just this client's own.
      const target = STATE === 'mpPlaying' ? nearestPlayerTo(e.x, e.y) : player;
      const dx = target.x - e.x;
      const dy = target.y - e.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      // Canonical facing angle — reuses the exact same chase vector driving
      // movement below, so every client (host included) renders this enemy
      // facing whoever it's actually chasing, instead of each viewer computing
      // its own angle toward itself (see drawEnemies, old behavior).
      if (dist > 0.01) e.angle = Math.atan2(dy, dx) + Math.PI/2;
      if (dist > 2) {
        const nx = e.x + (dx/dist) * e.def.speed * dt;
        const ny = e.y + (dy/dist) * e.def.speed * dt;
        const res = resolveWalls(nx, ny, e.def.size);
        e.x = res.nx; e.y = res.ny;
      }
    } else if (e.targetX !== undefined) {
      // Non-host MP client — smoothly glide toward the host's last-reported
      // position instead of hard-snapping on every ~100ms hostState broadcast
      // (same lerp rate/technique as updateRemotePlayers uses for other players).
      const lerpRate = Math.min(1, 12 * dt);
      e.x += (e.targetX - e.x) * lerpRate;
      e.y += (e.targetY - e.y) * lerpRate;
      if (e.targetAngle !== undefined) {
        e.angle = e.angle !== undefined ? lerpAngle(e.angle, e.targetAngle, lerpRate) : e.targetAngle;
      }
    }

    // Contact damage — every client checks its own local player against
    // whatever enemy positions it currently has (the host's live sim, or a
    // client's last-received network snapshot).
    const pdist = Math.hypot(player.x - e.x, player.y - e.y);
    if (STATE !== 'mpPlaying' || !mpDowned) {
      if (player.invincible <= 0 && pdist < (PLAYER_SIZE + e.def.size) / 2 + 2) {
        SOUNDS.play(e.type, 'attack');
        damagePlayer(e.def.dmg);
      }
    }

    if (e.flashTimer > 0) e.flashTimer -= dt;
  }
}

function drawEnemies(ctx) {
  for (const e of enemies) {
    if (e.deathTimer >= 0) {
      // Death dissolve
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - e.deathTimer * 2.5);
      const scale = 1 + e.deathTimer * 2;
      ctx.translate(e.x, e.y); ctx.scale(scale, scale); ctx.translate(-e.x, -e.y);
      ctx.fillStyle = e.def.color;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.def.size/2, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      continue;
    }

    if (e.flashTimer > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(e.x, e.y, e.def.size/2+2, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    const angle = e.angle || 0; // fallback for the first frame before updateEnemies has computed one
    SPRITES.draw(e.type, ctx, e.x, e.y, e.def.size, e.def.size, angle, 'ENEMY_BASIC');

    // HP bar
    if (e.hp < e.maxHp) {
      const bw = e.def.size + 8;
      ctx.fillStyle = '#2a0808';
      ctx.fillRect(e.x - bw/2, e.y - e.def.size/2 - 6, bw, 3);
      const pct = e.hp / e.maxHp;
      ctx.fillStyle = pct > 0.5 ? '#5aaa3a' : pct > 0.25 ? '#c8a840' : '#c84040';
      ctx.fillRect(e.x - bw/2, e.y - e.def.size/2 - 6, Math.round(bw * pct), 3);
    }
  }
}

// `killerId` is only meaningful during MP (who dealt the killing blow, for
// score attribution) — null/ignored in single-player, which keeps its own
// score/combo globals exactly as before.
function killEnemy(e, isMelee, killerId) {
  e.deathTimer = 0;
  SOUNDS.play(e.type, 'death');
  enemyLastDeathTime[e.type] = elapsed;
  if (e.def.noRespawn === 'on') enemyNeverRespawn.add(e.type);
  const mp = STATE === 'mpPlaying';

  const milestones = {5:'GOOD!', 10:'GREAT!!', 20:'EXCELLENT!!!', 30:'★ LEGENDARY ★'};

  let mult;
  if (mp) {
    // Combo is a shared team streak — any player's kill extends it, host is
    // authoritative. Score (and now kills) are still tracked per player for
    // the scoreboard; peak combo is match-wide, for the leaderboard.
    const ps = playerScores[killerId] || (playerScores[killerId] = { name: '', score: 0, kills: 0 });
    mpCombo++;
    if (mpCombo > mpPeakCombo) mpPeakCombo = mpCombo;
    mpComboTimer = COMBO_TIMEOUT;
    mult = mpCombo;
    ps.score += e.def.score * mult;
    ps.kills = (ps.kills || 0) + 1;

    if (milestones[mpCombo]) {
      comboMilestone = milestones[mpCombo];
      comboMilestoneTimer = 2000;
    }
  } else {
    combo++;
    if (combo > peakCombo) peakCombo = combo;
    comboTimer = COMBO_TIMEOUT;
    mult = combo;
    score += e.def.score * mult;
    kills++;

    if (milestones[combo]) {
      comboMilestone = milestones[combo];
      comboMilestoneTimer = 2000;
    }
  }

  // Time bonus — still a shared/host-authoritative timer during MP.
  if (isMelee) {
    mainTimer = Math.min(mainTimer + MELEE_TIME_BONUS, 150);
    spawnFlash('+' + MELEE_TIME_BONUS + 's', e.x, e.y - 10, '#3ef83e');
  }

  // Pickup drops driven by CONFIG
  const roll = Math.random() * 100;
  const ph = CONFIG.PICKUP_HEALTH, pa = CONFIG.PICKUP_AMMO, pw = CONFIG.PICKUP_WEAPON;
  const par = CONFIG.PICKUP_ARMOR, psp = CONFIG.PICKUP_SPEED;
  if (roll < ph.dropChance) {
    pickups.push({ id: nextPickupId++, kind:'health', x: e.x, y: e.y, amount: ph.healMin + Math.floor(Math.random()*(ph.healMax - ph.healMin + 1)), timer:0 });
    SOUNDS.play('PICKUP_HEALTH', 'spawn');
  } else if (roll < ph.dropChance + pa.dropChance) {
    pickups.push({ id: nextPickupId++, kind:'ammo',   x: e.x, y: e.y, amount: pa.amountMin + Math.floor(Math.random()*(pa.amountMax - pa.amountMin + 1)), timer:0 });
    SOUNDS.play('PICKUP_AMMO', 'spawn');
  } else if (roll < ph.dropChance + pa.dropChance + pw.dropChance) {
    const pool = lootPoolEntries();
    if (pool.length > 0) {
      const drop = pickWeightedWeapon(pool);
      pickups.push({ id: nextPickupId++, kind:'weapon', x: e.x, y: e.y, timer:0, weaponName: drop.name, category: drop.category });
      SOUNDS.play('PICKUP_WEAPON', 'spawn');
    }
  } else if (roll < ph.dropChance + pa.dropChance + pw.dropChance + par.dropChance) {
    pickups.push({ id: nextPickupId++, kind:'armor', x: e.x, y: e.y, timer:0 });
    SOUNDS.play('PICKUP_ARMOR', 'spawn');
  } else if (roll < ph.dropChance + pa.dropChance + pw.dropChance + par.dropChance + psp.dropChance) {
    pickups.push({ id: nextPickupId++, kind:'speed', x: e.x, y: e.y, timer:0 });
    SOUNDS.play('PICKUP_SPEED', 'spawn');
  }

  // Spawn particles
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 40 + Math.random() * 80;
    particles.push({
      x: e.x, y: e.y,
      dx: Math.cos(a)*spd, dy: Math.sin(a)*spd,
      color: e.def.color,
      life: 0.3 + Math.random()*0.3,
      maxLife: 0.6,
      size: 2 + Math.random()*3,
    });
  }

  spawnFlash('x' + mult + '  +' + (e.def.score * mult), e.x, e.y - 24, '#f0c840');
}

// Applies damage to an enemy and resolves a kill. In single-player this is
// the same authoritative path it's always been. During MP, only the host
// ever calls this for real — see the bullet/melee hit-detection loops below,
// which optimistically show local feedback but route the actual damage
// through a `hit` network message when not the host.
function applyDamageToEnemy(e, dmg, isMelee, killerId, extinguish) {
  e.hp -= dmg;
  e.flashTimer = isMelee ? 0.1 : 0.06;
  SOUNDS.play(e.type, 'damage');
  // A ranged weapon with Extinguish on (e.g. a water gun) douses whatever
  // burn status (Flame Cone) the target is carrying, in addition to
  // whatever damage this hit deals — see updateBullets()/fireHitscan()/
  // explodeSplash()/updateBouncingBullet() and the water gun's own weapon toggle.
  if (extinguish && e.burnTimer > 0) {
    e.burnTimer = 0; e.burnTickTimer = 0; e.burnDps = 0; e.burnAttackerId = null;
    spawnFlash('EXTINGUISHED', e.x, e.y - 20, '#7fd8ff');
  }
  if (e.hp <= 0) killEnemy(e, isMelee, killerId);
}

// === PROJECTILES ===

function spawnBullet() {
  if (!EQUIPPED_RANGED.unlimitedAmmo) {
    if (player.mag <= 0) return;
    player.mag--; // one trigger pull consumes one round, regardless of pellet count
  }
  SOUNDS.play(EQUIPPED_RANGED.name, 'attack');
  const aimAngle = player.rawAngle;
  const anchor = HAND_ANCHORS[player.facing];
  const originX = player.x + anchor.x + Math.cos(aimAngle) * GUN_LENGTH;
  const originY = player.y + anchor.y + Math.sin(aimAngle) * GUN_LENGTH;
  const spreadRad = EQUIPPED_RANGED.spreadAngle * Math.PI / 180;

  // Flame Cone weapons (e.g. a flamethrower) never spawn any pellets/rays at
  // all — see fireFlame() for the direct cone-tick damage instead.
  if (EQUIPPED_RANGED.flameCone === 'on') {
    fireFlame(originX, originY, aimAngle);
    return;
  }

  // Hitscan weapons (e.g. a rail gun) resolve every pellet instantly along its
  // aim line instead of spawning a travelling projectile — see fireHitscan().
  if (EQUIPPED_RANGED.hitscan === 'on') {
    for (let i = 0; i < EQUIPPED_RANGED.pelletCount; i++) {
      const angle = spreadRad > 0 ? aimAngle + (Math.random() - 0.5) * spreadRad : aimAngle;
      fireHitscan(originX, originY, angle);
    }
    return;
  }

  // Splash weapons (e.g. a rocket launcher) render as a bigger orange projectile
  // instead of the standard bullet dot, so they visually read as explosive.
  // Bounce weapons (Max Bounces > 0) render as green — mutually exclusive with
  // splash, since an AoE explosion already fully resolves on first contact,
  // leaving nothing left to ricochet (see updateBouncingBullet()).
  const isRocket = EQUIPPED_RANGED.splashRadius > 0;
  const canBounce = !isRocket && EQUIPPED_RANGED.maxBounces > 0;
  const bulletColor = isRocket ? '#ff7a1a' : canBounce ? '#5cf25c' : '#f0e040';
  const bulletSize = isRocket ? 6 : canBounce ? 4 : 3;

  const spawned = [];
  for (let i = 0; i < EQUIPPED_RANGED.pelletCount; i++) {
    const angle = spreadRad > 0 ? aimAngle + (Math.random() - 0.5) * spreadRad : aimAngle;
    const b = {
      x: originX, y: originY,
      dx: Math.cos(angle) * EQUIPPED_RANGED.bulletSpeed,
      dy: Math.sin(angle) * EQUIPPED_RANGED.bulletSpeed,
      distTravelled: 0,
      color: bulletColor,
      size: bulletSize,
    };
    if (canBounce) b.bouncesLeft = EQUIPPED_RANGED.maxBounces;
    bullets.push(b);
    spawned.push(b);
  }

  // Let every other player see this shot — visual only, so it's just enough to
  // draw the same trail; each shooter's own client still resolves its own hits.
  if (STATE === 'mpPlaying') {
    Net.send('state', { kind: 'shot', data: {
      bullets: spawned.map(b => ({ x:b.x, y:b.y, dx:b.dx, dy:b.dy, color:b.color, size:b.size, bounces:b.bouncesLeft })),
      range: EQUIPPED_RANGED.bulletRange,
    }});
  }
}

// Resolves one hitscan pellet instantly: samples points along the aim ray
// (same coarse step-and-check approach travelling bullets already use each
// frame, just walked all at once instead of over time) until it exceeds
// bulletRange, leaves the map, hits a wall, or overlaps an enemy — whichever
// comes first. Reuses pointInWall() and the exact same enemy-overlap test
// updateBullets() uses, so a hitscan weapon behaves identically to a very
// fast bullet, just without the travel time.
function fireHitscan(originX, originY, angle) {
  const range = EQUIPPED_RANGED.bulletRange;
  const step = 8;
  const dx = Math.cos(angle), dy = Math.sin(angle);
  let x = originX, y = originY, travelled = 0, hitEnemy = null, hitPlayerId = null;

  while (travelled < range) {
    x += dx * step; y += dy * step; travelled += step;
    if (x < 0 || x > MAP_W || y < 0 || y > MAP_H || pointInWall(x, y)) break;
    hitEnemy = enemies.find(e => e.deathTimer < 0 && Math.hypot(x - e.x, y - e.y) < e.def.size/2 + 3);
    if (hitEnemy) break;
    if (mpMode === 'ffa') {
      for (const [id, rp] of remotePlayers) {
        if (rp.x === undefined || rp.hp <= 0) continue;
        if (Math.hypot(x - rp.x, y - rp.y) < PLAYER_SIZE/2 + 3) { hitPlayerId = id; break; }
      }
      if (hitPlayerId) break;
    }
  }

  const extinguishes = EQUIPPED_RANGED.extinguish === 'on';
  if (hitEnemy) {
    if (EQUIPPED_RANGED.splashRadius > 0) {
      explodeSplash(x, y);
    } else if (STATE === 'mpPlaying' && !isHost) {
      // Optimistic local feedback only — the host resolves the real hp/kill.
      hitEnemy.flashTimer = 0.06;
      SOUNDS.play(hitEnemy.type, 'damage');
      Net.send('hit', { enemyId: hitEnemy.id, dmg: EQUIPPED_RANGED.bulletDmg, isMelee: false, extinguish: extinguishes });
    } else {
      applyDamageToEnemy(hitEnemy, EQUIPPED_RANGED.bulletDmg, false, Net.playerId, extinguishes);
    }
  } else if (hitPlayerId) {
    if (EQUIPPED_RANGED.splashRadius > 0) {
      explodeSplash(x, y);
    } else {
      Net.send('hitPlayer', { targetId: hitPlayerId, dmg: EQUIPPED_RANGED.bulletDmg, isMelee: false, extinguish: extinguishes });
    }
  } else if (EQUIPPED_RANGED.splashRadius > 0) {
    explodeSplash(x, y); // missed every enemy/player but still detonates at the wall/range endpoint
  }

  // Instant beam trace — the only visual feedback, since there's no travelling
  // bullet to see (the hit already happened the same frame it was fired).
  beams.push({ x1: originX, y1: originY, x2: x, y2: y, color: '#7fe8ff', timer: 0, duration: 0.08 });
  if (STATE === 'mpPlaying') {
    Net.send('state', { kind: 'beam', data: { x1: originX, y1: originY, x2: x, y2: y } });
  }
}

// Flame Cone weapons (e.g. a flamethrower) never spawn a projectile at all —
// each "shot" (throttled by the normal fireCd/fireDelay like every other
// weapon, so a fast fireDelay + auto fireMode is what makes it feel
// continuous) instantly ticks bulletDmg to every enemy/player within
// bulletRange and inside a cone around the aim angle, reusing the Spread
// slider as the cone's full angle instead of a per-pellet scatter angle.
function fireFlame(originX, originY, aimAngle) {
  const range = EQUIPPED_RANGED.bulletRange;
  const halfArc = (EQUIPPED_RANGED.spreadAngle || 30) * Math.PI / 180 / 2;
  // A Flame Cone weapon with a Burn Duration configured also ignites a
  // lingering burn status — DoT damage that keeps ticking even after the
  // target leaves the cone, see updateEnemies()/updatePlayer()'s burn-tick
  // blocks and BURN_TICK_INTERVAL. 0 duration means "no burn" (opt-in).
  const burn = EQUIPPED_RANGED.burnDuration > 0
    ? { duration: EQUIPPED_RANGED.burnDuration, dps: EQUIPPED_RANGED.burnDps }
    : null;

  for (const e of enemies) {
    if (e.deathTimer >= 0) continue;
    const dist = Math.hypot(e.x - originX, e.y - originY);
    if (dist > range) continue;
    const toEnemy = Math.atan2(e.y - originY, e.x - originX);
    let diff = toEnemy - aimAngle;
    while (diff >  Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    if (Math.abs(diff) > halfArc) continue;
    if (STATE === 'mpPlaying' && !isHost) {
      // Optimistic local feedback only — the host resolves the real hp/kill.
      e.flashTimer = 0.06;
      SOUNDS.play(e.type, 'damage');
      const hitMsg = { enemyId: e.id, dmg: EQUIPPED_RANGED.bulletDmg, isMelee: false };
      if (burn) hitMsg.burn = burn;
      Net.send('hit', hitMsg);
    } else {
      applyDamageToEnemy(e, EQUIPPED_RANGED.bulletDmg, false, Net.playerId);
      if (burn) {
        e.burnTimer = burn.duration / 1000;
        e.burnTickTimer = BURN_TICK_INTERVAL;
        e.burnDps = burn.dps;
        e.burnAttackerId = Net.playerId;
      }
    }
  }

  if (mpMode === 'ffa') {
    for (const [id, rp] of remotePlayers) {
      if (rp.x === undefined || rp.hp <= 0) continue;
      const dist = Math.hypot(rp.x - originX, rp.y - originY);
      if (dist > range) continue;
      const toTarget = Math.atan2(rp.y - originY, rp.x - originX);
      let diff = toTarget - aimAngle;
      while (diff >  Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      if (Math.abs(diff) > halfArc) continue;
      const hitMsg = { targetId: id, dmg: EQUIPPED_RANGED.bulletDmg, isMelee: false };
      if (burn) hitMsg.burn = burn;
      Net.send('hitPlayer', hitMsg);
    }
  }

  // Flame particle burst, scattered across the cone — the only visual
  // feedback, same idea as fireHitscan()'s instant beam but shaped like fire
  // instead of a single trace line.
  for (let i = 0; i < 6; i++) {
    const a = aimAngle + (Math.random() - 0.5) * halfArc * 2;
    const d = 10 + Math.random() * range;
    const roll = Math.random();
    particles.push({
      x: originX + Math.cos(a) * d,
      y: originY + Math.sin(a) * d,
      dx: Math.cos(a) * 80, dy: Math.sin(a) * 80,
      color: roll < 0.33 ? '#ff4d1a' : roll < 0.66 ? '#ff9c1a' : '#ffe066',
      life: 0.12 + Math.random() * 0.1,
      maxLife: 0.22,
      size: 4 + Math.random() * 4,
    });
  }

  if (STATE === 'mpPlaying') {
    Net.send('state', { kind: 'flame', data: { x: originX, y: originY, angle: aimAngle, range, halfArc } });
  }
}

// Splash-damage explosion at (x,y) — triggered by any ranged weapon with
// splashRadius > 0 (e.g. a rocket launcher), from either exit path in
// updateBullets(). Linear falloff: full EQUIPPED_RANGED.bulletDmg at the
// impact point, scaling to 0 at splashRadius. Mirrors doMelee()'s exact
// "loop every enemy, send one discrete 'hit' message per enemy" pattern —
// MP-safe with zero server.js changes (server.js's 'hit' relay destructures
// {enemyId,dmg,isMelee} field-by-field, so an array payload would NOT work
// without editing server.js; N discrete messages, like melee, does).
function explodeSplash(x, y) {
  const radius = EQUIPPED_RANGED.splashRadius;
  if (radius <= 0) return; // defensive — callers already gate on this

  const extinguishes = EQUIPPED_RANGED.extinguish === 'on';
  for (const e of enemies) {
    if (e.deathTimer >= 0) continue;
    const dist = Math.hypot(e.x - x, e.y - y);
    if (dist >= radius) continue;
    const dmg = Math.round(EQUIPPED_RANGED.bulletDmg * (1 - dist / radius));
    if (dmg <= 0) continue;
    if (STATE === 'mpPlaying' && !isHost) {
      // Optimistic local feedback only — the host resolves the real hp/kill.
      e.flashTimer = 0.06;
      SOUNDS.play(e.type, 'damage');
      Net.send('hit', { enemyId: e.id, dmg, isMelee: false, extinguish: extinguishes });
    } else {
      applyDamageToEnemy(e, dmg, false, Net.playerId, extinguishes);
    }
  }

  // FFA: same falloff, against other players instead of enemies. Never
  // mutates rp.hp directly (write-only from network state) — just tells the
  // target's own client to apply it, same as every other PVP hit below.
  if (mpMode === 'ffa') {
    for (const [id, rp] of remotePlayers) {
      if (rp.x === undefined || rp.hp <= 0) continue;
      const dist = Math.hypot(rp.x - x, rp.y - y);
      if (dist >= radius) continue;
      const dmg = Math.round(EQUIPPED_RANGED.bulletDmg * (1 - dist / radius));
      if (dmg <= 0) continue;
      Net.send('hitPlayer', { targetId: id, dmg, isMelee: false, extinguish: extinguishes });
    }
  }

  // Self-damage — shooter only (never teammates/other players), per-weapon
  // opt-in, purely local: no network message needed, exactly like the
  // contact-damage idiom in updateEnemies (every client checks its own local
  // player independently).
  if (EQUIPPED_RANGED.selfDamage === 'on' && player.invincible <= 0 &&
      (STATE !== 'mpPlaying' || !mpDowned)) {
    const pdist = Math.hypot(player.x - x, player.y - y);
    if (pdist < radius) {
      const dmg = Math.round(EQUIPPED_RANGED.bulletDmg * (1 - pdist / radius));
      if (dmg > 0) {
        if (mpMode === 'ffa') damagePlayerFFA(dmg, Net.playerId);
        else damagePlayer(dmg);
      }
    }
  }

  // Explosion particle burst — bigger/orange variant of killEnemy's death burst.
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 60 + Math.random() * 140;
    particles.push({
      x, y,
      dx: Math.cos(a) * spd, dy: Math.sin(a) * spd,
      color: Math.random() < 0.5 ? '#ff8c1a' : '#ffd23f',
      life: 0.25 + Math.random() * 0.35,
      maxLife: 0.6,
      size: 3 + Math.random() * 5,
    });
  }
  spawnShockwave(x, y, radius); // the actual blast-radius ring, unlike the burst above

  // Cosmetic-only sync to other clients — mirrors the 'melee' kind exactly:
  // damage for remote clients' own local enemy copies is already resolved by
  // the discrete 'hit' messages above; this just draws the burst.
  if (STATE === 'mpPlaying') {
    Net.send('state', { kind: 'explosion', data: { x, y, radius } });
  }
}

// Bounce-capable bullets (Max Bounces > 0) use a careful axis-separated
// position update instead of the simple combined move every other bullet
// uses — this is what lets us tell WHICH axis a wall collision happened on,
// so we know whether to flip dx or dy (or both, for a corner) rather than
// just despawning. An enemy hit applies damage exactly like a normal bullet's
// single-target branch, then reflects the bullet off the enemy's surface
// (treated as a circular obstacle) instead of consuming it, until its bounce
// budget runs out — at that point the next contact destroys it like normal.
// Returns true when the bullet is spent and should be removed.
function updateBouncingBullet(b, dt) {
  if (b.hitCooldown > 0) b.hitCooldown -= dt;

  let nx = b.x + b.dx * dt;
  const wallX = pointInWall(nx, b.y) || nx < 0 || nx > MAP_W;
  if (wallX) { b.dx = -b.dx; nx = b.x; }

  let ny = b.y + b.dy * dt;
  const wallY = pointInWall(nx, ny) || ny < 0 || ny > MAP_H;
  if (wallY) { b.dy = -b.dy; ny = b.y; }

  b.x = nx; b.y = ny;
  b.distTravelled += Math.sqrt(b.dx*b.dx + b.dy*b.dy) * dt;

  if (wallX || wallY) {
    if (b.bouncesLeft <= 0) return true; // out of bounces — this contact despawns it like normal
    b.bouncesLeft--;
  }

  if (b.distTravelled > EQUIPPED_RANGED.bulletRange) return true;

  const extinguishes = EQUIPPED_RANGED.extinguish === 'on';
  for (const e of enemies) {
    if (e.deathTimer >= 0) continue;
    // Skip the exact enemy this bullet just bounced off of for a brief grace
    // period — important for large/boss-sized enemies, where escaping their
    // hit radius can take several frames; without this a single bounce could
    // otherwise re-trigger (and re-damage) every frame while still overlapping.
    if (b.hitCooldown > 0 && e.id === b.lastHitId) continue;
    const dist = Math.hypot(b.x - e.x, b.y - e.y);
    if (dist < e.def.size/2 + 3) {
      if (STATE === 'mpPlaying' && !isHost) {
        // Optimistic local feedback only — the host resolves the real hp/kill.
        e.flashTimer = 0.06;
        SOUNDS.play(e.type, 'damage');
        Net.send('hit', { enemyId: e.id, dmg: EQUIPPED_RANGED.bulletDmg, isMelee: false, extinguish: extinguishes });
      } else {
        applyDamageToEnemy(e, EQUIPPED_RANGED.bulletDmg, false, Net.playerId, extinguishes);
      }
      if (b.bouncesLeft <= 0) return true; // no bounces left — this hit consumes it like normal

      const invDist = 1 / (dist || 1);
      const nx2 = (b.x - e.x) * invDist, ny2 = (b.y - e.y) * invDist;
      const dot = b.dx * nx2 + b.dy * ny2;
      b.dx -= 2 * dot * nx2;
      b.dy -= 2 * dot * ny2;
      b.bouncesLeft--;
      b.lastHitId = e.id;
      b.hitCooldown = 0.15;
      return false; // one target per tick — an enemy hit takes priority over the FFA loop below
    }
  }

  if (mpMode === 'ffa') {
    for (const [id, rp] of remotePlayers) {
      if (rp.x === undefined || rp.hp <= 0) continue;
      if (b.hitCooldown > 0 && id === b.lastHitId) continue;
      const dist = Math.hypot(b.x - rp.x, b.y - rp.y);
      if (dist < PLAYER_SIZE/2 + 3) {
        Net.send('hitPlayer', { targetId: id, dmg: EQUIPPED_RANGED.bulletDmg, isMelee: false, extinguish: extinguishes });
        if (b.bouncesLeft <= 0) return true;

        const invDist = 1 / (dist || 1);
        const nx2 = (b.x - rp.x) * invDist, ny2 = (b.y - rp.y) * invDist;
        const dot = b.dx * nx2 + b.dy * ny2;
        b.dx -= 2 * dot * nx2;
        b.dy -= 2 * dot * ny2;
        b.bouncesLeft--;
        b.lastHitId = id;
        b.hitCooldown = 0.15;
        return false;
      }
    }
  }
  return false;
}

function updateBullets(dt) {
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];

    if (b.bouncesLeft !== undefined) {
      if (updateBouncingBullet(b, dt)) bullets.splice(i, 1);
      continue;
    }

    b.x += b.dx * dt;
    b.y += b.dy * dt;
    b.distTravelled += Math.sqrt(b.dx*b.dx + b.dy*b.dy) * dt;

    if (b.distTravelled > EQUIPPED_RANGED.bulletRange || pointInWall(b.x, b.y) ||
        b.x < 0 || b.x > MAP_W || b.y < 0 || b.y > MAP_H) {
      if (EQUIPPED_RANGED.splashRadius > 0) explodeSplash(b.x, b.y);
      bullets.splice(i, 1);
      continue;
    }

    let hit = false;
    const extinguishes = EQUIPPED_RANGED.extinguish === 'on';
    for (const e of enemies) {
      if (e.deathTimer >= 0) continue;
      const dist = Math.hypot(b.x - e.x, b.y - e.y);
      if (dist < e.def.size/2 + 3) {
        if (EQUIPPED_RANGED.splashRadius > 0) {
          explodeSplash(b.x, b.y);
        } else if (STATE === 'mpPlaying' && !isHost) {
          // Optimistic local feedback only — the host resolves the real hp/kill.
          e.flashTimer = 0.06;
          SOUNDS.play(e.type, 'damage');
          Net.send('hit', { enemyId: e.id, dmg: EQUIPPED_RANGED.bulletDmg, isMelee: false, extinguish: extinguishes });
        } else {
          applyDamageToEnemy(e, EQUIPPED_RANGED.bulletDmg, false, Net.playerId, extinguishes);
        }
        hit = true;
        break;
      }
    }
    if (!hit && mpMode === 'ffa') {
      for (const [id, rp] of remotePlayers) {
        if (rp.x === undefined || rp.hp <= 0) continue;
        const dist = Math.hypot(b.x - rp.x, b.y - rp.y);
        if (dist < PLAYER_SIZE/2 + 3) {
          if (EQUIPPED_RANGED.splashRadius > 0) {
            explodeSplash(b.x, b.y);
          } else {
            Net.send('hitPlayer', { targetId: id, dmg: EQUIPPED_RANGED.bulletDmg, isMelee: false, extinguish: extinguishes });
          }
          hit = true;
          break;
        }
      }
    }
    if (hit) bullets.splice(i, 1);
  }
}

// Other players' shots (see the 'shot' state handler) — purely visual, so no
// enemy-collision loop here; each shooter's own client already resolves its own hits.
function updateRemoteBullets(dt) {
  for (let i = remoteBullets.length-1; i >= 0; i--) {
    const b = remoteBullets[i];

    // Cosmetic-only wall bounce, mirroring updateBouncingBullet() — no enemy
    // interaction here (remote bullets never do collision/damage locally;
    // the shooter's own client already resolved every hit), just enough so
    // other players see the same ricochet path instead of it vanishing early.
    if (b.bouncesLeft !== undefined) {
      let nx = b.x + b.dx * dt;
      const wallX = pointInWall(nx, b.y) || nx < 0 || nx > MAP_W;
      if (wallX) { b.dx = -b.dx; nx = b.x; }
      let ny = b.y + b.dy * dt;
      const wallY = pointInWall(nx, ny) || ny < 0 || ny > MAP_H;
      if (wallY) { b.dy = -b.dy; ny = b.y; }
      b.x = nx; b.y = ny;
      b.distTravelled += Math.sqrt(b.dx*b.dx + b.dy*b.dy) * dt;
      if (wallX || wallY) {
        if (b.bouncesLeft <= 0) { remoteBullets.splice(i, 1); continue; }
        b.bouncesLeft--;
      }
      if (b.distTravelled > b.range) remoteBullets.splice(i, 1);
      continue;
    }

    b.x += b.dx * dt;
    b.y += b.dy * dt;
    b.distTravelled += Math.sqrt(b.dx*b.dx + b.dy*b.dy) * dt;
    if (b.distTravelled > b.range || pointInWall(b.x, b.y) ||
        b.x < 0 || b.x > MAP_W || b.y < 0 || b.y > MAP_H) {
      remoteBullets.splice(i, 1);
    }
  }
}

function drawBullets(ctx) {
  for (const b of bullets) {
    ctx.fillStyle = b.color || '#f0e040';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size || 3, 0, Math.PI*2);
    ctx.fill();
  }
  for (const b of remoteBullets) {
    ctx.fillStyle = b.color || '#f0e040';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size || 3, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

// === MELEE ===

function doMelee() {
  player.meleeCd = EQUIPPED_MELEE.meleeCd;
  player.flashTimer = 0.08;
  SOUNDS.play(EQUIPPED_MELEE.name, 'attack');
  const aimAngle = player.rawAngle;
  for (const e of enemies) {
    if (e.deathTimer >= 0) continue;
    const dist = Math.hypot(e.x - player.x, e.y - player.y);
    if (dist > EQUIPPED_MELEE.meleeRange) continue;
    const toEnemy = Math.atan2(e.y - player.y, e.x - player.x);
    let diff = toEnemy - aimAngle;
    while (diff >  Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    if (Math.abs(diff) < MELEE_ARC/2) {
      if (STATE === 'mpPlaying' && !isHost) {
        e.flashTimer = 0.1;
        SOUNDS.play(e.type, 'damage');
        Net.send('hit', { enemyId: e.id, dmg: EQUIPPED_MELEE.meleeDmg, isMelee: true });
      } else {
        applyDamageToEnemy(e, EQUIPPED_MELEE.meleeDmg, true, Net.playerId);
      }
    }
  }
  if (mpMode === 'ffa') {
    for (const [id, rp] of remotePlayers) {
      if (rp.x === undefined || rp.hp <= 0) continue;
      const dist = Math.hypot(rp.x - player.x, rp.y - player.y);
      if (dist > EQUIPPED_MELEE.meleeRange) continue;
      const toTarget = Math.atan2(rp.y - player.y, rp.x - player.x);
      let diff = toTarget - aimAngle;
      while (diff >  Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      if (Math.abs(diff) < MELEE_ARC/2) {
        Net.send('hitPlayer', { targetId: id, dmg: EQUIPPED_MELEE.meleeDmg, isMelee: true });
      }
    }
  }
  // Melee arc visual
  const aimA = aimAngle;
  for (let i = 0; i < 6; i++) {
    const a = aimA - MELEE_ARC/2 + (i/5)*MELEE_ARC;
    particles.push({
      x: player.x + Math.cos(a)*EQUIPPED_MELEE.meleeRange*0.5,
      y: player.y + Math.sin(a)*EQUIPPED_MELEE.meleeRange*0.5,
      dx: Math.cos(a)*30, dy: Math.sin(a)*30,
      color: '#f0c840', life:0.15, maxLife:0.15, size:4,
    });
  }

  // Let every other player see this swing — visual only, mirrors the local
  // arc/particle burst above; each attacker's own client still resolves its own hits.
  if (STATE === 'mpPlaying') {
    Net.send('state', { kind: 'melee', data: {
      angle: aimAngle, range: EQUIPPED_MELEE.meleeRange, duration: EQUIPPED_MELEE.meleeCd,
    }});
  }
}

// === PICKUPS ===

// Applies a health/ammo/armor/speed effect to the local player — shared by
// ground pickups below and FFA killstreak rewards (killstreakRewardFor()),
// so both grant identical effects. Weapon pickups aren't handled here (they
// carry a {category, weaponName} pair, not a bare amount) — see
// selectLoadoutWeapon() for that equip logic instead.
function applyPickupEffect(kind, amount) {
  if (kind === 'health') {
    player.hp = Math.min(player.hp + amount, player.maxHp);
    spawnFlash('+' + amount + ' HP', player.x, player.y - 20, '#f04060');
  } else if (kind === 'ammo') {
    player.reserve = Math.min(player.reserve + amount, RESERVE_AMMO_CAP);
    spawnFlash('+' + amount + ' AMMO', player.x, player.y - 20, '#c8e840');
  } else if (kind === 'armor') {
    if (CONFIG.PICKUP_ARMOR.stackable === 'off') {
      // Non-stacking: each pickup sets the charge count rather than
      // adding to it — same "refresh, don't accumulate" idea Speed
      // Boost's duration already uses.
      player.armor = amount;
      spawnFlash('ARMOR x' + amount, player.x, player.y - 20, '#40c8f0');
    } else {
      player.armor += amount;
      spawnFlash('+' + amount + ' ARMOR', player.x, player.y - 20, '#40c8f0');
    }
  } else if (kind === 'speed') {
    // Refreshes to the full duration rather than stacking — a buff timer,
    // not an accumulating resource like ammo/hp.
    player.speedBoostTimer = amount;
    spawnFlash('SPEED BOOST', player.x, player.y - 20, '#f0e040');
  }
}

// FFA kill-streak reward thresholds: armor at 3, speed at 5, health at 7,
// then rotating every +3 after that. Hardcoded for v1 (a good future
// devtool-configurable knob, same pattern as mercs_loot_pool).
function killstreakRewardFor(streak) {
  const amountFor = kind => kind === 'armor' ? CONFIG.PICKUP_ARMOR.hits
    : kind === 'speed' ? CONFIG.PICKUP_SPEED.duration : 50;
  const table = [{ at: 3, kind: 'armor' }, { at: 5, kind: 'speed' }, { at: 7, kind: 'health' }];
  const hit = table.find(t => t.at === streak);
  if (hit) return { kind: hit.kind, amount: amountFor(hit.kind) };
  if (streak > 7 && (streak - 7) % 3 === 0) {
    const cycle = ['armor', 'speed', 'health'];
    const kind = cycle[((streak - 7) / 3 - 1) % 3];
    return { kind, amount: amountFor(kind) };
  }
  return null;
}

// Host-authoritative FFA kill/death crediting — called both when the host
// receives another player's 'eliminated' report and when the host itself is
// the victim (damagePlayerFFA() calls this directly, no round trip needed).
// playerScores mutations flow to every client through the existing hostState
// broadcast already in updateMultiplayerNet(), so no new sync plumbing here.
function applyEliminationLocally(killerId, victimId) {
  const victim = playerScores[victimId] || (playerScores[victimId] = { name: '', score: 0, kills: 0, deaths: 0, streak: 0 });
  victim.deaths = (victim.deaths || 0) + 1;
  victim.streak = 0;
  if (killerId && killerId !== victimId) {
    const killer = playerScores[killerId] || (playerScores[killerId] = { name: '', score: 0, kills: 0, deaths: 0, streak: 0 });
    killer.kills = (killer.kills || 0) + 1;
    killer.score = killer.kills; // FFA ranks by kills — mirror into score so existing sort-by-score code paths keep working
    killer.streak = (killer.streak || 0) + 1;
    const reward = killstreakRewardFor(killer.streak);
    if (reward) {
      if (killerId === Net.playerId) applyPickupEffect(reward.kind, reward.amount);
      else Net.send('killstreakReward', { targetId: killerId, kind: reward.kind, amount: reward.amount });
    }
  }
}

function updatePickups(dt) {
  for (let i = pickups.length-1; i >= 0; i--) {
    const p = pickups[i];
    p.timer += dt;
    if (p.timer > 8) { pickups.splice(i, 1); continue; }
    const dist = Math.hypot(player.x - p.x, player.y - p.y);
    if (dist < 18) {
      SOUNDS.play(pickupSoundName(p.kind), 'pickup');
      if (p.kind === 'weapon') {
        if (p.category === 'ranged') {
          Object.assign(EQUIPPED_RANGED, resolveEquippedWeapon('ranged', p.weaponName));
          player.mag = Math.min(EQUIPPED_RANGED.magSize, EQUIPPED_RANGED.ammo);
          player.reserve = EQUIPPED_RANGED.ammo - player.mag;
          player.reloading = false; player.reloadTimer = 0; player.fireCd = 0;
        } else {
          Object.assign(EQUIPPED_MELEE, resolveEquippedWeapon('melee', p.weaponName));
          player.meleeCd = 0;
        }
        spawnFlash('EQUIPPED ' + p.weaponName.replace('WEAPON_','').replace(/_/g,' '), p.x, p.y - 10, '#3ef83e');
      } else if (p.kind === 'armor') {
        applyPickupEffect('armor', CONFIG.PICKUP_ARMOR.hits);
      } else if (p.kind === 'speed') {
        applyPickupEffect('speed', CONFIG.PICKUP_SPEED.duration);
      } else {
        applyPickupEffect(p.kind, p.amount); // health/ammo carry their own rolled amount
      }
      pickups.splice(i, 1);
      // Tell the host this pickup is gone so another player's client (which
      // may not notice for up to ~100ms) doesn't also grant it. No-op if
      // we ARE the host — the server doesn't route a host's own messages back.
      if (STATE === 'mpPlaying') Net.send('claim', { pickupId: p.id });
    }
  }
}

function drawPickups(ctx) {
  for (const p of pickups) {
    const bob = Math.sin(p.timer * 5) * 2;
    const alpha = p.timer > 6 ? 1 - (p.timer-6)/2 : 1;
    ctx.globalAlpha = alpha;
    if (p.kind === 'health') {
      SPRITES.draw('PICKUP_HEALTH', ctx, p.x, p.y + bob, 16, 16, 0);
    } else if (p.kind === 'ammo') {
      SPRITES.draw('PICKUP_AMMO', ctx, p.x, p.y + bob, 18, 12, 0);
    } else if (p.kind === 'weapon') {
      const fallback = p.category === 'ranged' ? 'WEAPON_PISTOL' : 'WEAPON_KNIFE';
      const w = 22, h = 11;
      ctx.save();
      ctx.globalAlpha = alpha * 0.35;
      ctx.fillStyle = '#3ef83e';
      ctx.beginPath(); ctx.arc(p.x, p.y + bob, 14, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x - w/2, p.y + bob - h/2);
      drawWeaponIcon(ctx, p.weaponName, w, h, fallback);
      ctx.restore();
    } else if (p.kind === 'armor') {
      SPRITES.draw('PICKUP_ARMOR', ctx, p.x, p.y + bob, 18, 18, 0);
    } else if (p.kind === 'speed') {
      SPRITES.draw('PICKUP_SPEED', ctx, p.x, p.y + bob, 18, 18, 0);
    }
    ctx.globalAlpha = 1;
  }
}

// === PARTICLES ===

// Continuous fire-particle trickle for anyone currently on fire (Flame Cone
// burn status) — purely cosmetic. Runs identically for everyone: enemies and
// the local player read their own authoritative burnTimer directly, while
// remote enemies (non-host) and remote players read the `burning` flag
// mirrored through the network (see updateMultiplayerNet()/Net.on('state')).
function updateBurningVisuals() {
  function trickle(x, y) {
    if (Math.random() > 0.5) return; // don't spawn a particle every single frame — too dense
    const roll = Math.random();
    particles.push({
      x: x + (Math.random()-0.5)*10, y: y + (Math.random()-0.5)*10,
      dx: (Math.random()-0.5)*20, dy: -30 - Math.random()*30,
      color: roll < 0.33 ? '#ff4d1a' : roll < 0.66 ? '#ff9c1a' : '#ffe066',
      life: 0.2 + Math.random()*0.15,
      maxLife: 0.35,
      size: 3 + Math.random()*3,
    });
  }

  for (const e of enemies) {
    if (e.deathTimer < 0 && (e.burnTimer > 0 || e.burning)) trickle(e.x, e.y);
  }
  if (mpMode === 'ffa' && player.burnTimer > 0 && !mpDowned) trickle(player.x, player.y);
  remotePlayers.forEach(rp => {
    if (rp.burning && rp.hp > 0 && rp.x !== undefined) trickle(rp.x, rp.y);
  });
}

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.dx * dt; p.y += p.dy * dt;
    p.dx *= 0.92; p.dy *= 0.92;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles(ctx) {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// An expanding, fading ring showing an explosion's ACTUAL blast radius (unlike
// the particle burst above, which is stylistic and doesn't scale with
// splashRadius) — spawned by explodeSplash() locally and by the 'explosion'
// state handler for remote players' rockets, so every viewer sees the true
// hit area regardless of how big Splash Radius is configured.
function spawnShockwave(x, y, radius) {
  if (radius <= 0) return;
  shockwaves.push({ x, y, maxRadius: radius, timer: 0, duration: 0.35 });
}

function updateShockwaves(dt) {
  for (let i = shockwaves.length-1; i >= 0; i--) {
    const s = shockwaves[i];
    s.timer += dt;
    if (s.timer >= s.duration) shockwaves.splice(i, 1);
  }
}

function drawShockwaves(ctx) {
  for (const s of shockwaves) {
    const progress = s.timer / s.duration;
    const radius = s.maxRadius * (1 - Math.pow(1 - progress, 2)); // ease-out: fast expand, settle at the true radius
    ctx.globalAlpha = Math.max(0, 1 - progress) * 0.8;
    ctx.strokeStyle = '#ff8c1a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, radius, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// A hitscan shot's only visual — a straight trace line from muzzle to impact
// point that fades almost immediately, since the hit itself is resolved the
// same frame it's fired (see fireHitscan()).
function updateBeams(dt) {
  for (let i = beams.length-1; i >= 0; i--) {
    const b = beams[i];
    b.timer += dt;
    if (b.timer >= b.duration) beams.splice(i, 1);
  }
}

function drawBeams(ctx) {
  for (const b of beams) {
    const progress = b.timer / b.duration;
    ctx.globalAlpha = Math.max(0, 1 - progress);
    ctx.strokeStyle = b.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.lineTo(b.x2, b.y2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// === FLASHES ===

function spawnFlash(text, x, y, color) {
  flashes.push({ text, x, y: y, vy: -28, color, timer:0, maxTimer:1000 });
}

function updateFlashes(dt) {
  for (let i = flashes.length-1; i >= 0; i--) {
    const f = flashes[i];
    f.timer += dt * 1000;
    f.y += f.vy * dt;
    if (f.timer > f.maxTimer) flashes.splice(i, 1);
  }
}

function drawFlashes(ctx) {
  ctx.textAlign = 'center';
  for (const f of flashes) {
    const alpha = f.timer < 200 ? f.timer/200 : Math.max(0, 1 - (f.timer-600)/400);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 18px VT323, monospace';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// === HUD ===

// Shared by drawHUD (single-player) and drawMpHUD — a compact panel just
// below the HP/ammo panel showing both currently-equipped weapons (icon +
// name), since either can change mid-run via a weapon pickup (see the
// p.kind === 'weapon' collection branch) with no other visual confirmation
// of what's actually equipped afterward.
function drawEquippedWeaponsPanel(ctx) {
  const x = 8, y = 72, w = 160, h = 46;
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#3a384e'; ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = '#5a5870'; ctx.font = '11px VT323, monospace';
  ctx.fillText('LOADOUT', x + 6, y + 12);

  const slotW = w / 2;
  [
    { weapon: EQUIPPED_RANGED, fallback: 'WEAPON_PISTOL' },
    { weapon: EQUIPPED_MELEE,  fallback: 'WEAPON_KNIFE'  },
  ].forEach((slot, i) => {
    const cx = x + slotW * i;
    const iconW = 32, iconH = 16;
    ctx.save();
    ctx.translate(cx + slotW/2 - iconW/2, y + 16);
    drawWeaponIcon(ctx, slot.weapon.name, iconW, iconH, slot.fallback);
    ctx.restore();

    const label = slot.weapon.name.replace('WEAPON_', '').replace(/_/g, ' ');
    ctx.fillStyle = '#c8c6e0'; ctx.font = '11px VT323, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, cx + slotW/2, y + 42);
    ctx.textAlign = 'left';
  });
}

// Shared by drawHUD/drawMpHUD — a compact strip just below the LOADOUT panel
// showing active Armor charges / Speed Boost time remaining. Hidden entirely
// (draws nothing, takes no space) when neither is active, so ordinary play
// isn't cluttered with an empty box.
function drawStatusEffects(ctx) {
  if (player.armor <= 0 && player.speedBoostTimer <= 0) return;
  const lines = [];
  if (player.armor > 0) lines.push({ text: 'ARMOR x' + player.armor, color: '#40c8f0' });
  if (player.speedBoostTimer > 0) lines.push({ text: 'SPEED ' + player.speedBoostTimer.toFixed(1) + 's', color: '#f0e040' });

  const x = 8, y = 122, w = 160, h = 10 + lines.length * 16;
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#3a384e'; ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
  lines.forEach((line, i) => {
    ctx.fillStyle = line.color; ctx.font = '14px VT323, monospace';
    ctx.fillText(line.text, x + 8, y + 15 + i * 16);
  });
}

// Shared by drawHUD (single-player) and drawMpHUD (multiplayer's shared team
// combo) — same flash-and-scale text at center bottom either way.
function drawComboMilestone(ctx) {
  if (comboMilestoneTimer > 0 && comboMilestone) {
    const alpha = comboMilestoneTimer > 1500 ? 1 : comboMilestoneTimer / 1500;
    const scale = comboMilestoneTimer > 1700 ? 1 + (2000-comboMilestoneTimer)/300*0.3 : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(CW/2, CH-30);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f0c840';
    ctx.font = '36px VT323, monospace';
    ctx.fillText(comboMilestone, 0, 0);
    ctx.restore();
    ctx.textAlign = 'left';
  }
}

function drawHUD(ctx) {
  // Semi-transparent panel areas
  const panelAlpha = 0.72;

  // Top center: timer
  ctx.fillStyle = `rgba(0,0,0,${panelAlpha})`;
  ctx.fillRect(CW/2-70, 8, 140, 46);
  ctx.strokeStyle = mainTimer < 30 ? '#c84040' : '#3a384e';
  ctx.lineWidth = 1;
  ctx.strokeRect(CW/2-70, 8, 140, 46);
  const timerStr = mainTimer < 10 ? '0' + mainTimer.toFixed(1) : mainTimer.toFixed(1);
  ctx.fillStyle = mainTimer < 30 ? '#ff4040' : '#f0f0f0';
  ctx.font = `${mainTimer < 10 ? '38' : '34'}px VT323, monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(timerStr, CW/2, 46);
  ctx.font = '11px VT323, monospace';
  ctx.fillStyle = '#5a5870';
  ctx.fillText('TIMER', CW/2, 14);
  ctx.textAlign = 'left';

  // Top left: HP + ammo
  ctx.fillStyle = `rgba(0,0,0,${panelAlpha})`;
  ctx.fillRect(8, 8, 160, 60);
  ctx.strokeStyle = '#3a384e'; ctx.lineWidth=1;
  ctx.strokeRect(8, 8, 160, 60);
  // HP bar
  ctx.fillStyle = '#2a1a1a';
  ctx.fillRect(14, 18, 148, 10);
  const hpPct = player.hp / player.maxHp;
  ctx.fillStyle = hpPct > 0.5 ? '#3ec83e' : hpPct > 0.25 ? '#c8a840' : '#c84040';
  ctx.fillRect(14, 18, Math.round(148 * hpPct), 10);
  ctx.strokeStyle='#3a384e'; ctx.strokeRect(14,18,148,10);
  ctx.fillStyle = '#8a88a0'; ctx.font='12px VT323, monospace';
  ctx.fillText('HP  ' + player.hp + ' / ' + player.maxHp, 14, 44);
  // Ammo / Reload
  if (player.reloading) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 150);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#f0a840'; ctx.font='13px VT323, monospace';
    ctx.fillText('RELOADING...', 14, 60);
    ctx.globalAlpha = 1;
  } else if (EQUIPPED_RANGED.unlimitedAmmo) {
    ctx.fillStyle = '#f0c840'; ctx.font='13px VT323, monospace';
    ctx.fillText('AMMO  ∞', 14, 60);
  } else {
    ctx.fillStyle = '#f0c840'; ctx.font='13px VT323, monospace';
    ctx.fillText('AMMO  ' + player.mag + ' / ' + player.reserve, 14, 60);
  }

  drawEquippedWeaponsPanel(ctx);
  drawStatusEffects(ctx);

  // Top right: score + combo
  ctx.fillStyle = `rgba(0,0,0,${panelAlpha})`;
  ctx.fillRect(CW-168, 8, 160, 60);
  ctx.strokeStyle = '#3a384e'; ctx.strokeRect(CW-168, 8, 160, 60);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#c8a840'; ctx.font='22px VT323, monospace';
  ctx.fillText(score.toString().padStart(8,'0'), CW-12, 32);
  ctx.fillStyle = '#8a88a0'; ctx.font='11px VT323, monospace';
  ctx.fillText('SCORE', CW-12, 14);
  // Combo
  const comboColor = combo >= 20 ? '#ff8040' : combo >= 10 ? '#f0c840' : combo >= 5 ? '#c8e840' : '#3ef83e';
  ctx.fillStyle = comboColor; ctx.font='18px VT323, monospace';
  ctx.fillText('x' + (combo || 1) + '  COMBO', CW-12, 50);
  // Combo timer bar
  if (combo > 0) {
    const cbPct = comboTimer / COMBO_TIMEOUT;
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(CW-168, 62, 160, 5);
    ctx.fillStyle = comboColor;
    ctx.fillRect(CW-168, 62, Math.round(160 * cbPct), 5);
  }
  ctx.textAlign = 'left';

  drawComboMilestone(ctx);

  // High score hint
  if (highScore > 0) {
    ctx.fillStyle = '#2a2840';
    ctx.font = '12px VT323, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BEST  ' + highScore.toString().padStart(8,'0'), CW/2, CH-8);
    ctx.textAlign = 'left';
  }
}

// Multiplayer HUD — same timer/HP/ammo panels as the single-player HUD, but
// the top-right panel is a live scoreboard instead of one player's score/combo.
function drawMpHUD(ctx) {
  const panelAlpha = 0.72;

  // Top center: timer (host-authoritative, broadcast to everyone)
  ctx.fillStyle = `rgba(0,0,0,${panelAlpha})`;
  ctx.fillRect(CW/2-70, 8, 140, 46);
  ctx.strokeStyle = mainTimer < 30 ? '#c84040' : '#3a384e';
  ctx.lineWidth = 1;
  ctx.strokeRect(CW/2-70, 8, 140, 46);
  const timerStr = mainTimer < 10 ? '0' + mainTimer.toFixed(1) : mainTimer.toFixed(1);
  ctx.fillStyle = mainTimer < 30 ? '#ff4040' : '#f0f0f0';
  ctx.font = `${mainTimer < 10 ? '38' : '34'}px VT323, monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(timerStr, CW/2, 46);
  ctx.font = '11px VT323, monospace';
  ctx.fillStyle = '#5a5870';
  ctx.fillText('TIMER', CW/2, 14);
  ctx.textAlign = 'left';

  // Top left: HP + ammo (this client's own player)
  ctx.fillStyle = `rgba(0,0,0,${panelAlpha})`;
  ctx.fillRect(8, 8, 160, 60);
  ctx.strokeStyle = '#3a384e'; ctx.lineWidth=1;
  ctx.strokeRect(8, 8, 160, 60);
  ctx.fillStyle = '#2a1a1a';
  ctx.fillRect(14, 18, 148, 10);
  const hpPct = Math.max(0, player.hp / player.maxHp);
  ctx.fillStyle = hpPct > 0.5 ? '#3ec83e' : hpPct > 0.25 ? '#c8a840' : '#c84040';
  ctx.fillRect(14, 18, Math.round(148 * hpPct), 10);
  ctx.strokeStyle='#3a384e'; ctx.strokeRect(14,18,148,10);
  ctx.fillStyle = '#8a88a0'; ctx.font='12px VT323, monospace';
  ctx.fillText('HP  ' + player.hp + ' / ' + player.maxHp, 14, 44);
  if (player.reloading) {
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 150);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#f0a840'; ctx.font='13px VT323, monospace';
    ctx.fillText('RELOADING...', 14, 60);
    ctx.globalAlpha = 1;
  } else if (EQUIPPED_RANGED.unlimitedAmmo) {
    ctx.fillStyle = '#f0c840'; ctx.font='13px VT323, monospace';
    ctx.fillText('AMMO  ∞', 14, 60);
  } else {
    ctx.fillStyle = '#f0c840'; ctx.font='13px VT323, monospace';
    ctx.fillText('AMMO  ' + player.mag + ' / ' + player.reserve, 14, 60);
  }

  drawEquippedWeaponsPanel(ctx);
  drawStatusEffects(ctx);

  // Top right: live scoreboard (host-authoritative, broadcast to everyone)
  const entries = Object.entries(playerScores).sort((a, b) => b[1].score - a[1].score).slice(0, 4);
  const boardH = 20 + entries.length * 18;
  ctx.fillStyle = `rgba(0,0,0,${panelAlpha})`;
  ctx.fillRect(CW-180, 8, 172, boardH);
  ctx.strokeStyle = '#3a384e'; ctx.strokeRect(CW-180, 8, 172, boardH);
  ctx.fillStyle = '#8a88a0'; ctx.font = '11px VT323, monospace';
  ctx.fillText('SCOREBOARD', CW-174, 20);
  entries.forEach(([id, ps], i) => {
    const y = 36 + i*18;
    ctx.fillStyle = id === Net.playerId ? '#3ef83e' : '#c8c6e0';
    ctx.font = '13px VT323, monospace';
    ctx.fillText((ps.name || '?').slice(0, 10), CW-174, y);
    ctx.textAlign = 'right';
    ctx.fillText(String(ps.score), CW-14, y);
    ctx.textAlign = 'left';
  });

  // Team combo — shared across every player, not per-player like the
  // scoreboard above.
  const comboY = 8 + boardH + 8;
  const comboColor = mpCombo >= 20 ? '#ff8040' : mpCombo >= 10 ? '#f0c840' : mpCombo >= 5 ? '#c8e840' : '#3ef83e';
  ctx.fillStyle = `rgba(0,0,0,${panelAlpha})`;
  ctx.fillRect(CW-180, comboY, 172, 34);
  ctx.strokeStyle = '#3a384e'; ctx.strokeRect(CW-180, comboY, 172, 34);
  ctx.textAlign = 'right';
  ctx.fillStyle = comboColor; ctx.font = '18px VT323, monospace';
  ctx.fillText('x' + (mpCombo || 1) + '  TEAM COMBO', CW-14, comboY + 22);
  ctx.textAlign = 'left';
  if (mpCombo > 0) {
    const cbPct = mpComboTimer / COMBO_TIMEOUT;
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(CW-180, comboY + 30, 172, 4);
    ctx.fillStyle = comboColor;
    ctx.fillRect(CW-180, comboY + 30, Math.round(172 * cbPct), 4);
  }

  drawComboMilestone(ctx);

  if (mpDowned) {
    const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 300);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#c84040';
    ctx.font = '28px VT323, monospace';
    ctx.textAlign = 'center';
    const secs = Math.max(0, Math.ceil(mpRespawnTimer));
    ctx.fillText((mpMode === 'ffa' ? 'ELIMINATED' : 'DOWNED') + ' — RESPAWNING IN ' + secs + 's', CW/2, CH - 40);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

function drawMpEndedScreen(ctx) {
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0,0,CW,CH);
  ctx.textAlign = 'center';

  ctx.fillStyle = '#3ef83e';
  ctx.font = '44px VT323, monospace';
  ctx.fillText('MATCH OVER', CW/2, 80);

  const isFfa = mpMode === 'ffa';
  const entries = Object.entries(mpFinalScores).sort((a, b) =>
    isFfa ? (b[1].kills || 0) - (a[1].kills || 0) : b[1].score - a[1].score);
  let y = 140;
  if (entries.length === 0) {
    ctx.fillStyle = '#5a5870';
    ctx.font = '16px VT323, monospace';
    ctx.fillText('No scores recorded.', CW/2, y);
    y += 30;
  } else {
    entries.forEach(([id, ps], i) => {
      ctx.fillStyle = i === 0 ? '#f0e040' : (id === Net.playerId ? '#3ef83e' : '#c8c6e0');
      ctx.font = '22px VT323, monospace';
      const label = isFfa
        ? (ps.name || '?') + '   ' + (ps.kills || 0) + ' K / ' + (ps.deaths || 0) + ' D'
        : (ps.name || '?') + '   ' + ps.score;
      ctx.fillText((i+1) + '. ' + label, CW/2, y);
      y += 32;
    });
  }

  const teamScore = entries.reduce((sum, [, ps]) => sum + (ps.score || 0), 0);
  if (entries.length > 0) {
    ctx.fillStyle = '#8a88a0';
    ctx.font = '16px VT323, monospace';
    ctx.fillText(isFfa ? 'WINNER:  ' + (entries[0][1].name || '?') : 'TEAM TOTAL:  ' + teamScore, CW/2, y + 6);
    y += 34;
  }

  const bw = 220, bh = 46, bx = CW/2 - bw/2;
  let by = y + 16;

  // Submitting the team's run is the host's call only, and only makes sense
  // for coop (FFA has no persistent leaderboard) — everyone else just sees
  // the final scores and heads back to browsing lobbies.
  if (isHost && !isFfa && entries.length > 0) {
    uiButton(ctx, bx, by, bw, bh, '[ SAVE TEAM RUN ]', () => {
      qualifiesForLeaderboard(teamScore, LB_BOARD_MP).then(qualifies => {
        if (qualifies) {
          pendingScore = teamScore;
          pendingCombo = mpFinalCombo;
          pendingKills = entries.reduce((sum, [, ps]) => sum + (ps.kills || 0), 0);
          pendingDuration = mpFinalDuration;
          initials = ['A','A','A']; initialsCursor = 0;
          STATE = 'mpEnterInitials';
        } else {
          mpLbMsg = 'Team score too low to make the leaderboard.';
          mpLbMsgUntil = Date.now() + 3000;
        }
      });
    });
    by += bh + 12;
  }

  uiButton(ctx, bx, by, bw, bh, '[ BACK TO LOBBIES ]', () => { STATE = 'mpBrowse'; Net.send('list'); });
  by += bh + 12;

  if (mpLbMsg && Date.now() < mpLbMsgUntil) {
    ctx.fillStyle = '#c84040';
    ctx.font = '14px VT323, monospace';
    ctx.fillText(mpLbMsg, CW/2, by);
  }
  ctx.textAlign = 'left';
}

// Live scoreboard, shown while holding Tab during a match — reuses the same
// sort/row logic as drawMpEndedScreen() (kills for FFA, score for coop) so
// the in-match and final views read identically, just against the live
// playerScores (already synced to every client via the hostState broadcast)
// instead of the frozen mpFinalScores snapshot.
function drawMpScoreboard(ctx) {
  const isFfa = mpMode === 'ffa';
  const entries = Object.entries(playerScores).sort((a, b) =>
    isFfa ? (b[1].kills || 0) - (a[1].kills || 0) : b[1].score - a[1].score);

  const panelW = 320, rowH = 28, headerH = 44;
  const panelH = headerH + Math.max(1, entries.length) * rowH + 12;
  const panelX = CW/2 - panelW/2, panelY = 30;
  ctx.fillStyle = 'rgba(10,10,18,0.85)';
  ctx.fillRect(panelX, panelY, panelW, panelH);
  ctx.strokeStyle = '#3ef83e';
  ctx.lineWidth = 1;
  ctx.strokeRect(panelX + 0.5, panelY + 0.5, panelW - 1, panelH - 1);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#3ef83e';
  ctx.font = '20px VT323, monospace';
  ctx.fillText(isFfa ? 'SCOREBOARD — KILLS / DEATHS' : 'SCOREBOARD', CW/2, panelY + 26);

  let y = panelY + headerH + 16;
  if (entries.length === 0) {
    ctx.fillStyle = '#5a5870';
    ctx.font = '14px VT323, monospace';
    ctx.fillText('No scores yet.', CW/2, y);
  } else {
    entries.forEach(([id, ps], i) => {
      ctx.fillStyle = i === 0 ? '#f0e040' : (id === Net.playerId ? '#3ef83e' : '#c8c6e0');
      ctx.font = '16px VT323, monospace';
      const label = isFfa
        ? (ps.name || '?') + '   ' + (ps.kills || 0) + ' K / ' + (ps.deaths || 0) + ' D'
        : (ps.name || '?') + '   ' + ps.score;
      ctx.fillText((i+1) + '. ' + label, CW/2, y);
      y += rowH;
    });
  }
  ctx.textAlign = 'left';
}

// FFA pre-match loadout pick + mid-match switch (reopened with 'b'). Mirrors
// updatePickups()'s ground-weapon-pickup swap branch exactly, extracted so
// both call sites share identical equip logic.
function selectLoadoutWeapon(category, name) {
  if (category === 'ranged') {
    Object.assign(EQUIPPED_RANGED, resolveEquippedWeapon('ranged', name));
    player.mag = Math.min(EQUIPPED_RANGED.magSize, EQUIPPED_RANGED.ammo);
    player.reserve = EQUIPPED_RANGED.ammo - player.mag;
    player.reloading = false; player.reloadTimer = 0; player.fireCd = 0;
  } else {
    Object.assign(EQUIPPED_MELEE, resolveEquippedWeapon('melee', name));
    player.meleeCd = 0;
  }
}

function drawMpLoadoutScreen(ctx, opts) {
  opts = opts || {};
  const closable = !!opts.closable;
  ctx.fillStyle = closable ? 'rgba(0,0,0,0.75)' : 'rgba(0,0,0,0.92)';
  ctx.fillRect(0,0,CW,CH);
  ctx.textAlign = 'center';

  ctx.fillStyle = '#3ef83e';
  ctx.font = '36px VT323, monospace';
  ctx.fillText(closable ? 'SWITCH LOADOUT' : 'CHOOSE YOUR LOADOUT', CW/2, 70);

  const pool = lootPoolEntries();
  const ranged = pool.filter(e => e.category === 'ranged');
  const melee  = pool.filter(e => e.category === 'melee');

  const colW = 300, colGap = 40;
  const colX1 = CW/2 - colGap/2 - colW;
  const colX2 = CW/2 + colGap/2;
  const topY = 130;

  // Fixed-height carousel (one weapon shown at a time, cycled with </>)
  // instead of a scrolling button list — a loot pool with many entries would
  // otherwise overflow the screen vertically. Browsing IS equipping (moving
  // to a new entry calls selectLoadoutWeapon immediately), so the displayed
  // entry always matches EQUIPPED_RANGED/EQUIPPED_MELEE — no separate
  // "current selection" state to track or desync.
  function drawCarousel(x, label, entries, category, currentName) {
    ctx.fillStyle = '#8a88a0';
    ctx.font = '18px VT323, monospace';
    ctx.fillText(label, x + colW/2, topY);

    if (entries.length === 0) {
      ctx.fillStyle = '#5a5870';
      ctx.font = '14px VT323, monospace';
      ctx.fillText('(none in loot pool)', x + colW/2, topY + 50);
      return;
    }

    let idx = entries.findIndex(e => e.name === currentName);
    if (idx === -1) idx = 0;

    const arrowY = topY + 46, arrowSize = 40;
    const step = dir => {
      const next = (idx + dir + entries.length) % entries.length;
      selectLoadoutWeapon(category, entries[next].name);
    };
    uiButton(ctx, x, arrowY, arrowSize, arrowSize, '<', () => step(-1));
    uiButton(ctx, x + colW - arrowSize, arrowY, arrowSize, arrowSize, '>', () => step(1));

    const textCenterX = x + colW/2 - 12;
    ctx.fillStyle = '#3ef83e';
    ctx.font = '22px VT323, monospace';
    ctx.fillText(entries[idx].name.replace('WEAPON_','').replace(/_/g,' '), textCenterX, arrowY + 27);

    ctx.fillStyle = '#5a5870';
    ctx.font = '14px VT323, monospace';
    ctx.fillText((idx+1) + ' / ' + entries.length, textCenterX, arrowY + arrowSize + 24);
  }

  drawCarousel(colX1, 'RANGED', ranged, 'ranged', EQUIPPED_RANGED.name);
  drawCarousel(colX2, 'MELEE', melee, 'melee', EQUIPPED_MELEE.name);

  const bw = 220, bh = 46, bx = CW/2 - bw/2, by = CH - 80;
  if (closable) {
    uiButton(ctx, bx, by, bw, bh, '[ CLOSE ]', () => { mpLoadoutOverlayOpen = false; });
  } else {
    uiButton(ctx, bx, by, bw, bh, '[ CONFIRM ]', () => { STATE = 'mpPlaying'; });
  }
  ctx.textAlign = 'left';
}

// === MULTIPLAYER (WebSocket lobby client) ===
//
// Thin client to match the server: the socket just relays lobby membership
// and, once in a match, per-message game state — see server.js for the
// authoritative protocol. `Net.playerId` is this client's id once connected.

const Net = {
  ws: null,
  playerId: null,
  handlers: {},
  connect(onOpen, onError) {
    const base = API_BASE || (location.protocol + '//' + location.host);
    const proto = base.startsWith('https') ? 'wss:' : 'ws:';
    const host = base.replace(/^https?:\/\//, '');
    const socket = new WebSocket(proto + '//' + host);
    this.ws = socket;
    socket.onopen  = () => { if (this.ws === socket) onOpen && onOpen(); };
    socket.onerror = () => { if (this.ws === socket) onError && onError(); };
    socket.onclose = () => {
      if (this.ws !== socket) return;
      this.playerId = null;
      if (this.onClose) this.onClose();
    };
    socket.onmessage = (e) => {
      if (this.ws !== socket) return;
      let msg;
      try { msg = JSON.parse(e.data); } catch(err) { return; }
      if (msg.type === 'welcome') this.playerId = msg.id;
      const h = this.handlers[msg.type];
      if (h) h(msg);
    };
  },
  send(type, data) {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
    this.ws.send(JSON.stringify(Object.assign({ type }, data || {})));
  },
  on(type, fn) { this.handlers[type] = fn; },
  close() { if (this.ws) { this.ws.close(); this.ws = null; } this.playerId = null; },
};

function mpPlayerName() { return localStorage.getItem('mercs_player_name') || 'Player'; }

// Canvas-drawn free-text entry — generalizes the arcade-initials cycling
// screen's "capture keyboard, no real <input>" pattern into arbitrary text
// (name entry, lobby naming), rather than the 3-letter cycling behavior itself.
const TextEntry = {
  active: false,
  value: '',
  maxLen: 20,
  onConfirm: null,
  onCancel: null,
  start(initial, maxLen, onConfirm, onCancel) {
    this.active = true;
    this.value = initial || '';
    this.maxLen = maxLen || 20;
    this.onConfirm = onConfirm;
    this.onCancel = onCancel;
  },
  handleKey(e) {
    if (!this.active) return;
    if (e.key === 'Enter') {
      this.active = false;
      e.preventDefault();
      const v = this.value;
      if (this.onConfirm) this.onConfirm(v);
    } else if (e.key === 'Escape') {
      this.active = false;
      e.preventDefault();
      if (this.onCancel) this.onCancel();
    } else if (e.key === 'Backspace') {
      this.value = this.value.slice(0, -1);
      e.preventDefault();
    } else if (e.key.length === 1 && this.value.length < this.maxLen && /[a-zA-Z0-9 _'-]/.test(e.key)) {
      this.value += e.key;
      e.preventDefault();
    }
  },
};

let mpConnectError = '';
let mpLobbies = [];
let mpCurrentLobby = null;
let mpErrorMsg = '';
let mpErrorUntil = 0;

// Gameplay-sync state — see server.js for the authoritative protocol this
// mirrors. `isHost` decides who simulates enemies/pickups/timer for real;
// everyone else just renders the host's broadcasts.
let isHost = false;
let remotePlayers = new Map(); // id -> { name, x, y, targetX, targetY, facing, hp, maxHp, weaponName, character, meleeSwingAngle, meleeSwingRange, meleeSwingDuration, meleeSwingTimer }
let playerScores = {};         // id -> { name, score } — host-authoritative, per-player
// Other players' shots, broadcast as a lightweight 'shot' state event per trigger
// pull (see spawnBullet) — visual only. Damage is never derived from these; each
// shooter's own client already resolves its own hits via the existing 'hit'
// message, so these never run through enemy-collision logic like local `bullets` do.
let remoteBullets = [];
// This player's own character-editor.html customization (build/colors/outfit
// params), if any — MP-only per-player cosmetic, not published to everyone
// like devtool's sprites. Broadcast to teammates so they see it too; loaded
// fresh at each match start in case it changed since the last one.
let myCharacter = null;
// WebSocket delivery is reliable/ordered (TCP), so this only needs to be
// sent once per match instead of riding along on every ~10Hz position
// update — it never changes mid-match, so resending it every tick was pure
// bandwidth waste on every player's connection.
let myCharacterSent = false;
function loadMyCharacter() {
  try {
    const raw = localStorage.getItem('mercs_my_character');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
// Combo is a shared team streak in MP (any player's kill extends it), unlike
// single-player's per-run combo/comboTimer above — host-authoritative, broadcast
// to everyone alongside scores.
let mpCombo = 0;
let mpComboTimer = 0;
let mpPeakCombo = 0; // highest mpCombo reached this match — for the leaderboard, not just the live counter
let mpFinalScores = {};
let mpFinalCombo = 0;    // set from the 'ended' message — match-wide, not per-player
let mpFinalDuration = 0; // set from the 'ended' message — match-wide, not per-player
// One-time token the server hands back with the real match result it
// recorded, so a later leaderboard submission can be checked against an
// actual match instead of trusting whatever number the client sends.
let mpMatchId = null;
let mpDowned = false;          // this client's own player hit 0 HP but the match continues
let mpRespawnTimer = 0;        // seconds remaining until this downed player respawns
let mpMode = 'coop';           // 'coop' | 'ffa' — set from the 'started' message's mode field
let mySpawnIndex = 0;          // this client's position within msg.players, used for FFA's fixed corner spawn points
let mpLoadoutOverlayOpen = false; // FFA-only: mid-match weapon-switch overlay, doesn't pause the world
let mpScoreboardHeld = false;  // held-Tab live scoreboard overlay (both modes)
let nextEnemyId = 1;
let nextPickupId = 1;
let netBroadcastTimer = 0;

Net.on('welcome', () => { STATE = 'mpBrowse'; Net.send('list'); });
Net.on('lobbies', msg => { mpLobbies = msg.list || []; });
Net.on('lobby', msg => {
  mpCurrentLobby = msg.lobby;
  if (STATE === 'mpBrowse') STATE = 'mpLobby';
});
Net.on('error', msg => { mpErrorMsg = msg.message || 'Error'; mpErrorUntil = Date.now() + 3000; });
Net.on('started', msg => { startMultiplayerMatch(msg); });
Net.on('ended', msg => {
  STATE = 'mpEnded';
  mpFinalScores = msg.scores || {};
  mpMatchId = msg.matchId || null;
  mpFinalCombo = msg.combo || 0;
  mpFinalDuration = msg.duration || 0;
});

Net.on('state', msg => {
  if (msg.kind === 'player') {
    let rp = remotePlayers.get(msg.from);
    if (!rp) { rp = { name: '', x: msg.data.x, y: msg.data.y }; remotePlayers.set(msg.from, rp); }
    rp.targetX = msg.data.x; rp.targetY = msg.data.y;
    rp.facing = msg.data.facing; rp.hp = msg.data.hp; rp.maxHp = msg.data.maxHp;
    rp.weaponName = msg.data.weaponName;
    rp.burning = msg.data.burning;
    // Only sent once (see updateMultiplayerNet) — don't let the many ticks
    // that omit it stomp the value back to null once it's been received.
    if (msg.data.character) rp.character = msg.data.character;
    if (rp.x === undefined) { rp.x = msg.data.x; rp.y = msg.data.y; }
  } else if (msg.kind === 'hostState' && !isHost) {
    const d = msg.data;

    // killEnemy() only ever runs on the host — detect enemies that just went
    // from alive to dead in this snapshot so non-host clients still get a
    // death sound instead of just the silent dissolve animation.
    const wasDead = new Set(enemies.filter(e => e.deathTimer >= 0).map(e => e.id));
    d.enemies.forEach(de => { if (de.deathTimer >= 0 && !wasDead.has(de.id)) SOUNDS.play(de.type, 'death'); });

    // Merge by id instead of fully replacing the array — keeps each enemy's
    // currently-rendered x/y in place and just updates targetX/targetY, so
    // updateEnemies() below can lerp toward the new position instead of the
    // whole enemy population hard-snapping every ~100ms (this is the same
    // smoothing remote players already get via updateRemotePlayers/targetX).
    const prevById = new Map(enemies.map(e => [e.id, e]));
    enemies = d.enemies.map(de => {
      const prev = prevById.get(de.id);
      const e = Object.assign({}, de, {
        def: ENEMY_DEFS[de.type] || ENEMY_DEFS.ENEMY_BASIC,
        targetX: de.x, targetY: de.y, targetAngle: de.angle,
      });
      if (prev) { e.x = prev.x; e.y = prev.y; e.angle = prev.angle; }
      return e;
    });

    // Same idea as the enemy-death diff above — pickups only ever spawn on
    // the host, so detect newly-appeared ones here to play a spawn sound.
    const hadIds = new Set(pickups.map(p => p.id));
    d.pickups.forEach(dp => { if (!hadIds.has(dp.id)) SOUNDS.play(pickupSoundName(dp.kind), 'spawn'); });
    pickups = d.pickups.map(dp => Object.assign({}, dp));

    mainTimer = d.mainTimer; elapsed = d.elapsed;
    playerScores = d.scores;
    mpCombo = d.combo;
    mpComboTimer = d.comboTimer;
    comboMilestone = d.milestone;
    comboMilestoneTimer = d.milestoneTimer;
  } else if (msg.kind === 'shot') {
    const d = msg.data;
    SOUNDS.play((remotePlayers.get(msg.from) || {}).weaponName || 'WEAPON_PISTOL', 'attack');
    (d.bullets || []).forEach(b => {
      const rb = { x:b.x, y:b.y, dx:b.dx, dy:b.dy, distTravelled:0, range:d.range,
        color: b.color || '#f0e040', size: b.size || 3 };
      if (b.bounces !== undefined) rb.bouncesLeft = b.bounces;
      remoteBullets.push(rb);
    });
  } else if (msg.kind === 'melee') {
    let rp = remotePlayers.get(msg.from);
    if (!rp) { rp = {}; remotePlayers.set(msg.from, rp); }
    rp.meleeSwingAngle = msg.data.angle;
    rp.meleeSwingRange = msg.data.range;
    rp.meleeSwingDuration = msg.data.duration;
    rp.meleeSwingTimer = msg.data.duration;
    if (rp.x !== undefined) {
      for (let i = 0; i < 6; i++) {
        const a = msg.data.angle - MELEE_ARC/2 + (i/5)*MELEE_ARC;
        particles.push({
          x: rp.x + Math.cos(a)*msg.data.range*0.5,
          y: rp.y + Math.sin(a)*msg.data.range*0.5,
          dx: Math.cos(a)*30, dy: Math.sin(a)*30,
          color: '#f0c840', life:0.15, maxLife:0.15, size:4,
        });
      }
    }
  } else if (msg.kind === 'explosion') {
    // Cosmetic-only sync (see explodeSplash()) — damage was already resolved
    // by the shooter's own client via discrete 'hit' messages; this just
    // replays the same burst so it shows up in the right place for everyone.
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 140;
      particles.push({
        x: msg.data.x, y: msg.data.y,
        dx: Math.cos(a) * spd, dy: Math.sin(a) * spd,
        color: Math.random() < 0.5 ? '#ff8c1a' : '#ffd23f',
        life: 0.25 + Math.random() * 0.35,
        maxLife: 0.6,
        size: 3 + Math.random() * 5,
      });
    }
    spawnShockwave(msg.data.x, msg.data.y, msg.data.radius || 0);
  } else if (msg.kind === 'beam') {
    // Cosmetic-only sync (see fireHitscan()) — damage was already resolved by
    // the shooter's own client via applyDamageToEnemy/'hit'/explodeSplash;
    // this just draws the same instant trace line for everyone else.
    const d = msg.data;
    beams.push({ x1: d.x1, y1: d.y1, x2: d.x2, y2: d.y2, color: '#7fe8ff', timer: 0, duration: 0.08 });
  } else if (msg.kind === 'flame') {
    // Cosmetic-only sync (see fireFlame()) — damage was already resolved by
    // the shooter's own client via applyDamageToEnemy/'hit'/'hitPlayer'; this
    // just replays the same flame-cone particle burst for everyone else.
    const d = msg.data;
    for (let i = 0; i < 6; i++) {
      const a = d.angle + (Math.random() - 0.5) * d.halfArc * 2;
      const dist = 10 + Math.random() * d.range;
      const roll = Math.random();
      particles.push({
        x: d.x + Math.cos(a) * dist,
        y: d.y + Math.sin(a) * dist,
        dx: Math.cos(a) * 80, dy: Math.sin(a) * 80,
        color: roll < 0.33 ? '#ff4d1a' : roll < 0.66 ? '#ff9c1a' : '#ffe066',
        life: 0.12 + Math.random() * 0.1,
        maxLife: 0.22,
        size: 4 + Math.random() * 4,
      });
    }
  }
});

// Only the host ever receives these (server routes them there directly) —
// resolves damage/pickup claims authoritatively, see applyDamageToEnemy().
Net.on('hit', msg => {
  if (!isHost) return;
  const e = enemies.find(en => en.id === msg.enemyId && en.deathTimer < 0);
  if (!e) return;
  applyDamageToEnemy(e, msg.dmg, !!msg.isMelee, msg.from, !!msg.extinguish);
  // A non-host client's Flame Cone hit also carries an optional burn payload
  // (see fireFlame()) — the host is the only one who ticks it, so ignite it
  // here rather than trusting the sender's own (non-authoritative) copy.
  if (msg.burn && msg.burn.duration > 0 && e.deathTimer < 0) {
    e.burnTimer = msg.burn.duration / 1000;
    e.burnTickTimer = BURN_TICK_INTERVAL;
    e.burnDps = msg.burn.dps;
    e.burnAttackerId = msg.from;
  }
});
Net.on('claim', msg => {
  if (!isHost) return;
  const idx = pickups.findIndex(p => p.id === msg.pickupId);
  if (idx !== -1) pickups.splice(idx, 1);
});

// FFA PVP damage — routed to this one specific target by server.js (unlike
// 'hit', which is always routed to whoever's the host). Applied to our own
// player.hp directly since that's the only client allowed to own it.
Net.on('hitPlayer', msg => {
  if (mpMode !== 'ffa') return;
  damagePlayerFFA(msg.dmg, msg.from);
  // Ignite/refresh our own burn status (see fireFlame()/tickPlayerBurn()) —
  // ticked locally each frame in updatePlayer() since this client is the
  // only one allowed to own its own hp.
  if (msg.burn && msg.burn.duration > 0) {
    player.burnTimer = msg.burn.duration / 1000;
