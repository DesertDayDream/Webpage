<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERCS — Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0d0b12;
    display:flex; align-items:center; justify-content:center;
    height:100vh; overflow:hidden;
    font-family:'VT323', monospace;
  }
  #wrap { position:relative; width:800px; height:600px; }
  #game-canvas {
    display:block; width:800px; height:600px;
    image-rendering:pixelated; cursor:crosshair;
  }
  /* Overlay panels drawn on canvas; pure canvas-only game */
</style>
</head>
<body>
<div id="wrap"><canvas id="game-canvas" width="800" height="600"></canvas></div>
<script>window.SITE_API_BASE = 'https://webpage-production-111b.up.railway.app';</script>
<script>
'use strict';

(async function() {

// Mirrors main.js's API_BASE — this page can be served from a different
// origin than the API/WebSocket backend (e.g. static hosting in front of
// Railway), so every /api/ call and the WebSocket connection below must go
// through this instead of a same-origin-only relative path.
const API_BASE = (typeof window.SITE_API_BASE === 'string') ? window.SITE_API_BASE : '';

// Minimal loading state on canvas while we fetch the devtool-published config
// from the server, so there isn't a blank flash before the rest of init runs.
const __loadCanvas = document.getElementById('game-canvas');
const __loadCtx = __loadCanvas.getContext('2d');
__loadCtx.fillStyle = '#0d0b12';
__loadCtx.fillRect(0, 0, __loadCanvas.width, __loadCanvas.height);
__loadCtx.fillStyle = '#3ef83e';
__loadCtx.font = '20px monospace';
__loadCtx.textAlign = 'center';
__loadCtx.fillText('LOADING...', __loadCanvas.width / 2, __loadCanvas.height / 2);

// Mirrors devtool.html's applyServerConfigToLocalStorage — this page is
// standalone (no shared JS module system in this project), so it's duplicated.
// Pulls the admin's published devtool config into this browser's localStorage
// before any of the config-reading code below executes, so every player's
// game reflects the same live, admin-controlled config.
function applyServerConfigToLocalStorage(cfg) {
  if (!cfg) return;
  if (cfg.constants)      localStorage.setItem('mercs_constants', JSON.stringify(cfg.constants));
  if (cfg.map)             localStorage.setItem('mercs_map', JSON.stringify(cfg.map));
  if (cfg.activeEnemies)  localStorage.setItem('mercs_active_enemies', JSON.stringify(cfg.activeEnemies));
  if (cfg.lootPool)        localStorage.setItem('mercs_loot_pool', JSON.stringify(cfg.lootPool));
  if (cfg.unlimitedAmmo)  localStorage.setItem('mercs_unlimited_ammo', JSON.stringify(cfg.unlimitedAmmo));
  if (cfg.weaponDropWeights) localStorage.setItem('mercs_weapon_drop_weights', JSON.stringify(cfg.weaponDropWeights));
  if (cfg.equippedRanged) localStorage.setItem('mercs_equipped_ranged', cfg.equippedRanged);
  if (cfg.equippedMelee)  localStorage.setItem('mercs_equipped_melee', cfg.equippedMelee);
  if (cfg.customWeapons)  localStorage.setItem('mercs_custom_weapons', JSON.stringify(cfg.customWeapons));
  if (cfg.customEnemies)  localStorage.setItem('mercs_custom_enemies', JSON.stringify(cfg.customEnemies));
  if (cfg.sprites) {
    Object.entries(cfg.sprites).forEach(([name, entry]) => {
      if (entry.type === 'anim') {
        localStorage.setItem('sprite_' + name + '_frames', JSON.stringify(entry.frames));
        localStorage.setItem('sprite_' + name + '_fps', entry.fps || 12);
        localStorage.removeItem('sprite_' + name);
      } else if (entry.type === 'image') {
        localStorage.setItem('sprite_' + name, entry.url);
        localStorage.removeItem('sprite_' + name + '_frames');
      }
    });
  }
  if (cfg.anchors) {
    Object.entries(cfg.anchors).forEach(([wn, data]) => {
      localStorage.setItem('weapon_' + wn + '_anchor', JSON.stringify(data));
    });
  }
  if (cfg.soundtrack) {
    if (cfg.soundtrack.menu)     localStorage.setItem('mercs_soundtrack_menu', JSON.stringify(cfg.soundtrack.menu));
    if (cfg.soundtrack.gameplay) localStorage.setItem('mercs_soundtrack_gameplay', JSON.stringify(cfg.soundtrack.gameplay));
  }
  if (cfg.sounds) {
    Object.entries(cfg.sounds).forEach(([name, kinds]) => {
      Object.entries(kinds).forEach(([kind, entry]) => {
        localStorage.setItem('sound_' + name + '_' + kind, entry.url);
        localStorage.setItem('sound_' + name + '_' + kind + '_vol', Number.isFinite(entry.volume) ? entry.volume : 100);
      });
    });
  }
}

try {
  const r = await fetch(API_BASE + '/api/mercs-config');
  const d = await r.json();
  applyServerConfigToLocalStorage(d && d.config);
} catch(e) {
  // Couldn't reach the server config — fall back to whatever's already in
  // this browser's localStorage.
}

// === CONSTANTS ===

const CW = 800, CH = 600; // fixed viewport/screen size — the world can be bigger
const TS = 32; // tile size for floor grid (visual only), also the map editor's grid snap
const camera = { x: 0, y: 0 };
const CAMERA_LERP = 6;

const PLAYER_SIZE      = 22;
const MELEE_ARC        = Math.PI * 0.65;
const COMBO_TIMEOUT    = 5000;
const MELEE_TIME_BONUS = 5;
const RESERVE_AMMO_CAP = 200;
const BURN_TICK_INTERVAL = 0.5; // seconds between each Flame Cone burn-status damage tick

// CONFIG — default values overridden by devtool (mercs_constants in localStorage)
const _C_DEFAULTS = {
  PLAYER:        { speed:190, hp:100, respawnTime:15 },
  WEAPON_PISTOL: { ammo:60, bulletDmg:28, bulletSpeed:420, bulletRange:520, fireMode:'semi', fireDelay:120, magSize:12, reloadTime:1200, pelletCount:1, spreadAngle:0, splashRadius:0, selfDamage:'off', hitscan:'off', maxBounces:0, flameCone:'off', burnDuration:0, burnDps:0, extinguish:'off' },
  WEAPON_KNIFE:  { meleeDmg:50, meleeRange:62, meleeCd:800 },
  ENEMY_BASIC:   { speed:62,  hp:50,  dmg:10,  score:100, size:20, unlockAt:0,  spawnChance:100, maxAlive:0, respawnDelay:0, noRespawn:'off' },
  ENEMY_FAST:    { speed:130, hp:28,  dmg:15,  score:150, size:16, unlockAt:30, spawnChance:100, maxAlive:0, respawnDelay:0, noRespawn:'off' },
  ENEMY_BRUTE:   { speed:36,  hp:220, dmg:28,  score:350, size:30, unlockAt:60, spawnChance:100, maxAlive:0, respawnDelay:0, noRespawn:'off' },
  PICKUP_AMMO:   { dropChance:28, amountMin:5,  amountMax:10 },
  PICKUP_HEALTH: { dropChance:14, healMin:20,   healMax:40   },
  PICKUP_WEAPON: { dropChance:8 },
  PICKUP_ARMOR:  { dropChance:10, hits:3, stackable:'on' },
  PICKUP_SPEED:  { dropChance:10, duration:8, multiplier:1.5 },
};
const CONFIG = (function() {
  const c = JSON.parse(JSON.stringify(_C_DEFAULTS));
  try {
    const s = JSON.parse(localStorage.getItem('mercs_constants') || '{}');
    Object.keys(s).forEach(k => { if (c[k]) Object.assign(c[k], s[k]); });
  } catch(e) {}
  return c;
})();

// Unlimited ammo — set via the "UNLIMITED" toggle in devtool.html (mercs_unlimited_ammo).
function loadUnlimitedAmmo() {
  try { return JSON.parse(localStorage.getItem('mercs_unlimited_ammo') || '{}'); } catch(e) { return {}; }
}

// Equipped weapon — set via the "EQUIP" toggle in devtool.html (mercs_equipped_ranged/melee).
// Custom weapons added in the devtool aren't in _C_DEFAULTS, so fall back to the
// base weapon's stat shape and overlay whatever constants were saved under the
// equipped weapon's own name. An explicit `overrideName` is used when a weapon
// pickup swaps the active weapon mid-run instead of the devtool-configured one.
function resolveEquippedWeapon(category, overrideName) {
  const baseName = category === 'ranged' ? 'WEAPON_PISTOL' : 'WEAPON_KNIFE';
  const name = overrideName || localStorage.getItem('mercs_equipped_' + category) || baseName;
  const cfg = Object.assign({}, _C_DEFAULTS[baseName]);
  try {
    const saved = JSON.parse(localStorage.getItem('mercs_constants') || '{}');
    if (saved[name]) Object.assign(cfg, saved[name]);
  } catch(e) {}
  cfg.name = name;
  // Always assign an explicit boolean (never leave the key absent) — EQUIPPED_RANGED
  // is mutated in place via Object.assign at other call sites (weapon pickup swap,
  // match reset), which only overwrites keys present on the source object. Leaving
  // this out when false would let a stale unlimitedAmmo:true survive a weapon swap.
  if (category === 'ranged') cfg.unlimitedAmmo = !!loadUnlimitedAmmo()[name];
  return cfg;
}
const EQUIPPED_RANGED = resolveEquippedWeapon('ranged');
const EQUIPPED_MELEE  = resolveEquippedWeapon('melee');

// Weapon drop loot pool — set via the "LOOT POOL" toggle in devtool.html (mercs_loot_pool).
function loadLootPool() {
  try { return JSON.parse(localStorage.getItem('mercs_loot_pool') || '{}'); } catch(e) { return {}; }
}
function lootPoolEntries() {
  const pool = loadLootPool();
  const entries = [];
  (pool.ranged || []).forEach(name => entries.push({ name, category:'ranged' }));
  (pool.melee  || []).forEach(name => entries.push({ name, category:'melee'  }));
  return entries;
}

// Per-weapon drop weight — set via the "DROP CHANCE" slider in devtool.html
// (mercs_weapon_drop_weights), shown once a weapon is in the loot pool. Not an
// independent percentage: when a weapon pickup rolls, the specific weapon is
// picked from the pool with probability proportional to its own weight versus
// the sum of every pooled weapon's weight. Weapons without a saved weight (or
// with the loot pool otherwise untouched) default equally, which reduces to
// today's plain uniform-random pick.
const WEAPON_DROP_WEIGHT_DEFAULT = 50;
function loadWeaponDropWeights() {
  try { return JSON.parse(localStorage.getItem('mercs_weapon_drop_weights') || '{}'); } catch(e) { return {}; }
}
function getWeaponDropWeight(name) {
  const w = loadWeaponDropWeights()[name];
  return typeof w === 'number' ? w : WEAPON_DROP_WEIGHT_DEFAULT;
}
function pickWeightedWeapon(pool) {
  const weights = pool.map(entry => Math.max(0.01, getWeaponDropWeight(entry.name)));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1]; // floating-point rounding fallback
}

// Active enemies — set via the "ACTIVE" toggle in devtool.html (mercs_active_enemies).
// No saved list yet (feature never touched) preserves the original always-on trio so
// existing runs don't silently lose enemies.
function loadActiveEnemyNames() {
  try {
    const raw = localStorage.getItem('mercs_active_enemies');
    if (raw === null) return ['ENEMY_BASIC', 'ENEMY_FAST', 'ENEMY_BRUTE'];
    return JSON.parse(raw);
  } catch(e) { return ['ENEMY_BASIC', 'ENEMY_FAST', 'ENEMY_BRUTE']; }
}

const ENEMY_BASE_COLORS = { ENEMY_BASIC:'#c04040', ENEMY_FAST:'#e07830', ENEMY_BRUTE:'#7840c0' };

// Custom enemies added in the devtool aren't in _C_DEFAULTS, so fall back to
// ENEMY_BASIC's stat shape and overlay whatever constants were saved under the
// enemy's own name — same pattern as resolveEquippedWeapon().
function resolveEnemyDef(name) {
  const baseName = _C_DEFAULTS[name] ? name : 'ENEMY_BASIC';
  const cfg = Object.assign({}, _C_DEFAULTS[baseName]);
  try {
    const saved = JSON.parse(localStorage.getItem('mercs_constants') || '{}');
    if (saved[name]) Object.assign(cfg, saved[name]);
  } catch(e) {}
  cfg.name = name;
  cfg.color = ENEMY_BASE_COLORS[name] || '#c04040';
  return cfg;
}

const ENEMY_DEFS = {};
loadActiveEnemyNames().forEach(name => { ENEMY_DEFS[name] = resolveEnemyDef(name); });

// Map — editable via map-editor.html (mercs_map in localStorage). Border walls are
// always auto-generated to fully enclose whatever size is configured; only the
// interior obstacles below are ever hand-placed/saved.
const BORDER_THICKNESS = 22;
const MAP_DEFAULTS = {
  width: CW, height: CH,
  playerStart: { x: CW/2, y: CH/2 },
  walls: [
    // Corner pillars
    {x:80,  y:80,  w:56, h:56},
    {x:664, y:80,  w:56, h:56},
    {x:80,  y:464, w:56, h:56},
    {x:664, y:464, w:56, h:56},
    // Centre block
    {x:364, y:264, w:72, h:72},
    // Crates mid-field
    {x:220, y:190, w:42, h:42},
    {x:538, y:190, w:42, h:42},
    {x:220, y:368, w:42, h:42},
    {x:538, y:368, w:42, h:42},
  ],
  roads: [],
  palmRemovals: [], // {cgx,cgy} cells where the auto-generated palm tree was manually deleted
  palmAdds: [],     // {x,y} manually placed palm trees, in addition to the auto-generated ones
};

function borderWalls(w, h) {
  const bt = BORDER_THICKNESS;
  return [
    {x:0,   y:0,   w:w,  h:bt},
    {x:0,   y:h-bt,w:w,  h:bt},
    {x:0,   y:0,   w:bt, h:h },
    {x:w-bt,y:0,   w:bt, h:h },
  ];
}

function loadMapConfig() {
  try {
    const raw = localStorage.getItem('mercs_map');
    if (raw === null) return MAP_DEFAULTS;
    const cfg = JSON.parse(raw);
    return {
      width:  Math.max(CW, cfg.width  || MAP_DEFAULTS.width),
      height: Math.max(CH, cfg.height || MAP_DEFAULTS.height),
      walls: Array.isArray(cfg.walls) ? cfg.walls : MAP_DEFAULTS.walls,
      roads: Array.isArray(cfg.roads) ? cfg.roads : MAP_DEFAULTS.roads,
      palmRemovals: Array.isArray(cfg.palmRemovals) ? cfg.palmRemovals : MAP_DEFAULTS.palmRemovals,
      palmAdds: Array.isArray(cfg.palmAdds) ? cfg.palmAdds : MAP_DEFAULTS.palmAdds,
      playerStart: cfg.playerStart || MAP_DEFAULTS.playerStart,
    };
  } catch(e) { return MAP_DEFAULTS; }
}

const MAP_CONFIG = loadMapConfig();
const MAP_W = MAP_CONFIG.width, MAP_H = MAP_CONFIG.height;

// Fixed quadrant spawn points for FFA — indexed by join order (each player's
// position within msg.players, the same server-authoritative array on every
// client), not anything map-editor-configured. Falls back to the shared
// coop spawn point for an out-of-range index (shouldn't happen since
// MAX_PLAYERS on the server is 4, matching these 4 corners exactly).
const FFA_SPAWN_MARGIN = 80;
function ffaSpawnPoint(index) {
  const pts = [
    { x: FFA_SPAWN_MARGIN, y: FFA_SPAWN_MARGIN },
    { x: MAP_W - FFA_SPAWN_MARGIN, y: FFA_SPAWN_MARGIN },
    { x: FFA_SPAWN_MARGIN, y: MAP_H - FFA_SPAWN_MARGIN },
    { x: MAP_W - FFA_SPAWN_MARGIN, y: MAP_H - FFA_SPAWN_MARGIN },
  ];
  return pts[index] || MAP_CONFIG.playerStart;
}

const WALLS = [...borderWalls(MAP_W, MAP_H), ...MAP_CONFIG.walls];
const ROADS = MAP_CONFIG.roads || [];
const PALM_REMOVALS = MAP_CONFIG.palmRemovals || [];
const PALM_ADDS = MAP_CONFIG.palmAdds || [];

const HS_KEY = 'mercs_highscore'; // personal best marker — stays local/per-device, not part of the shared leaderboard
// Both leaderboards are server-backed (GET/POST /api/leaderboard) so every
// player sees the same shared rankings, not just their own browser. 'sp' and
// 'mp' are separate boards — a summed multiplayer team score isn't
// comparable to a solo single-player score, so they don't share a list.
const LB_BOARD_SP = 'sp';
const LB_BOARD_MP = 'mp';
const LB_MAX  = 10;

// === SPRITE SYSTEM ===

// Programmatic draw functions — each receives (ctx, w, h) with transform already applied

function _playerSprite(dx, dy) {
  return function(ctx, w, h) {
    const cx = w/2, cy = h/2, hd = 4;
    ctx.fillStyle = '#2a6e2a';
    ctx.beginPath(); ctx.ellipse(cx,cy, w/2-2, h/2-2, 0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4ec94e';
    ctx.beginPath(); ctx.ellipse(cx,cy, w/2-5, h/2-5, 0,0,Math.PI*2); ctx.fill();
    const hx = cx + dx*hd, hy = cy + dy*hd;
    ctx.fillStyle = '#7ef07e';
    ctx.beginPath(); ctx.ellipse(hx, hy, 5, 4, Math.atan2(dy,dx), 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(hx+dx*4, hy+dy*4, 1.5, 0, Math.PI*2); ctx.fill();
  };
}
const _D = 0.7071;

const SPRITE_FNS = {
  PLAYER_E:  _playerSprite( 1,   0),
  PLAYER_SE: _playerSprite( _D,  _D),
  PLAYER_S:  _playerSprite( 0,   1),
  PLAYER_SW: _playerSprite(-_D,  _D),
  PLAYER_W:  _playerSprite(-1,   0),
  PLAYER_NW: _playerSprite(-_D, -_D),
  PLAYER_N:  _playerSprite( 0,  -1),
  PLAYER_NE: _playerSprite( _D, -_D),
  ENEMY_BASIC(ctx, w, h) {
    ctx.fillStyle = '#8a1818';
    ctx.fillRect(2,2,w-4,h-4);
    ctx.fillStyle = '#c04040';
    ctx.fillRect(4,4,w-8,h-8);
    // Eyes
    ctx.fillStyle = '#f0f040';
    ctx.fillRect(w/2-6,h/2-4,5,5);
    ctx.fillRect(w/2+1,h/2-4,5,5);
    // Mouth
    ctx.fillStyle = '#f04040';
    ctx.fillRect(w/2-5,h/2+3,10,3);
  },
  ENEMY_FAST(ctx, w, h) {
    ctx.fillStyle = '#a04010';
    ctx.beginPath(); ctx.moveTo(w/2,2); ctx.lineTo(w-2,h-2); ctx.lineTo(2,h-2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e07830';
    ctx.beginPath(); ctx.moveTo(w/2,6); ctx.lineTo(w-6,h-6); ctx.lineTo(6,h-6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(w/2-2,h/2,4,4);
  },
  ENEMY_BRUTE(ctx, w, h) {
    ctx.fillStyle = '#3a1060';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#7840c0';
    ctx.fillRect(3,3,w-6,h-6);
    ctx.fillStyle = '#c080ff';
    ctx.fillRect(6,6,w-12,h-12);
    // horns
    ctx.fillStyle = '#4a1880';
    ctx.fillRect(4,0,8,10); ctx.fillRect(w-12,0,8,10);
    // eyes
    ctx.fillStyle = '#ff4040';
    ctx.fillRect(w/2-7,h/2-4,6,6);
    ctx.fillRect(w/2+1,h/2-4,6,6);
  },
  WEAPON_PISTOL(ctx, w, h) {
    ctx.fillStyle = '#3a3848';
    ctx.fillRect(2,h/2-4,w-4,8);
    ctx.fillStyle = '#5a5870';
    ctx.fillRect(2,h/2-3,w-8,6);
    ctx.fillStyle = '#8a8898';
    ctx.fillRect(w-8,h/2-2,8,4);
  },
  WEAPON_KNIFE(ctx, w, h) {
    ctx.fillStyle = '#b0b8c8';
    ctx.beginPath();
    ctx.moveTo(w/2,4); ctx.lineTo(w/2+5,h*0.6); ctx.lineTo(w/2-5,h*0.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8eef8';
    ctx.beginPath();
    ctx.moveTo(w/2,6); ctx.lineTo(w/2+2,h*0.55); ctx.lineTo(w/2-1,h*0.55); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#786040';
    ctx.fillRect(w/2-8,h*0.6-2,16,5);
    ctx.fillStyle = '#5a3820';
    ctx.fillRect(w/2-4,h*0.6+3,8,h*0.3);
    ctx.fillStyle = '#3a2410';
    for (let i=0;i<3;i++) ctx.fillRect(w/2-4,h*0.6+5+i*6,8,2);
  },
  PICKUP_AMMO(ctx, w, h) {
    ctx.fillStyle = '#6a5018';
    ctx.fillRect(2,3,w-4,h-6);
    ctx.fillStyle = '#c8a840';
    ctx.fillRect(4,5,w-8,h-10);
    ctx.fillStyle = '#f0d060';
    ctx.fillRect(6,7,w-12,4);
  },
  PICKUP_HEALTH(ctx, w, h) {
    // Red cross on dark background
    ctx.fillStyle = '#3a0808';
    ctx.beginPath(); ctx.arc(w/2,h/2,w/2-1,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e03030';
    ctx.beginPath(); ctx.arc(w/2,h/2,w/2-3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f8f8f8';
    ctx.fillRect(w/2-2, 4, 4, h-8);
    ctx.fillRect(4, h/2-2, w-8, 4);
  },
  PICKUP_ARMOR(ctx, w, h) {
    // Shield outline
    ctx.fillStyle = '#0e3a4a';
    ctx.beginPath();
    ctx.moveTo(w/2, 1); ctx.lineTo(w-2, h*0.3); ctx.lineTo(w-2, h*0.6);
    ctx.quadraticCurveTo(w/2, h-1, w/2, h-1);
    ctx.quadraticCurveTo(2, h*0.6, 2, h*0.6);
    ctx.lineTo(2, h*0.3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#40c8f0';
    ctx.beginPath();
    ctx.moveTo(w/2, 4); ctx.lineTo(w-5, h*0.32); ctx.lineTo(w-5, h*0.58);
    ctx.quadraticCurveTo(w/2, h-4, w/2, h-4);
    ctx.quadraticCurveTo(5, h*0.58, 5, h*0.58);
    ctx.lineTo(5, h*0.32); ctx.closePath(); ctx.fill();
  },
  PICKUP_SPEED(ctx, w, h) {
    // Lightning bolt
    ctx.fillStyle = '#8a7000';
    ctx.beginPath();
    ctx.moveTo(w*0.55, 1); ctx.lineTo(w*0.2, h*0.55); ctx.lineTo(w*0.45, h*0.55);
    ctx.lineTo(w*0.4, h-1); ctx.lineTo(w*0.85, h*0.4); ctx.lineTo(w*0.55, h*0.4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f0e040';
    ctx.beginPath();
    ctx.moveTo(w*0.55, 4); ctx.lineTo(w*0.28, h*0.52); ctx.lineTo(w*0.5, h*0.52);
    ctx.lineTo(w*0.46, h-4); ctx.lineTo(w*0.76, h*0.44); ctx.lineTo(w*0.5, h*0.44);
    ctx.closePath(); ctx.fill();
  },
};

// === FACING & WEAPON SYSTEM ===

const FACING_DIRS = ['E','SE','S','SW','W','NW','N','NE'];
function getFacingDir(rawAngle) {
  const a = ((rawAngle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  return FACING_DIRS[Math.round(a / (Math.PI/4)) % 8];
}

const HAND_ANCHORS = {
  N:  { x:  5, y: -3 },
  NE: { x:  6, y: -2 },
  E:  { x:  6, y:  2 },
  SE: { x:  5, y:  5 },
  S:  { x: -4, y:  6 },
  SW: { x: -6, y:  4 },
  W:  { x: -6, y:  2 },
  NW: { x: -5, y: -2 },
};

const GUN_LENGTH = 14;
const GUN_W = 20, GUN_H = 7;

// Sprite registry — may be overridden by uploaded images
const SPRITES = {
  _images: {},
  _anims:  {},  // name → { frames:[], fps:12, frame:0, timer:0 }

  load() {
    const names = Object.keys(SPRITE_FNS); // includes PICKUP_HEALTH
    // Equipped weapons, and any weapon in the loot pool, may be a custom one
    // added in devtool (not in SPRITE_FNS) — still check for an uploaded
    // sprite so it renders correctly whether worn, found as a drop, or shown
    // in the HUD's equipped-weapons slot.
    if (!names.includes(EQUIPPED_RANGED.name)) names.push(EQUIPPED_RANGED.name);
    if (!names.includes(EQUIPPED_MELEE.name)) names.push(EQUIPPED_MELEE.name);
    lootPoolEntries().forEach(entry => { if (!names.includes(entry.name)) names.push(entry.name); });
    Object.keys(ENEMY_DEFS).forEach(name => { if (!names.includes(name)) names.push(name); });
    names.forEach(name => {
      const key = 'sprite_' + name;
      const framesKey = 'sprite_' + name + '_frames';
      const fpsKey    = 'sprite_' + name + '_fps';
      const framesRaw = localStorage.getItem(framesKey);
      if (framesRaw) {
        try {
          const urls = JSON.parse(framesRaw);
          const fps  = parseInt(localStorage.getItem(fpsKey) || '12');
          const frames = urls.map(url => { const img = new Image(); img.src = url; return img; });
          this._anims[name] = { frames, fps, frame:0, timer:0 };
          return;
        } catch(e) {}
      }
      const url = localStorage.getItem(key);
      if (url) {
        const img = new Image();
        img.src = url;
        this._images[name] = img;
      }
    });
  },

  updateAnims(dt) {
    for (const [name, anim] of Object.entries(this._anims)) {
      anim.timer += dt;
      if (anim.timer >= 1 / anim.fps) {
        anim.timer -= 1 / anim.fps;
        anim.frame = (anim.frame + 1) % anim.frames.length;
      }
    }
  },

  draw(name, ctx, cx, cy, w, h, angle, fallback) {
    ctx.save();
    ctx.translate(cx, cy);
    if (angle) ctx.rotate(angle);
    ctx.translate(-w/2, -h/2);

    const anim = this._anims[name];
    const img  = this._images[name];
    if (anim && anim.frames[anim.frame] && anim.frames[anim.frame].complete) {
      ctx.drawImage(anim.frames[anim.frame], 0, 0, w, h);
    } else if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, 0, 0, w, h);
    } else if (SPRITE_FNS[name]) {
      SPRITE_FNS[name](ctx, w, h);
    } else if (fallback && SPRITE_FNS[fallback]) {
      // Custom sprite (e.g. a devtool-added enemy) with no uploaded art yet —
      // draw the base category's default shape until one is uploaded.
      SPRITE_FNS[fallback](ctx, w, h);
    }
    ctx.restore();
  },
};

// Shared by SOUNDS and Music — one AudioContext for the whole page, since
// every filtered sound (SFX or music) needs to route through the same
// audio hardware output anyway.
let sharedAudioCtx = null;
function getAudioCtx() {
  if (!sharedAudioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    sharedAudioCtx = new Ctx();
  }
  if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume().catch(() => {});
  return sharedAudioCtx;
}

// Some browsers (Safari/iOS especially) auto-suspend an AudioContext after a
// period with no audible output — e.g. sitting on the post-match screen
// between rounds — and will only honor resume() when it's called
// synchronously inside a real user-gesture event handler, not merely
// "sometime after" one. The resume-on-suspended check inside getAudioCtx()
// above only ever runs from SOUNDS.play()/Music, which fire from the
// animation-frame loop rather than the gesture itself, so it doesn't count.
// Once suspended that way, it silently stays suspended for the rest of the
// page's life (every sound keeps "playing" — the <audio> elements are fine —
// but nothing audible comes out, since their output is routed entirely
// through this context's graph) until the page is reloaded. Resuming
// directly on the next real gesture fixes that without needing a reload.
['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
  window.addEventListener(evt, () => { if (sharedAudioCtx) sharedAudioCtx.resume().catch(() => {}); }, { passive: true });
});

// Hard cap on simultaneously-alive one-shot SFX voices, and a per-(name,kind)
// retrigger throttle — both are audio-quality guarantees (a wide splash
// hitting 20 enemies shouldn't layer 20 identical clips into distorted
// noise), not just cost mitigations, so both stay even now that each voice
// is a cheap pre-decoded AudioBufferSourceNode (see sfxBufferCache below)
// rather than a brand-new <audio> element + MediaElementSourceNode.
const MAX_CONCURRENT_SFX = 24;
const activeSfx = [];
const SFX_RETRIGGER_THROTTLE_MS = 50;
const lastPlayedAt = {};

// Retrigger mode — devtool.html toggle (mercs_sfx_retrigger_mode). 'throttle'
// (default) silently drops a same-(name,kind) retrigger within the throttle
// window above, so a burst never plays more than the first hit but some hits
// go unheard. 'cut' never drops a trigger — instead it stops whichever
// instance of that exact sound is already playing (at most one at a time)
// and starts the new one immediately, so every hit is audible at the cost of
// truncating the previous instance's tail. activeVoiceByKey only tracks
// voices while 'cut' mode is active (unused overhead otherwise).
function getSfxRetriggerMode() {
  return localStorage.getItem('mercs_sfx_retrigger_mode') === 'cut' ? 'cut' : 'throttle';
}
const activeVoiceByKey = new Map();

// Decoded-audio cache, keyed by sound URL. Sound files (unlike sprites,
// which are base64 data: URIs) are real remote URLs uploaded to server file
// storage (see devtool.html's upload flow) — decoding one into an
// AudioBuffer means an actual network fetch, not something instant. Caching
// the result (or the fact that it permanently failed) means that cost is
// paid AT MOST ONCE per distinct sound URL for the whole page session, no
// matter how many times it plays. Entry shapes:
//   { state: 'loading', promise }  — fetch+decode in flight
//   { state: 'ready',   buffer }   — decoded, ready to play instantly
//   { state: 'failed' }            — permanently gave up; never retried
const sfxBufferCache = new Map();

// Kicks off (if not already in flight) a fetch+decode for `url`. Callers
// don't await this — the very first SOUNDS.play() for a URL that isn't
// cached yet plays through the old <audio>-element fallback path
// immediately (see _playFallback) rather than waiting on this or dropping
// the trigger; every play AFTER this resolves gets the cheap
// AudioBufferSourceNode path. So the expensive path is paid at most once
// per URL per session, only for whichever play happens to race the very
// first decode.
function ensureSfxBufferLoading(url) {
  if (sfxBufferCache.has(url)) return;
  const ctx = getAudioCtx();
  const promise = fetch(url)
    .then(res => { if (!res.ok) throw new Error('sfx fetch failed: ' + res.status); return res.arrayBuffer(); })
    .then(data => ctx.decodeAudioData(data))
    .then(buffer => { sfxBufferCache.set(url, { state: 'ready', buffer }); return buffer; })
    .catch(() => {
      // Network/CORS failure or unsupported format — cache the failure so
      // every future play() for this URL goes straight to the fallback path
      // instead of re-fetching (and re-failing) on every single call, which
      // for a sound triggered every frame (e.g. contact damage) would
      // otherwise be a new CPU/network-burst hazard of its own.
      sfxBufferCache.set(url, { state: 'failed' });
    });
  sfxBufferCache.set(url, { state: 'loading', promise });
}

// Persistent SFX bus — every one-shot voice (buffer path AND fallback path)
// routes through this single GainNode instead of straight to
// ctx.destination, so changing the SFX Volume setting live-updates every
// currently-playing sound for free, the same way a real mixer's master
// fader would, not just sounds triggered after the change. Created lazily
// (first real play/gesture) for the same reason getAudioCtx() is lazy.
let sfxBusGain = null;
function getSfxBusGain() {
  if (!sfxBusGain) {
    sfxBusGain = getAudioCtx().createGain();
    sfxBusGain.gain.value = getSfxVolume() / 100;
    sfxBusGain.connect(getAudioCtx().destination);
  }
  return sfxBusGain;
}

// Sound effects for the character (damage-taken/death), each enemy
// (attack/damage/death), and each weapon (attack — swapping weapons via a
// pickup mid-match changes which sound plays, so this reads localStorage
// fresh on every call instead of caching names at boot like SPRITES does.
// Each channel also carries the same Start Time / High-Pass / Low-Pass
// knobs the music tracks have, set in devtool.html's mixer.
const SOUNDS = {
  play(name, kind) {
    const url = localStorage.getItem('sound_' + name + '_' + kind);
    if (!url) return;

    const throttleKey = name + '_' + kind;
    const mode = getSfxRetriggerMode();
    if (mode === 'cut') {
      const existing = activeVoiceByKey.get(throttleKey);
      if (existing) existing.stop();
    } else {
      const now = Date.now();
      if (lastPlayedAt[throttleKey] !== undefined && now - lastPlayedAt[throttleKey] < SFX_RETRIGGER_THROTTLE_MS) return;
      lastPlayedAt[throttleKey] = now;
    }

    if (activeSfx.length >= MAX_CONCURRENT_SFX) activeSfx.shift().stop();

    // Bus fader (player's personal SFX Volume, applied via the shared
    // sfxBusGain node) × channel fader (this specific sound's own volume,
    // set in devtool.html's mixer) — same gain-staging as a real mixer.
    const chVol = parseInt(localStorage.getItem('sound_' + name + '_' + kind + '_vol'));
    const channelVolume = Number.isFinite(chVol) ? chVol : 100;
    const hp = parseInt(localStorage.getItem('sound_' + name + '_' + kind + '_hp'));
    const lp = parseInt(localStorage.getItem('sound_' + name + '_' + kind + '_lp'));
    const startTime = parseFloat(localStorage.getItem('sound_' + name + '_' + kind + '_start'));
    const trimStart = Number.isFinite(startTime) && startTime > 0 ? startTime : 0;

    const cached = sfxBufferCache.get(url);
    if (!cached) {
      // First time this URL has ever been requested this session — start
      // decoding it for next time, and play THIS call through the fallback
      // path so it's still heard immediately rather than dropped or delayed.
      ensureSfxBufferLoading(url);
      this._playFallback(url, channelVolume, hp, lp, trimStart, throttleKey);
      return;
    }
    if (cached.state !== 'ready') {
      // Still decoding, or permanently failed — either way, no buffer to
      // play yet (or ever), use the fallback path.
      this._playFallback(url, channelVolume, hp, lp, trimStart, throttleKey);
      return;
    }
    this._playBuffer(cached.buffer, channelVolume, hp, lp, trimStart, throttleKey);
  },

  // Cheap path: a pre-decoded AudioBuffer through
  // source -> highpass -> lowpass -> per-play channel gain -> shared SFX bus.
  _playBuffer(buffer, channelVolume, hp, lp, trimStart, throttleKey) {
    const ctx = getAudioCtx();
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const hpNode = ctx.createBiquadFilter();
    hpNode.type = 'highpass';
    hpNode.frequency.value = Number.isFinite(hp) ? hp : 20;
    const lpNode = ctx.createBiquadFilter();
    lpNode.type = 'lowpass';
    lpNode.frequency.value = Number.isFinite(lp) ? lp : 20000;
    const gainNode = ctx.createGain();
    gainNode.gain.value = channelVolume / 100;
    source.connect(hpNode); hpNode.connect(lpNode); lpNode.connect(gainNode); gainNode.connect(getSfxBusGain());

    const voice = { stop: () => {} };
    const cleanup = () => {
      try { source.disconnect(); } catch(e) {}
      try { hpNode.disconnect(); } catch(e) {}
      try { lpNode.disconnect(); } catch(e) {}
      try { gainNode.disconnect(); } catch(e) {}
      const idx = activeSfx.indexOf(voice);
      if (idx !== -1) activeSfx.splice(idx, 1);
      if (activeVoiceByKey.get(throttleKey) === voice) activeVoiceByKey.delete(throttleKey);
    };
    voice.stop = () => { try { source.stop(); } catch(e) {} }; // triggers 'ended' below, which runs cleanup
    activeSfx.push(voice);
    activeVoiceByKey.set(throttleKey, voice); // harmless in 'throttle' mode — only ever read in 'cut' mode

    source.addEventListener('ended', cleanup);
    // AudioBufferSourceNode.start(when, offset) takes the Start Time trim
    // natively — no loadedmetadata race to work around like the <audio>
    // element path needs, since the buffer is already fully decoded before
    // this runs.
    try { source.start(ctx.currentTime, trimStart); } catch(e) { cleanup(); }
  },

  // Expensive-but-safe path: identical in shape to the original
  // implementation, used for a URL's very first play this session (still
  // decoding), a permanently-failed decode, or Web Audio being unavailable.
  // Still routes into the shared SFX bus (not straight to destination) so
  // live bus-volume changes reach these voices too; only channel volume is
  // applied via a.volume here, since bus volume is now applied once by
  // sfxBusGain itself — applying it a second time here would double it up.
  _playFallback(url, channelVolume, hp, lp, trimStart, throttleKey) {
    // crossOrigin must be set BEFORE src — the audio file can live on a
    // different host than this page, and setting it after the constructor
    // has already assigned src (via `new Audio(url)`) is unreliable: the
    // browser may have already started a non-CORS fetch, which
    // createMediaElementSource() then silently mutes instead of erroring.
    const a = new Audio();
    a.crossOrigin = 'anonymous';
    a.src = url;
    a.volume = channelVolume / 100;

    if (trimStart > 0) {
      a.currentTime = trimStart;
      a.addEventListener('loadedmetadata', () => { a.currentTime = trimStart; });
    }

    // One-shot playback, but the filter chain still needs explicit teardown:
    // nodes connected into a Web Audio graph are kept alive by the
    // AudioContext's own internal graph, not by JS references — letting `a`
    // go out of scope does NOT free them.
    let source = null, hpNode = null, lpNode = null;
    try {
      const ctx = getAudioCtx();
      source = ctx.createMediaElementSource(a);
      hpNode = ctx.createBiquadFilter();
      hpNode.type = 'highpass';
      hpNode.frequency.value = Number.isFinite(hp) ? hp : 20;
      lpNode = ctx.createBiquadFilter();
      lpNode.type = 'lowpass';
      lpNode.frequency.value = Number.isFinite(lp) ? lp : 20000;
      source.connect(hpNode); hpNode.connect(lpNode); lpNode.connect(getSfxBusGain());
    } catch(e) {
      // Web Audio unavailable/blocked — fall back further, to plain
      // <audio> playback with no filters/bus routing at all.
    }

    const voice = { stop: () => {} };
    const cleanup = () => {
      try { a.pause(); } catch(e) {} // no-op if it already finished naturally
      try { if (source) source.disconnect(); } catch(e) {}
      try { if (hpNode) hpNode.disconnect(); } catch(e) {}
      try { if (lpNode) lpNode.disconnect(); } catch(e) {}
      const idx = activeSfx.indexOf(voice);
      if (idx !== -1) activeSfx.splice(idx, 1);
      if (activeVoiceByKey.get(throttleKey) === voice) activeVoiceByKey.delete(throttleKey);
    };
    voice.stop = cleanup;
    activeSfx.push(voice);
    activeVoiceByKey.set(throttleKey, voice); // harmless in 'throttle' mode — only ever read in 'cut' mode

    a.addEventListener('ended', cleanup);
    a.addEventListener('error', cleanup);

    a.play().catch(() => {}); // ignore — autoplay can be blocked before the first user gesture
  },
};

// Between-match cleanup, called from resetPlayerForMatch(): stops any
// voices left over from the previous match (e.g. a death sound still
// finishing as the timer expired) and clears the retrigger throttle so the
// new match's first sounds aren't spuriously dropped by a stale timestamp
// from before the reset. Deliberately does NOT touch sfxBufferCache or
// sfxBusGain — the decoded-buffer cache is a page-session-lifetime
// optimization, not per-match state, and clearing it here would force every
// sound to re-fetch/decode (or fall back) on the next match's first play,
// reintroducing the exact cost this design exists to avoid; the bus gain is
// a user volume preference, not match state.
function resetSfxEngine() {
  while (activeSfx.length) activeSfx.shift().stop();
  for (const k in lastPlayedAt) delete lastPlayedAt[k];
  activeVoiceByKey.clear(); // stopping every voice above already does this transitively; explicit for safety
}

// Maps a pickup object's `kind` ('health'/'ammo'/'weapon') to the sound-slot
// name devtool.html uses for it.
function pickupSoundName(kind) {
  if (kind === 'health') return 'PICKUP_HEALTH';
  if (kind === 'ammo')   return 'PICKUP_AMMO';
  if (kind === 'weapon') return 'PICKUP_WEAPON';
  if (kind === 'armor')  return 'PICKUP_ARMOR';
  if (kind === 'speed')  return 'PICKUP_SPEED';
  return null;
}

// Personal volume preferences (Settings screen) — local-only, like any other
// per-device game setting, not part of the devtool-published config.
function getMusicVolume() {
  const v = parseInt(localStorage.getItem('mercs_music_volume'));
  return Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 70;
}
function setMusicVolume(v) {
  v = Math.max(0, Math.min(100, v));
  localStorage.setItem('mercs_music_volume', v);
  if (Music.current) {
    const trackVolume = Number.isFinite(Music.currentTrackVolume) ? Music.currentTrackVolume : 100;
    Music.current.volume = (v / 100) * (trackVolume / 100);
  }
}
function getSfxVolume() {
  const v = parseInt(localStorage.getItem('mercs_sfx_volume'));
  return Number.isFinite(v) ? Math.max(0, Math.min(100, v)) : 70;
}
function setSfxVolume(v) {
  v = Math.max(0, Math.min(100, v));
  localStorage.setItem('mercs_sfx_volume', v);
  if (sfxBusGain) sfxBusGain.gain.value = v / 100; // live-update already-playing SFX, not just future ones
}

// Shuffled background music from the devtool-published soundtrack, split
// into a 'menu' playlist (plays outside a match) and a 'gameplay' playlist
// (plays during one). Starts on the first user interaction (browsers block
// audio autoplay before that); update() is polled once/frame from the main
// loop and swaps playlists the moment STATE crosses the menu/gameplay line.
const Music = {
  menuTracks: [],
  gameplayTracks: [],
  menuQueue: [],
  gameplayQueue: [],
  current: null,
  currentSource: null,   // MediaElementAudioSourceNode for `current`
  currentFilters: null,  // { highpass, lowpass } BiquadFilterNodes for `current`
  currentTrackVolume: 100, // the currently-playing track's own mixer channel volume
  currentMode: null, // 'menu' | 'gameplay' | null (not started yet)
  started: false,

  load() {
    try { this.menuTracks = JSON.parse(localStorage.getItem('mercs_soundtrack_menu') || '[]'); } catch(e) { this.menuTracks = []; }
    try { this.gameplayTracks = JSON.parse(localStorage.getItem('mercs_soundtrack_gameplay') || '[]'); } catch(e) { this.gameplayTracks = []; }
  },

  start() {
    if (this.started) return;
    this.started = true;
    this._switchTo(this._modeForState());
  },

  update() {
    if (!this.started) return;
    const desired = this._modeForState();
    if (desired !== this.currentMode) this._switchTo(desired);
  },

  _modeForState() {
    return (STATE === 'playing' || STATE === 'mpPlaying') ? 'gameplay' : 'menu';
  },

  _tracksFor(mode) { return mode === 'gameplay' ? this.gameplayTracks : this.menuTracks; },
  _queueFor(mode)  { return mode === 'gameplay' ? this.gameplayQueue  : this.menuQueue; },
  _setQueueFor(mode, q) { if (mode === 'gameplay') this.gameplayQueue = q; else this.menuQueue = q; },

  _stopCurrent() {
    if (!this.current) return;
    this.current.onended = null;
    this.current.pause();
    // Web Audio nodes aren't garbage-collected until disconnected — each
    // track gets a fresh source/filter chain, so tear the old one down.
    try { if (this.currentSource) this.currentSource.disconnect(); } catch(e) {}
    try { if (this.currentFilters) { this.currentFilters.highpass.disconnect(); this.currentFilters.lowpass.disconnect(); } } catch(e) {}
    this.current = null; this.currentSource = null; this.currentFilters = null;
  },

  _switchTo(mode) {
    this.currentMode = mode;
    this._stopCurrent();
    if (this._tracksFor(mode).length === 0) return; // nothing to play for this mode
    this._playNext(mode);
  },

  _playNext(mode) {
    let queue = this._queueFor(mode);
    if (queue.length === 0) {
      queue = this._tracksFor(mode).slice().sort(() => Math.random() - 0.5);
      this._setQueueFor(mode, queue);
    }
    const track = queue.shift();
    if (!track) return;
    this._stopCurrent();

    // Bus fader (player's personal Music Volume) × channel fader (this
    // track's own volume, set in devtool.html's mixer).
    const trackVolume = Number.isFinite(track.volume) ? track.volume : 100;
    this.currentTrackVolume = trackVolume;
    // crossOrigin must be set BEFORE src (see SOUNDS.play()'s comment).
    const audio = new Audio();
    audio.crossOrigin = 'anonymous';
    audio.src = track.url;
    audio.volume = (getMusicVolume() / 100) * (trackVolume / 100);

    // Trim silence/intro — devtool.html's Start Time knob.
    const startTime = Number.isFinite(track.startTime) ? track.startTime : 0;
    if (startTime > 0) {
      audio.currentTime = startTime;
      audio.addEventListener('loadedmetadata', () => { audio.currentTime = startTime; });
    }

    audio.onended = () => { if (this.currentMode === mode) this._playNext(mode); };

    // Route through a highpass -> lowpass filter chain (devtool.html's
    // High-Pass/Low-Pass knobs) — this fully replaces the element's direct
    // output, so the chain always exists even at default (no-op) cutoffs,
    // otherwise the track would be silent.
    try {
      const ctx = getAudioCtx();
      const source = ctx.createMediaElementSource(audio);
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = Number.isFinite(track.highpass) ? track.highpass : 20;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = Number.isFinite(track.lowpass) ? track.lowpass : 20000;
      source.connect(hp); hp.connect(lp); lp.connect(ctx.destination);
      this.currentSource = source;
      this.currentFilters = { highpass: hp, lowpass: lp };
    } catch(e) {
      // Web Audio unavailable/blocked — fall back to plain <audio> playback.
    }

    audio.play().catch(() => {});
    this.current = audio;
  },
};

// === INPUT ===

const keys = new Set();
const mouse = { x: CW/2, y: CH/2, worldX: CW/2, worldY: CH/2, leftDown: false, rightDown: false };
let shootQueued = false;
let meleeQueued = false;
let reloadQueued = false;

window.addEventListener('keydown', e => {
  keys.add(e.key.toLowerCase());
  if (e.key === ' ') { e.preventDefault(); shootQueued = true; }
  if (e.key.toLowerCase() === 'f') meleeQueued = true;
  if (e.key.toLowerCase() === 'r') reloadQueued = true;
  if (e.key.toLowerCase() === 'b' && STATE === 'mpPlaying' && mpMode === 'ffa' && !mpDowned) {
    mpLoadoutOverlayOpen = !mpLoadoutOverlayOpen;
  }
  if (e.key === 'Tab' && STATE === 'mpPlaying') { e.preventDefault(); mpScoreboardHeld = true; }
});
window.addEventListener('keyup', e => {
  keys.delete(e.key.toLowerCase());
  if (e.key === 'Tab') mpScoreboardHeld = false;
});

const canvas = document.getElementById('game-canvas');
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (CW / r.width);
  mouse.y = (e.clientY - r.top)  * (CH / r.height);
  mouse.worldX = mouse.x + camera.x;
  mouse.worldY = mouse.y + camera.y;
});
canvas.addEventListener('mousedown', e => {
  // Gated so a click on a menu button (Start, a lobby row, etc.) can't leave a
  // stale shootQueued/meleeQueued armed for the first frame of the next match.
  if (STATE === 'playing' || STATE === 'mpPlaying') {
    if (e.button === 0) { shootQueued = true; mouse.leftDown = true; }
    if (e.button === 2) { meleeQueued = true; mouse.rightDown = true; }
  }
  e.preventDefault();
});
canvas.addEventListener('mouseup', e => {
  if (e.button === 0) mouse.leftDown = false;
  if (e.button === 2) mouse.rightDown = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// === COLLISION ===

function rectsOverlap(ax,ay,aw,ah, bx,by,bw,bh) {
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function resolveWalls(cx, cy, size) {
  const half = size / 2;
  let nx = cx, ny = cy;
  for (const w of WALLS) {
    const ox1 = nx - half, oy1 = ny - half;
    if (!rectsOverlap(ox1,oy1,size,size, w.x,w.y,w.w,w.h)) continue;
    const overX = Math.min(ox1+size - w.x, w.x+w.w - ox1);
    const overY = Math.min(oy1+size - w.y, w.y+w.h - oy1);
    if (overX < overY) nx += (nx < w.x + w.w/2) ? -overX : overX;
    else               ny += (ny < w.y + w.h/2)  ? -overY : overY;
  }
  return { nx, ny };
}

function pointInWall(px, py) {
  return WALLS.some(w => px>=w.x && px<=w.x+w.w && py>=w.y && py<=w.y+w.h);
}

// === GAME STATE ===

// 'start' | 'playing' | 'dead' | 'enterInitials' | 'leaderboard' | 'settings' |
// 'controls' | 'mpConnect' | 'mpName' | 'mpBrowse' | 'mpLobby' | 'mpLoadout' |
// 'mpPlaying' | 'mpEnded' | 'mpEnterInitials' | 'mpLeaderboard'

// === LEADERBOARD ===

let pendingScore    = 0;
let pendingCombo    = 0;
let pendingKills    = 0;
let pendingDuration = 0;
let initials        = ['A','A','A'];
let initialsCursor  = 0;
let leaderboardEntries = [];
let mpLeaderboardEntries = []; // separate cached list for the multiplayer team leaderboard
let leaderboardLoading = false;   // true while a fresh GET is in flight, for the "LOADING..." row
let mpLeaderboardLoading = false;
let justSavedIndex  = -1;
let mpLbMsg = '';    // transient status text on the MATCH OVER screen (e.g. "doesn't qualify")
let mpLbMsgUntil = 0;

// Server is authoritative; on any network failure just show an empty board
// rather than blocking the screen — same fallback style as the devtool
// config bootstrap at the top of this file.
async function loadLeaderboard(board = LB_BOARD_SP) {
  try {
    const r = await fetch(API_BASE + '/api/leaderboard?board=' + board);
    const d = await r.json();
    return (d && d.entries) || [];
  } catch(e) { return []; }
}

async function qualifiesForLeaderboard(s, board = LB_BOARD_SP) {
  if (s <= 0) return false;
  const lb = await loadLeaderboard(board);
  return lb.length < LB_MAX || s > lb[lb.length - 1].score;
}

// combo/kills/duration are only actually trusted server-side for board 'mp'
// (pulled from the match record the server itself computed) — for 'sp' they're
// stored as-sent, same bounds-checked-only trust level the score already has.
async function addLeaderboardEntry(name, s, board = LB_BOARD_SP, matchId = null, combo = 0, kills = 0, duration = 0) {
  let ok = true;
  try {
    const r = await fetch(API_BASE + '/api/leaderboard', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ board, initials: name, score: s, matchId, combo, kills, duration }),
    });
    ok = r.ok;
  } catch(e) { ok = false; }
  const entries = await loadLeaderboard(board); // refetch so the list reflects this entry's rank
  return { ok, entries };
}

function cycleLetter(cur, dir) {
  const base = 'A'.charCodeAt(0);
  const idx = ((cur.charCodeAt(0) - base) + dir + 26) % 26;
  return String.fromCharCode(base + idx);
}

function handleInitialsKey(e) {
  const isMp = STATE === 'mpEnterInitials';
  const k = e.key;
  if (/^[a-zA-Z]$/.test(k)) {
    initials[initialsCursor] = k.toUpperCase();
    initialsCursor = Math.min(2, initialsCursor + 1);
    e.preventDefault();
  } else if (k === 'ArrowUp') {
    initials[initialsCursor] = cycleLetter(initials[initialsCursor], 1);
    e.preventDefault();
  } else if (k === 'ArrowDown') {
    initials[initialsCursor] = cycleLetter(initials[initialsCursor], -1);
    e.preventDefault();
  } else if (k === 'ArrowLeft') {
    initialsCursor = Math.max(0, initialsCursor - 1);
    e.preventDefault();
  } else if (k === 'ArrowRight') {
    initialsCursor = Math.min(2, initialsCursor + 1);
    e.preventDefault();
  } else if (k === 'Backspace') {
    initialsCursor = Math.max(0, initialsCursor - 1);
    e.preventDefault();
  } else if (k === 'Enter') {
    const name = initials.join('');
    justSavedIndex = -1;
    if (isMp) {
      STATE = 'mpLeaderboard';
      mpLeaderboardEntries = [];
      mpLeaderboardLoading = true;
      addLeaderboardEntry(name, pendingScore, LB_BOARD_MP, mpMatchId, pendingCombo, pendingKills, pendingDuration).then(({ ok, entries }) => {
        mpLeaderboardEntries = entries;
        mpLeaderboardLoading = false;
        if (ok) {
          justSavedIndex = entries.findIndex(en => en.initials === name && en.score === pendingScore);
        } else {
          // Server couldn't verify this against a real match result (token
          // expired, already used, etc.) — back to MATCH OVER with an
          // explanation instead of a leaderboard screen with no new entry.
          STATE = 'mpEnded';
          mpLbMsg = 'Could not verify this run — it may have already been saved, or too much time passed.';
          mpLbMsgUntil = Date.now() + 4000;
        }
      });
    } else {
      STATE = 'leaderboard';
      leaderboardEntries = [];
      leaderboardLoading = true;
      addLeaderboardEntry(name, pendingScore, LB_BOARD_SP, null, pendingCombo, pendingKills, pendingDuration).then(({ entries }) => {
        leaderboardEntries = entries;
        leaderboardLoading = false;
        justSavedIndex = entries.findIndex(en => en.initials === name && en.score === pendingScore);
      });
    }
    e.preventDefault();
  } else if (k === 'Escape') {
    STATE = isMp ? 'mpEnded' : 'dead';
    e.preventDefault();
  }
}

// === DESERT STORM THEME (procedural — no assets, no persisted data) ===
//
// Every visual decision below (building type, war-torn or not, sand speckle
// placement, palm tree placement) is a pure function of data that already
// exists (a wall's own x/y/w/h, or tile/cell grid coords) — never persisted,
// never Math.random() (which would flicker every frame since drawMap runs
// every frame). Mirrors map-editor.html's copy of this same theme code —
// this page is standalone (no shared JS module system in this project), so
// it's duplicated.

// Cheap deterministic 32-bit hash of up to 4 ints + a salt — not
// cryptographic, just stable across frames/reloads and well-distributed
// across a handful of buckets. Math.imul avoids float-rounding loss on the
// ~2^31-scale intermediate product, which would otherwise degrade
// distribution. Salt convention: 0=building type, 1=war-torn boolean,
// 2=damage/detail variant, 3=sand speckle (keyed on tile gx,gy), 4=palm
// spawn/position (keyed on cell cgx,cgy), 6=road dirt/pebble speckle (keyed
// on road start + step index), 7=manual palm tree sway variant (keyed on its
// x,y), 10+i=per-unit offset for repeated details (e.g. city HVAC blocks).
function mercsHash(a, b, c, d, salt) {
  let n = (a|0) * 374761393 + (b|0) * 668265263 + (c|0) * 2147483647 + (d|0) * 1274126177 + (salt|0) * 3266489917;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  n = (n ^ (n >>> 16)) >>> 0;
  return n;
}

const BUILDING_TYPES = ['hospital', 'apartment', 'city'];
const WARTORN_CHANCE_PCT = 25;

// A wall's `theme`/`wartorn` fields (set via map-editor.html's per-wall theme
// picker) override the deterministic auto-pick below when present and not
// 'auto'. Walls without these fields (old saved maps, randomly generated
// ones) fall through to the same hash-based look as before — zero migration.
function getWallVisual(w) {
  const autoType = BUILDING_TYPES[mercsHash(w.x, w.y, w.w, w.h, 0) % 3];
  const autoWartorn = mercsHash(w.x, w.y, w.w, w.h, 1) % 100 < WARTORN_CHANCE_PCT;
  return {
    type: (w.theme && w.theme !== 'auto') ? w.theme : autoType,
    wartorn: (w.wartorn === 'yes') ? true : (w.wartorn === 'no') ? false : autoWartorn,
    variant: mercsHash(w.x, w.y, w.w, w.h, 2),
  };
}

// Geometric check, independent of array position/order — matches
// borderWalls()'s own output shape (top/bottom: {w:mapW,h:bt}, left/right: {w:bt,h:mapH}).
function isBorderWall(w, mapW, mapH) {
  return (w.w === mapW && w.h === BORDER_THICKNESS) ||
         (w.h === mapH && w.w === BORDER_THICKNESS);
}

const SAND_BASE  = '#c9a86a';
const SAND_LIGHT = '#dabf8c';
const SAND_DARK  = '#a9895c';
const SAND_PATCH = '#b89a5f';
const SAND_GRID  = 'rgba(90,63,32,0.12)';

const BORDER_FILL = '#4a4638', BORDER_DARK = '#3a3730', BORDER_LIGHT = '#5c5848';
const BORDER_SEG = 18; // sandbag/barrier segment spacing along the long axis

function drawBorderWall(ctx, w, vx0, vx1, vy0, vy1) {
  ctx.fillStyle = BORDER_FILL;
  ctx.fillRect(w.x, w.y, w.w, w.h);
  const horizontal = w.w >= w.h; // top/bottom strips are wide+thin, left/right are tall+thin
  const len = horizontal ? w.w : w.h;
  // Clip the segment range to the visible viewport — unlike the old 3-fill
  // draw (cheap regardless of length), this loop's cost scales with wall
  // length, and border walls span the entire map edge (up to ~4000px, the
  // map editor's clamp). WALLS itself isn't culled today, so without this
  // clip a large map would draw ~220 segments/wall every frame even off-screen.
  const loStart = horizontal ? Math.max(0, vx0 - w.x) : Math.max(0, vy0 - w.y);
  const loEnd   = horizontal ? Math.min(len, vx1 - w.x) : Math.min(len, vy1 - w.y);
  const start = Math.max(2, Math.floor(loStart / BORDER_SEG) * BORDER_SEG);
  for (let o = start; o < Math.min(len - 2, loEnd); o += BORDER_SEG) {
    const segLen = Math.min(BORDER_SEG - 4, len - 2 - o);
    if (segLen <= 0) continue;
    const sx = horizontal ? w.x + o : w.x + 2;
    const sy = horizontal ? w.y + 2 : w.y + o;
    const sw = horizontal ? segLen : w.w - 4;
    const sh = horizontal ? w.h - 4 : segLen;
    ctx.fillStyle = BORDER_DARK; ctx.fillRect(sx, sy, sw, sh);
    ctx.fillStyle = BORDER_LIGHT; ctx.fillRect(sx, sy, sw, horizontal ? 1 : Math.min(1, sh));
  }
}

const BUILDING_PALETTE = {
  hospital:  { outer:'#9a9688', inset:'#d8d4c8', ledge:'#c4c0b0' },
  apartment: { outer:'#8a7048', inset:'#b89a6e', ledge:'#a4885e' },
  city:      { outer:'#2c303c', inset:'#4e5568', ledge:'#3d4354' },
};

function drawRoofBase(ctx, w, pal) {
  ctx.fillStyle = pal.outer;
  ctx.fillRect(w.x, w.y, w.w, w.h);
  ctx.fillStyle = pal.inset;
  ctx.fillRect(w.x+2, w.y+2, Math.max(0,w.w-4), Math.max(0,w.h-4));
  ctx.fillStyle = pal.ledge;
  ctx.fillRect(w.x+2, w.y+2, Math.max(0,w.w-4), 2);
  ctx.fillRect(w.x+2, w.y+2, 2, Math.max(0,w.h-4));
}

// Red cross by default; helipad ring+"H" on larger roofs when variant picks it.
function drawHospitalDetail(ctx, w, variant) {
  const cx = w.x + w.w/2, cy = w.y + w.h/2;
  const big = w.w >= 40 && w.h >= 40;
  if (big && variant % 2 === 0) {
    ctx.strokeStyle = '#6a6858'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, Math.min(w.w,w.h)*0.32, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#f0ede0';
    ctx.fillRect(cx-2, cy-7, 4, 14); // "H" left/right bars + crossbar
    ctx.fillRect(cx-7, cy-2, 6, 4);
    ctx.fillRect(cx+1, cy-2, 6, 4);
  } else {
    const s = Math.min(w.w, w.h) * 0.35;
    ctx.fillStyle = '#b8262f';
    ctx.fillRect(cx - s*0.18, cy - s*0.5, s*0.36, s);
    ctx.fillRect(cx - s*0.5, cy - s*0.18, s, s*0.36);
  }
}

// Grid of small AC/vent squares — column/row count adapts to size so it
// never overcrowds a small wall.
function drawApartmentDetail(ctx, w) {
  const cols = Math.max(1, Math.min(3, Math.floor((w.w-8)/14)));
  const rows = Math.max(1, Math.min(3, Math.floor((w.h-8)/14)));
  const stepX = (w.w-8)/cols, stepY = (w.h-8)/rows;
  for (let r=0; r<rows; r++) for (let c=0; c<cols; c++) {
    const vx = w.x+6+c*stepX, vy = w.y+6+r*stepY;
    ctx.fillStyle = '#6e5a3c';
    ctx.fillRect(vx, vy, 5, 5);
    ctx.fillStyle = '#c8ac7c';
    ctx.fillRect(vx, vy, 5, 1);
  }
}

// 1-2 larger HVAC blocks at a deterministic offset from variant.
function drawCityDetail(ctx, w, variant) {
  const uw = Math.min(w.w*0.4, 14), uh = Math.min(w.h*0.4, 14);
  const n = w.w > 30 && w.h > 30 ? 2 : 1;
  for (let i=0; i<n; i++) {
    const hv = mercsHash(w.x, w.y, w.w, w.h, 10+i);
    const ux = w.x + 4 + (hv % Math.max(1, w.w - uw - 8));
    const uy = w.y + 4 + ((hv>>>8) % Math.max(1, w.h - uh - 8));
    ctx.fillStyle = '#5c6478';
    ctx.fillRect(ux, uy, uw, uh);
    ctx.strokeStyle = '#2c303c'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ux+2, uy+uh*0.33); ctx.lineTo(ux+uw-2, uy+uh*0.33);
    ctx.moveTo(ux+2, uy+uh*0.66); ctx.lineTo(ux+uw-2, uy+uh*0.66);
    ctx.stroke();
  }
}

// Applied after the type detail, on top: cracks, a missing rubble corner,
// and (on roughly half of war-torn walls) a soft scorch-mark gradient.
function drawWartornOverlay(ctx, w, variant) {
  const corner = variant % 4;
  const cx = w.x + w.w/2, cy = w.y + w.h/2;
  const corners = [ [w.x,w.y], [w.x+w.w,w.y], [w.x,w.y+w.h], [w.x+w.w,w.y+w.h] ];
  const ox = corners[corner][0], oy = corners[corner][1];
  ctx.strokeStyle = 'rgba(20,15,10,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ox, oy);
  const midx = ox + (cx-ox)*0.4 + ((variant>>>4)%7-3);
  const midy = oy + (cy-oy)*0.4 + ((variant>>>8)%7-3);
  ctx.lineTo(midx, midy);
  ctx.lineTo(ox + (cx-ox)*0.7, oy + (cy-oy)*0.7);
  ctx.stroke();

  ctx.fillStyle = 'rgba(26,23,18,0.7)';
  const rr = Math.min(w.w, w.h) * 0.22;
  ctx.beginPath(); ctx.arc(ox, oy, rr, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ox + (cx>ox?rr*0.6:-rr*0.6), oy, rr*0.6, 0, Math.PI*2); ctx.fill();

  if (variant & 0x20) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w.w,w.h)*0.5);
    g.addColorStop(0, 'rgba(10,8,6,0.45)');
    g.addColorStop(1, 'rgba(10,8,6,0)');
    ctx.fillStyle = g;
    ctx.fillRect(w.x, w.y, w.w, w.h);
  }
}

function drawBuildingWall(ctx, w, mapW, mapH, vx0, vx1, vy0, vy1) {
  if (isBorderWall(w, mapW, mapH)) { drawBorderWall(ctx, w, vx0, vx1, vy0, vy1); return; }
  const vis = getWallVisual(w);
  const pal = BUILDING_PALETTE[vis.type];
  drawRoofBase(ctx, w, pal);
  if (vis.type === 'hospital')  drawHospitalDetail(ctx, w, vis.variant);
  if (vis.type === 'apartment') drawApartmentDetail(ctx, w);
  if (vis.type === 'city')      drawCityDetail(ctx, w, vis.variant);
  if (vis.wartorn) drawWartornOverlay(ctx, w, vis.variant);
}

// Roads: straight, hand-drawn segments (map-editor.html's road tool), purely
// decorative — never added to WALLS/collision, just painted onto the sand as
// a beaten dirt track (no asphalt/lane-marking look).
const ROAD_WIDTH = 40;
const ROAD_EDGE = '#5c4326', ROAD_FILL = '#8a6a42', ROAD_RUT = '#6e5233';
const ROAD_LIGHT = '#a4835a', ROAD_DARK = '#6f5535';

function pointSegDist(px, py, x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq > 0 ? ((px-x1)*dx + (py-y1)*dy) / lenSq : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.hypot(px-cx, py-cy);
}

function drawRoad(ctx, r) {
  const dx = r.x2-r.x1, dy = r.y2-r.y1;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy/len, ny = dx/len; // unit perpendicular, for wheel-rut offsets

  ctx.lineCap = 'round';
  ctx.strokeStyle = ROAD_EDGE;
  ctx.lineWidth = ROAD_WIDTH + 4;
  ctx.beginPath(); ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2); ctx.stroke();

  ctx.strokeStyle = ROAD_FILL;
  ctx.lineWidth = ROAD_WIDTH;
  ctx.beginPath(); ctx.moveTo(r.x1, r.y1); ctx.lineTo(r.x2, r.y2); ctx.stroke();

  // Worn wheel-rut lines, offset either side of center — reads as packed dirt, not pavement.
  ctx.strokeStyle = ROAD_RUT;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.45;
  const rutOffset = ROAD_WIDTH * 0.22;
  [-1, 1].forEach(s => {
    ctx.beginPath();
    ctx.moveTo(r.x1 + nx*rutOffset*s, r.y1 + ny*rutOffset*s);
    ctx.lineTo(r.x2 + nx*rutOffset*s, r.y2 + ny*rutOffset*s);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // Dirt/pebble speckle, deterministic along the segment (never Math.random()).
  const steps = Math.max(1, Math.floor(len / 14));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const cx = r.x1 + dx*t, cy = r.y1 + dy*t;
    const h = mercsHash(Math.round(r.x1), Math.round(r.y1), i, 0, 6);
    if (h % 3 !== 0) continue;
    const off = ((h>>>4) % (ROAD_WIDTH-8)) - (ROAD_WIDTH-8)/2;
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = (h & 0x10) ? ROAD_LIGHT : ROAD_DARK;
    ctx.fillRect(cx + nx*off - 1, cy + ny*off - 1, 2, 2);
    ctx.globalAlpha = 1;
  }
}

const PALM_CELL = 96, PALM_DENSITY_PCT = 35, PALM_PAD = 6;

function rectsOverlapPad(a, b, pad) {
  return a.x < b.x+b.w+pad && a.x+a.w+pad > b.x && a.y < b.y+b.h+pad && a.y+a.h+pad > b.y;
}

// A tree the map-editor's palm tool deleted from the auto-generated set —
// checked by (cgx,cgy) cell identity, independent of any wall/road changes.
function isPalmRemoved(cgx, cgy, removals) {
  return removals.some(p => p.cgx === cgx && p.cgy === cgy);
}

function drawPalmTree(ctx, px, py, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(px, py+9, 9, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5c4429';
  ctx.fillRect(px-2, py-6, 4, 14);
  const baseAngles = [-70,-35,0,35,70,105];
  for (let i=0; i<baseAngles.length; i++) {
    const jitter = ((h >>> (i*4)) % 9) - 4;
    const ang = (baseAngles[i]+jitter) * Math.PI/180;
    ctx.strokeStyle = (i % 3 === 0) ? '#5a8f47' : '#3d6b34';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px, py-6);
    ctx.quadraticCurveTo(px+Math.cos(ang)*6, py-6+Math.sin(ang)*6-4, px+Math.cos(ang)*14, py-6+Math.sin(ang)*14);
    ctx.stroke();
  }
}

// === MAP DRAWING ===

function drawMap(ctx) {
  // Only draw the portion of the map actually inside the camera's view — maps
  // can now be much bigger than one screen.
  const vx0 = Math.max(0, camera.x), vy0 = Math.max(0, camera.y);
  const vx1 = Math.min(MAP_W, camera.x + CW), vy1 = Math.min(MAP_H, camera.y + CH);

  // Floor
  ctx.fillStyle = SAND_BASE;
  ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);

  // Floor tile grid
  ctx.strokeStyle = SAND_GRID;
  ctx.lineWidth = 1;
  const gyTop = Math.max(BORDER_THICKNESS, vy0), gyBot = Math.min(MAP_H - BORDER_THICKNESS, vy1);
  for (let x = Math.max(BORDER_THICKNESS, Math.floor(vx0/TS)*TS); x < Math.min(MAP_W - BORDER_THICKNESS, vx1); x += TS) {
    ctx.beginPath(); ctx.moveTo(x,gyTop); ctx.lineTo(x,gyBot); ctx.stroke();
  }
  const gxLeft = Math.max(BORDER_THICKNESS, vx0), gxRight = Math.min(MAP_W - BORDER_THICKNESS, vx1);
  for (let y = Math.max(BORDER_THICKNESS, Math.floor(vy0/TS)*TS); y < Math.min(MAP_H - BORDER_THICKNESS, vy1); y += TS) {
    ctx.beginPath(); ctx.moveTo(gxLeft,y); ctx.lineTo(gxRight,y); ctx.stroke();
  }

  // Sand speckle / dune-patch texture — keyed on integer tile coords so it's
  // stable every frame (never Math.random(), which would flicker).
  const tGx0 = Math.floor(vx0/TS), tGx1 = Math.ceil(vx1/TS);
  const tGy0 = Math.floor(vy0/TS), tGy1 = Math.ceil(vy1/TS);
  for (let gy = tGy0; gy < tGy1; gy++) {
    for (let gx = tGx0; gx < tGx1; gx++) {
      const h = mercsHash(gx, gy, 0, 0, 3);
      const tx = gx*TS, ty = gy*TS;
      if (h % 3 === 0) {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = (h & 0x10) ? SAND_LIGHT : SAND_DARK;
        ctx.fillRect(tx + (h % (TS-2)), ty + ((h>>>4) % (TS-2)), 2, 2);
        ctx.fillRect(tx + ((h>>>8) % (TS-2)), ty + ((h>>>12) % (TS-2)), 2, 2);
        ctx.globalAlpha = 1;
      }
      if (h % 9 === 0) {
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = SAND_PATCH;
        ctx.beginPath();
        ctx.ellipse(tx+TS/2, ty+TS/2, TS*0.6, TS*0.35, (h%6)*0.5, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // Roads — decorative only, never added to collision. Culled to whatever
  // segments actually touch the visible viewport (padded by half the road
  // width so an edge-crossing road isn't dropped).
  const roadPad = ROAD_WIDTH/2 + 2;
  for (const r of ROADS) {
    const rx0 = Math.min(r.x1, r.x2) - roadPad, rx1 = Math.max(r.x1, r.x2) + roadPad;
    const ry0 = Math.min(r.y1, r.y2) - roadPad, ry1 = Math.max(r.y1, r.y2) + roadPad;
    if (rx1 < vx0 || rx0 > vx1 || ry1 < vy0 || ry0 > vy1) continue;
    drawRoad(ctx, r);
  }

  // Palm trees — decorative only, never added to collision (WALLS). Auto-
  // generated ones the map-editor's palm tool deleted are skipped via
  // PALM_REMOVALS; manually placed ones in PALM_ADDS are drawn on top.
  const pGx0 = Math.floor(vx0/PALM_CELL), pGx1 = Math.ceil(vx1/PALM_CELL);
  const pGy0 = Math.floor(vy0/PALM_CELL), pGy1 = Math.ceil(vy1/PALM_CELL);
  for (let cgy = pGy0; cgy < pGy1; cgy++) {
    for (let cgx = pGx0; cgx < pGx1; cgx++) {
      if (isPalmRemoved(cgx, cgy, PALM_REMOVALS)) continue;
      const h = mercsHash(cgx, cgy, 0, 0, 4);
      if (h % 100 >= PALM_DENSITY_PCT) continue;
      const px = cgx*PALM_CELL + 12 + (h % (PALM_CELL-24));
      const py = cgy*PALM_CELL + 12 + ((h>>>8) % (PALM_CELL-24));
      if (px < BORDER_THICKNESS+16 || py < BORDER_THICKNESS+16 ||
          px > MAP_W-BORDER_THICKNESS-16 || py > MAP_H-BORDER_THICKNESS-16) continue;
      const treeBox = { x: px-9, y: py-9, w: 18, h: 18 };
      let blocked = false;
      for (const w of WALLS) { if (rectsOverlapPad(treeBox, w, PALM_PAD)) { blocked = true; break; } }
      if (!blocked) for (const r of ROADS) { if (pointSegDist(px, py, r.x1, r.y1, r.x2, r.y2) < ROAD_WIDTH/2 + PALM_PAD) { blocked = true; break; } }
      if (!blocked) drawPalmTree(ctx, px, py, h);
    }
  }
  for (const p of PALM_ADDS) {
    if (p.x < vx0-40 || p.x > vx1+40 || p.y < vy0-40 || p.y > vy1+40) continue;
    drawPalmTree(ctx, p.x, p.y, mercsHash(Math.round(p.x), Math.round(p.y), 0, 0, 7));
  }

  // Walls / obstacles — building rooftops (or sandbag border) themed to Desert Storm.
  for (const w of WALLS) drawBuildingWall(ctx, w, MAP_W, MAP_H, vx0, vx1, vy0, vy1);
}

// === PLAYER ===

function updatePlayer(dt) {
  if (STATE !== 'playing' && STATE !== 'mpPlaying') return;
  if (STATE === 'mpPlaying' && mpDowned) {
    // Frozen (no movement/aim/shoot) until the countdown set by devtool's
    // PLAYER > Respawn Time runs out.
    mpRespawnTimer -= dt;
    if (mpRespawnTimer <= 0) respawnPlayer();
    return;
  }

  if (player.speedBoostTimer > 0) player.speedBoostTimer = Math.max(0, player.speedBoostTimer - dt);

  // FFA loadout-switch overlay ('b') captures input without pausing the world —
  // buff/invincibility timers below still tick, but movement/aim/shoot/melee don't.
  if (mpLoadoutOverlayOpen) {
    shootQueued = false;
    meleeQueued = false;
  } else {
  // Aim angle (world-space)
  player.rawAngle = Math.atan2(mouse.worldY - player.y, mouse.worldX - player.x);
  player.facing   = getFacingDir(player.rawAngle);

  // Movement
  let dx = 0, dy = 0;
  if (keys.has('w') || keys.has('arrowup'))    dy -= 1;
  if (keys.has('s') || keys.has('arrowdown'))  dy += 1;
  if (keys.has('a') || keys.has('arrowleft'))  dx -= 1;
  if (keys.has('d') || keys.has('arrowright')) dx += 1;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }

  const speedMult = player.speedBoostTimer > 0 ? CONFIG.PICKUP_SPEED.multiplier : 1;

  const nx = player.x + dx * CONFIG.PLAYER.speed * speedMult * dt;
  const ny = player.y + dy * CONFIG.PLAYER.speed * speedMult * dt;
  const res = resolveWalls(nx, ny, PLAYER_SIZE);
  player.x = res.nx; player.y = res.ny;

  // Clamp inside map
  player.x = Math.max(PLAYER_SIZE/2, Math.min(MAP_W - PLAYER_SIZE/2, player.x));
  player.y = Math.max(PLAYER_SIZE/2, Math.min(MAP_H - PLAYER_SIZE/2, player.y));

  // Camera lerp-follow player
  const tx = player.x - CW/2, ty = player.y - CH/2;
  camera.x += (tx - camera.x) * Math.min(1, CAMERA_LERP * dt);
  camera.y += (ty - camera.y) * Math.min(1, CAMERA_LERP * dt);
  camera.x = Math.max(0, Math.min(MAP_W - CW, camera.x));
  camera.y = Math.max(0, Math.min(MAP_H - CH, camera.y));

  const wantShoot = EQUIPPED_RANGED.fireMode === 'auto'
    ? (shootQueued || mouse.leftDown)
    : shootQueued;

  // Reload — R reloads on demand; also auto-triggers once the mag runs dry
  // (checked against wantShoot so holding the trigger on an auto weapon reloads too).
  if (player.reloading) {
    player.reloadTimer -= dt * 1000;
    if (player.reloadTimer <= 0) {
      const loaded = Math.min(EQUIPPED_RANGED.magSize - player.mag, player.reserve);
      player.mag += loaded;
      player.reserve -= loaded;
      player.reloading = false;
    }
  }
  const wantReload = !EQUIPPED_RANGED.unlimitedAmmo && (reloadQueued || (wantShoot && player.mag <= 0));
  reloadQueued = false;
  if (wantReload && !player.reloading && player.mag < EQUIPPED_RANGED.magSize && player.reserve > 0) {
    player.reloading = true;
    player.reloadTimer = EQUIPPED_RANGED.reloadTime;
  }

  // Shoot — semi fires once per click; auto fires while held.
  // fireCd throttles both to the weapon's cyclic rate (fireDelay), like a real firearm.
  if (player.fireCd > 0) player.fireCd -= dt * 1000;
  shootQueued = false;
  if (wantShoot && !player.reloading && player.fireCd <= 0 && (player.mag > 0 || EQUIPPED_RANGED.unlimitedAmmo)) {
    spawnBullet();
    player.fireCd = EQUIPPED_RANGED.fireDelay;
  }

  // Melee
  if (player.meleeCd > 0) player.meleeCd -= dt * 1000;
  if (meleeQueued) {
    meleeQueued = false;
    if (player.meleeCd <= 0) doMelee();
  }
  }

  // Timers
  if (player.flashTimer > 0) player.flashTimer -= dt;
  if (player.invincible > 0) player.invincible -= dt;

  // Flame Cone burn status (FFA only — coop never damages players at all).
  // Ticks independently of the loadout-overlay/movement gating above, same
  // as the buff timers just above it.
  if (mpMode === 'ffa' && player.burnTimer > 0) {
    player.burnTimer -= dt;
    player.burnTickTimer -= dt;
    if (player.burnTickTimer <= 0) {
      player.burnTickTimer += BURN_TICK_INTERVAL;
      tickPlayerBurn(player.burnDps * BURN_TICK_INTERVAL, player.burnAttackerId);
    }
    if (player.burnTimer <= 0) { player.burnTimer = 0; player.burnDps = 0; }
  }
}

// Mirrors character-editor.html's genDrawCharacter — this page is standalone
// (no shared JS module system in this project). Renders a player's MP-only
// custom look procedurally from their small saved param object, instead of
// the shared PLAYER_* sprites SPRITES.draw() reads.
function genDrawCharacter(ctx, w, h, dir, state) {
  const sf = w / 22;
  const fill = (col, x, y, bw, bh) => {
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x*sf), Math.round(y*sf), Math.max(1,Math.round(bw*sf)), Math.max(1,Math.round(bh*sf)));
  };
  const oval = (col, ecx, ecy, rx, ry) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(Math.round(ecx*sf), Math.round(ecy*sf), Math.max(1,Math.round(rx*sf)), Math.max(1,Math.round(ry*sf)), 0,0,Math.PI*2);
    ctx.fill();
  };

  const toRight = ['E','SE','NE'].includes(dir);
  const front   = ['S','SE','SW'].includes(dir);
  const back    = ['N','NE','NW'].includes(dir);
  const side    = dir === 'E' || dir === 'W';
  const diagF   = dir === 'SE' || dir === 'SW';
  const diagB   = dir === 'NE' || dir === 'NW';

  const build = Math.max(0, Math.min(2, state.build || 1));
  const bw  = 7 + build;
  const scx = 11;
  const bl  = Math.floor(scx - bw / 2);
  const br  = bl + bw;

  const HCY = 4.5;
  const HRX = side ? 3 : 3.5;
  const HRY = 3.5;
  const HCX = side        ? (toRight ? scx+1   : scx-1)
            : (diagF||diagB) ? (toRight ? scx+0.5 : scx-0.5)
            : scx;

  const BT=9, BH=6, BB=15;
  const AW=2, AH=5;

  const LT=BB, LH=5, BH2=2;
  const LG  = side ? 0 : 2;
  const LLW = Math.floor((bw-LG)/2);
  const RLW = bw-LG-LLW;
  const RLX = bl+LLW+LG;

  if (side) {
    fill(state.pants, bl,  LT,         bw, LH-BH2);
    fill(state.boots, bl,  LT+LH-BH2, bw, BH2);
  } else {
    fill(state.pants, bl,  LT,         LLW, LH-BH2);
    fill(state.pants, RLX, LT,         RLW, LH-BH2);
    fill(state.boots, bl,  LT+LH-BH2, LLW, BH2);
    fill(state.boots, RLX, LT+LH-BH2, RLW, BH2);
  }

  if (state.backpack && side) {
    const bpx = toRight ? bl-2.5 : br+0.5;
    fill('#5a4830', bpx,     BT+0.5, 2.5, BH*0.8);
    fill('#8a6840', bpx+0.5, BT+1,   1.5, BH*0.6);
  }

  if (side) {
    const bax = toRight ? bl-AW : br;
    fill(state.primary, bax, BT+1, AW, 3);
    fill(state.skin,    bax, BT+4, AW, AH-4);
  } else {
    fill(state.primary, bl-AW, BT,   AW, 3);
    fill(state.skin,    bl-AW, BT+3, AW, AH-3);
    fill(state.primary, br,    BT,   AW, 3);
    fill(state.skin,    br,    BT+3, AW, AH-3);
  }

  fill(state.primary, bl, BT, bw, BH);
  const mx = bl + bw/2;
  if (state.outfitStyle === 'vest') {
    fill(state.accent,  bl,   BT,     bw,   1.5);
    fill(state.accent,  bl+1, BT,     1,    BH);
    fill(state.accent,  br-2, BT,     1,    BH);
    fill(state.primary, bl+2, BT+1.5, bw-4, BH-1.5);
  } else if (state.outfitStyle === 'jacket') {
    fill(state.accent, bl,     BT,     bw, 1.5);
    fill(state.accent, mx-0.5, BT+1.5, 1,  BH-1.5);
  } else if (state.outfitStyle === 'hoodie') {
    fill(state.accent, bl,   BT, bw, 2.5);
    fill(state.accent, bl,   BT, 1,  BH);
    fill(state.accent, br-1, BT, 1,  BH);
  } else if (state.outfitStyle === 'armor') {
    fill(state.accent, bl,   BT,                  bw,   1);
    fill(state.accent, bl,   BT,                  1,    BH);
    fill(state.accent, br-1, BT,                  1,    BH);
    fill(state.accent, bl+1, BT+Math.floor(BH/2), bw-2, 1);
  }
  if (state.belt) {
    fill('#5a4830', bl, BB-1.5, bw, 1.5);
    if (w >= 32) fill('#c8a840', mx-1, BB-1.5, 2, 1.5);
  }

  if (state.backpack) {
    if (back) {
      fill('#5a4830', bl-0.5, BT+0.5, bw+1, BH*0.85);
      fill('#8a6840', bl,     BT+1,   bw,   BH*0.65);
    } else if (front) {
      fill('#5a4830', bl+1, BT, 1, BH);
      fill('#5a4830', br-2, BT, 1, BH);
    }
  }

  if (side) {
    const fax = toRight ? br : bl-AW;
    fill(state.primary, fax, BT,   AW, 3);
    fill(state.skin,    fax, BT+3, AW, AH-3);
  }

  if (front || side || diagF) {
    fill(state.helmet ? '#3a3a3a' : state.skin, HCX-1, BT-2, 2, 2);
  }

  if (state.helmet) {
    oval('#555555', HCX, HCY, HRX+0.5, HRY+0.5);
    if (front || side || diagF) fill('#2a2a3a', HCX-2, HCY+0.5, 4, 1.5);
  } else {
    oval(state.skin, HCX, HCY, HRX, HRY);

    if (state.hairStyle === 'short') {
      oval(state.hairColor, HCX, HCY-HRY*0.4, HRX, HRY*0.65);
    } else if (state.hairStyle === 'long') {
      oval(state.hairColor, HCX, HCY-HRY*0.4, HRX, HRY*0.65);
      fill(state.hairColor, HCX-HRX+0.5, HCY+HRY*0.4, HRX*2-1, 4);
    } else if (state.hairStyle === 'mohawk') {
      fill(state.hairColor, HCX-0.5, HCY-HRY-2.5, 1.5, HRY+2);
    } else if (state.hairStyle === 'buzz') {
      oval(state.hairColor, HCX, HCY-HRY*0.2, HRX, HRY*0.5);
    } else if (state.hairStyle === 'pony') {
      oval(state.hairColor, HCX, HCY-HRY*0.4, HRX, HRY*0.65);
      const ptX = back ? HCX-HRX+0.5 : HCX+HRX-1.5;
      fill(state.hairColor, ptX-0.5, HCY-0.5, 1.5, 6);
    }

    if (front) {
      fill('#1a1a2a', HCX-2.5, HCY+0.5, 1.5, 1.5);
      fill('#1a1a2a', HCX+1,   HCY+0.5, 1.5, 1.5);
    } else if (diagF) {
      fill('#1a1a2a', HCX-2,   HCY+0.5, 1.5, 1.5);
      fill('#1a1a2a', HCX+0.5, HCY+0.5, 1,   1);
    } else if (side) {
      const ex = toRight ? HCX+1.5 : HCX-3;
      fill('#1a1a2a', ex, HCY+0.5, 1.5, 1.5);
    }
  }
}

// Same (cx,cy)-centered convention as SPRITES.draw, so custom characters
// drop in as a straight substitute wherever a PLAYER_* sprite would render.
function drawCharacterAt(ctx, state, cx, cy, w, h, dir) {
  ctx.save();
  ctx.translate(cx - w/2, cy - h/2);
  genDrawCharacter(ctx, w, h, dir, state);
  ctx.restore();
}

function drawPlayer(ctx) {
  const anchor = HAND_ANCHORS[player.facing];
  const handX = player.x + anchor.x;
  const handY = player.y + anchor.y;
  const behind = ['N','NW','NE'].includes(player.facing);

  if (player.flashTimer > 0) {
    ctx.save(); ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(player.x, player.y, PLAYER_SIZE/2+2, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  if (STATE === 'mpPlaying' && mpDowned) ctx.globalAlpha = 0.35;
  if (behind) _drawWeapon(ctx, handX, handY, player.rawAngle);
  if (STATE === 'mpPlaying' && myCharacter) {
    drawCharacterAt(ctx, myCharacter, player.x, player.y, PLAYER_SIZE, PLAYER_SIZE, player.facing);
  } else {
    SPRITES.draw('PLAYER_' + player.facing, ctx, player.x, player.y, PLAYER_SIZE, PLAYER_SIZE, 0);
  }
  if (!behind) _drawWeapon(ctx, handX, handY, player.rawAngle);
  ctx.restore();

  // Melee arc indicator when on cooldown
  if (player.meleeCd > 0) {
    const frac = player.meleeCd / EQUIPPED_MELEE.meleeCd;
    ctx.save();
    ctx.globalAlpha = 0.25 * frac;
    ctx.strokeStyle = '#f0c840';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, EQUIPPED_MELEE.meleeRange,
            player.rawAngle - MELEE_ARC/2, player.rawAngle + MELEE_ARC/2);
    ctx.stroke();
    ctx.restore();
  }
}

// Draws a weapon by name into the current 0,0-w,h transform — custom sprite
// uploaded in devtool if present, else the default shape for that weapon
// (or fallbackName's shape, for custom weapons with no sprite fn of their own).
function drawWeaponIcon(ctx, name, w, h, fallbackName) {
  const anim = SPRITES._anims[name];
  const img  = SPRITES._images[name];
  if (anim && anim.frames[anim.frame] && anim.frames[anim.frame].complete) {
    ctx.drawImage(anim.frames[anim.frame], 0, 0, w, h);
  } else if (img && img.complete && img.naturalWidth > 0) {
    ctx.drawImage(img, 0, 0, w, h);
  } else if (SPRITE_FNS[name]) {
    SPRITE_FNS[name](ctx, w, h);
  } else {
    SPRITE_FNS[fallbackName](ctx, w, h);
  }
}

function _drawWeapon(ctx, handX, handY, rawAngle) {
  ctx.save();
  ctx.translate(handX, handY);
  ctx.rotate(rawAngle);
  ctx.translate(-GUN_W * 0.3, -GUN_H / 2);
  drawWeaponIcon(ctx, EQUIPPED_RANGED.name, GUN_W, GUN_H, 'WEAPON_PISTOL');
  ctx.restore();
}

// === ENEMIES ===

function spawnEnemy() {
  // Which enemies can appear is driven by the "ACTIVE" toggle in devtool.html
  // (ENEMY_DEFS), gated further by each one's own Unlock At time, Spawn Chance,
  // Max Alive cap (0 = unlimited), Respawn Delay, and Do Not Respawn. A type
  // that fails any of these is dropped from this wave's roll entirely — not
  // re-rolled — so it never eats a spawn slot that would otherwise go to an
  // enemy that's actually eligible right now.
  // Selection is weighted the same way pickup drops are — a single roll across
  // each eligible enemy's chance, so equal chances (the default) stay uniform.
  const types = Object.keys(ENEMY_DEFS).filter(t => {
    const d = ENEMY_DEFS[t];
    if (elapsed < d.unlockAt || d.spawnChance <= 0) return false;
    if (d.maxAlive > 0 && enemies.filter(e => e.type === t && e.deathTimer < 0).length >= d.maxAlive) return false;
    if (d.noRespawn === 'on' && enemyNeverRespawn.has(t)) return false;
    if (d.respawnDelay > 0 && enemyLastDeathTime[t] !== undefined && elapsed - enemyLastDeathTime[t] < d.respawnDelay) return false;
    return true;
  });
